[package]
name = "spike-embed"
version = "0.0.0"
edition = "2021"
publish = false

# Ticket #3 prototype. Throwaway: proves (or falsifies) the player-surface shape
# of ADR-0003/0007 on Windows. Deliberately NOT built on the real Host layout.
#
# libmpv is loaded at RUNTIME via libloading, so this needs no import library,
# no .def file and no lib.exe step. The real Host will use the libmpv2 crate.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
