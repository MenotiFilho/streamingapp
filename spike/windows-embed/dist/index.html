<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spike-embed</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        /* Transparent on purpose: mpv's child window must show through. */
        background: transparent;
        color: #fff;
        font: 14px/1.4 system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      /* Covers the video area. Every click that arrives here is proof that the
         webview still receives input where mpv is rendering underneath. */
      #clickcatcher {
        position: fixed;
        inset: 0;
        z-index: 1;
        cursor: crosshair;
      }
      #bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        background: rgba(12, 12, 14, 0.82);
        backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      button {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: rgba(255, 255, 255, 0.26); }
      #props {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 2;
        max-width: 46ch;
        padding: 10px 12px;
        background: rgba(12, 12, 14, 0.72);
        border-radius: 10px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
        pointer-events: none;
      }
      #note {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 2;
        padding: 10px 12px;
        background: rgba(12, 12, 14, 0.72);
        border-radius: 10px;
        font-size: 12px;
        max-width: 30ch;
        pointer-events: none;
      }
      #log {
        position: fixed;
        bottom: 64px;
        right: 12px;
        z-index: 2;
        padding: 8px 10px;
        background: rgba(12, 12, 14, 0.72);
        border-radius: 8px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        max-width: 40ch;
        pointer-events: none;
      }
      body.hideui #bar,
      body.hideui #props,
      body.hideui #note,
      body.hideui #log { display: none; }
    </style>
  </head>
  <body>
    <div id="props">waiting for mpv…</div>
    <div id="note">
      Click anywhere over the video to log a click.<br />
      Keys: <b>h</b> hides this UI.
    </div>
    <div id="log"></div>

    <div
      id="clickcatcher"
      onclick="clicked(event)"
      onmousemove="moved(event)"
    ></div>

    <div id="bar">
      <button onclick="cmd(['cycle', 'pause'], 'pause/play')">⏯ Pause/Play</button>
      <button onclick="cmd(['seek', '-10'], 'seek -10')">⏪ 10s</button>
      <button onclick="cmd(['seek', '10'], 'seek +10')">10s ⏩</button>
      <button onclick="cmd(['seek', '50', 'absolute-percent'], 'seek 50%')">Seek 50%</button>
      <button onclick="cmd(['add', 'speed', '-0.25'], 'speed down')">Speed −</button>
      <button onclick="cmd(['add', 'speed', '0.25'], 'speed up')">Speed +</button>
      <button onclick="cmd(['cycle', 'sub-visibility'], 'toggle subs')">Subtitles</button>
      <button onclick="cmd(['set', 'video-crop', '1920x800+0+140'], 'crop')">Crop</button>
      <button onclick="cmd(['set', 'video-crop', 'no'], 'crop off')">Crop off</button>
      <button onclick="cmd(['no-osd', 'cycle-values', 'video-aspect-override', '16:9', '4:3', 'no'], 'aspect')">Aspect</button>
      <button onclick="document.body.classList.toggle('hideui')">Hide UI</button>
    </div>

    <script>
      const { invoke } = window.__TAURI__.core;
      const logEl = document.getElementById('log');
      const propsEl = document.getElementById('props');
      const messages = [];

      function say(msg) {
        messages.unshift(`${new Date().toISOString().slice(11, 19)}  ${msg}`);
        logEl.textContent = messages.slice(0, 6).join('\n');
      }

      async function clicked(event) {
        const name = `video-area x=${event.clientX} y=${event.clientY}`;
        await invoke('log_click', { name });
        say(`click at ${event.clientX},${event.clientY}`);
      }

      let moveTick = 0;
      function moved(event) {
        if (++moveTick % 60 === 0) {
          invoke('log_click', { name: `mousemove x=${event.clientX} y=${event.clientY}` });
        }
      }

      async function cmd(args, label) {
        const rc = await invoke('mpv_cmd', { args });
        await invoke('log_click', { name: `command ${label || args.join(' ')}` });
        say(`${label || args.join(' ')} → ${rc}`);
      }

      window.addEventListener('keydown', async (e) => {
        if (e.key === 'h') document.body.classList.toggle('hideui');
        if (e.key === ' ') { e.preventDefault(); cmd(['cycle', 'pause'], 'space'); }
      });

      // Self-test: proves the JS -> Rust -> mpv path without a human clicking.
      setTimeout(() => cmd(['seek', '50', 'absolute-percent'], 'auto-seek-50%'), 5000);
      setTimeout(() => cmd(['set', 'video-crop', '1600x600+400+600'], 'auto-crop-on'), 8000);
      setTimeout(() => cmd(['set', 'video-crop', 'no'], 'auto-crop-off'), 12000);

      setInterval(async () => {
        try {
          const raw = await invoke('mpv_props');
          const p = JSON.parse(raw);
          propsEl.textContent =
            `hwdec        ${p['hwdec-current']}\n` +
            `vo-configured ${p['vo-configured']}\n` +
            `size         ${p['width']}x${p['height']}\n` +
            `params       ${p['video-params']}\n` +
            `drops        ${p['frame-drop-count']}\n` +
            `display-fps  ${p['display-fps']}\n` +
            `est-vf-fps   ${p['estimated-vf-fps']}\n` +
            `bitrate      ${p['video-bitrate']}\n` +
            `colorspace-hint ${p['target-colorspace-hint']}\n` +
            `video-crop   ${p['video-crop']}`;
        } catch (err) {
          propsEl.textContent = `props error: ${err}`;
        }
      }, 1000);
    </script>
  </body>
</html>
