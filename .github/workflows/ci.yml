name: CI

# The same suites AGENTS.md asks for, run in the same development image, on every
# pull request into `main` and on every push that lands there. The image is the
# only supported toolchain: the Host links libmpv and the window needs WebKitGTK,
# so a bare `ubuntu-latest` job would not be the environment the code is built in.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: streamingapp-dev:ci
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev.Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install the window's dependencies
        run: .github/scripts/dev-run.sh pnpm install --frozen-lockfile

      - name: Typecheck the window
        run: .github/scripts/dev-run.sh pnpm typecheck

      - name: Build the window
        run: .github/scripts/dev-run.sh pnpm build

      - name: Test the window
        run: .github/scripts/dev-run.sh pnpm test

      - name: Check Rust formatting
        run: .github/scripts/dev-run.sh cargo fmt --check

      - name: Clippy
        run: .github/scripts/dev-run.sh cargo clippy --all-targets -- -D warnings

      - name: Test the Rust workspace
        run: .github/scripts/dev-run.sh cargo test --workspace --no-fail-fast
