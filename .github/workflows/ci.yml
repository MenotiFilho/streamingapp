name: CI

# The same suites AGENTS.md asks for, run in the same development image, on every
# pull request into `main` and on every push that lands there. The image is the
# only supported toolchain: the Host links libmpv and the window needs WebKitGTK,
# so a bare `ubuntu-latest` job would not be the environment the code is built in.
#
# A docs-only pull request still runs `verify` — it is the required check — but
# the job short-circuits before building the image. Everything else, including
# this workflow, runs the full list.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: streamingapp-dev:ci
      # Incremental artifacts are large and rarely reused across a fresh
      # checkout; the dependency artifacts below are the ones worth keeping.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `verify` is required by `main`'s protection, so it must conclude on every
      # pull request. Path filters would skip the whole workflow and leave the
      # check "Expected" forever; deciding inside the job keeps that contract.
      - name: Decide whether the suites are needed
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          code=false
          # --no-renames: a rename into docs/ deletes its old path, and rename
          # detection would hide that side of it from --name-only.
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*) ;;
              *)
                code=true
                break
                ;;
            esac
          done < <(git diff --no-renames --name-only "FETCH_HEAD...HEAD")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then
            echo "Code changed: the suites run."
          else
            echo "Docs only: the suites are skipped."
          fi

      - name: Set up Buildx
        if: steps.scope.outputs.code == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build the development image
        if: steps.scope.outputs.code == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev.Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container keeps its build output in named volumes, which are fresh
      # on every runner. These host directories are restored instead, so a run
      # reuses the cargo registry and the compiled dependencies rather than
      # downloading and rebuilding them from scratch. The container runs as the
      # runner user, so `actions/cache` can read what it wrote when saving.
      #
      # A pull request's cache belongs to that PR's merge ref: the first run on
      # a PR populates it, and later commits to the same PR restore it.
      - name: Restore the Rust build tree
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/cargo-home
            ${{ runner.temp }}/cargo-target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'docker/dev.Dockerfile') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Restore the pnpm store
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Point the container at the cached directories
        if: steps.scope.outputs.code == 'true'
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/cargo-home" \
            "$RUNNER_TEMP/cargo-target" \
            "$RUNNER_TEMP/node-modules" \
            "$RUNNER_TEMP/pnpm-store"
          {
            echo "CI_CARGO_HOME=$RUNNER_TEMP/cargo-home"
            echo "CI_CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target"
            echo "CI_NODE_MODULES=$RUNNER_TEMP/node-modules"
            echo "CI_PNPM_STORE=$RUNNER_TEMP/pnpm-store"
          } >> "$GITHUB_ENV"

      - name: Install the window's dependencies
        if: steps.scope.outputs.code == 'true'
        run: .github/scripts/dev-run.sh pnpm install --frozen-lockfile --store-dir=/pnpm-store

      - name: Typecheck the window
        if: steps.scope.outputs.code == 'true'
        run: .github/scripts/dev-run.sh pnpm typecheck

      - name: Build the window
        if: steps.scope.outputs.code == 'true'
        run: .github/scripts/dev-run.sh pnpm build

      # The staged Remote is a second build, not a second entry of the window's:
      # `pnpm build` must never put it in `dist/`, which is what Tauri embeds
      # (ADR-0035 §3).
      - name: Build the Remote
        if: steps.scope.outputs.code == 'true'
        run: .github/scripts/dev-run.sh pnpm build:remote

      # The artifact is committed and compiled in, so a build that differs from
      # the tree is a Remote that silently differs from its source. `git status`
      # is the check rather than a checksum: the container runs as root and may
      # own the files it wrote, and git reads the contents either way.
      - name: Check the committed Remote artifact is current
        if: steps.scope.outputs.code == 'true'
        run: |
          set -euo pipefail
          stale="$(git status --porcelain -- crates/host-wire/remote-next)"
          if [ -n "$stale" ]; then
            printf '%s\n' "$stale"
            echo "crates/host-wire/remote-next is stale: run pnpm build:remote and commit it." >&2
            exit 1
          fi

      # The Remote belongs to the Host's binary, never to the window's bundle.
      - name: Check the Remote stays out of the window's bundle
        if: steps.scope.outputs.code == 'true'
        run: test ! -e dist/remote.html

      - name: Test the window
        if: steps.scope.outputs.code == 'true'
        run: .github/scripts/dev-run.sh pnpm test

      - name: Check Rust formatting
        if: steps.scope.outputs.code == 'true'
        run: .github/scripts/dev-run.sh cargo fmt --check

      - name: Clippy
        if: steps.scope.outputs.code == 'true'
        run: .github/scripts/dev-run.sh cargo clippy --all-targets -- -D warnings

      - name: Test the Rust workspace
        if: steps.scope.outputs.code == 'true'
        run: .github/scripts/dev-run.sh cargo test --workspace --no-fail-fast

      - name: Nothing to build
        if: steps.scope.outputs.code != 'true'
        run: echo "Docs-only change; no build or test step is needed."
