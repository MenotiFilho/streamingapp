# The Host's Rust workspace.
#
# `crates/` holds the Host itself, free of the UI toolkit, so that most tests
# never compile Tauri. `src-tauri/` is the thin app shell that puts a window in
# front of it. See `docs/adr/0008`.
#
# Build and test inside the dev container:
#
#   docker compose exec dev cargo test
#   docker compose exec dev cargo clippy --all-targets -- -D warnings
#   docker compose exec dev cargo fmt --check
[workspace]
resolver = "2"
members = [
    "crates/host-core",
    "crates/host-addon",
    "crates/host-mpv",
    "crates/host-sqlite",
    "crates/host-logging",
    "crates/host-secret",
    "crates/host-wire",
    "crates/host-live",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.85"

[workspace.dependencies]
host-core = { path = "crates/host-core" }
host-addon = { path = "crates/host-addon" }
host-mpv = { path = "crates/host-mpv" }
host-secret = { path = "crates/host-secret" }
host-sqlite = { path = "crates/host-sqlite" }
host-logging = { path = "crates/host-logging" }
host-wire = { path = "crates/host-wire" }
host-live = { path = "crates/host-live" }

base64 = "0.22"
flate2 = "1"
getrandom = "0.3"
mdns-sd = "0.21"
percent-encoding = "2"
keyring = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tungstenite = { version = "0.30", default-features = false }
ureq = { version = "3", default-features = false, features = ["gzip", "native-tls"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
