[package]
name = "host-torrent"
description = "The Host's Torrent engine: the bundled Go program it starts, and the stdio protocol it speaks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The seam's own types and nothing else (ADR-0042 §1): the vocabulary the engine
# is spoken to in, and the trait this crate implements.
host-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# A tiny scripted stand-in for the Go engine, which the crate's own tests spawn
# in its place: it speaks the stdio protocol through this crate's codec and does
# whatever its arguments say. It is a test tool and never bundled, so a build of
# the Host (`-p streamingapp`) does not compile it.
[[bin]]
name = "fake-torrent-engine"
path = "src/bin/fake_torrent_engine.rs"
test = false
doc = false
