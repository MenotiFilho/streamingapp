            if (motion.animate && !motion.reduced) {
              motion.animate(parent.scrollLeft, target, {
                ...quickTransition(),
                onUpdate: (value) => { parent.scrollLeft = value; },
              });
            } else {
              parent.scrollLeft = target;
            }
            return;
          }
          parent = parent.parentElement;
        }
      }
      function focusNode(node) {
        node.focus({ preventScroll: true });
        revealScroll(node);
      }
      function moveFocus(scope, direction) {
        const items = focusables(scope);
        if (items.length === 0) { return false; }
        const current = items.includes(document.activeElement) ? document.activeElement : null;
        if (!current) {
          focusNode(items[0]);
          return true;
        }
        const others = items.filter((element) => element !== current);
        if (others.length === 0) { return false; }
        const pick = nearest(rectOf(current), others.map(rectOf), direction);
        if (pick < 0) { return false; }
        focusNode(others[pick]);
        return true;
      }
      function focusKey(element) {
        if (!element) { return null; }
        if (element.dataset && element.dataset.focusKey) { return element.dataset.focusKey; }
        return element.id ? "id:" + element.id : null;
      }
      function focusByKey(key) {
        if (!key) { return false; }
        const target = Array.from(document.querySelectorAll("[data-focus-key]"))
          .find((element) => element.dataset.focusKey === key) ||
          document.getElementById(key.replace(/^id:/, ""));
        if (target) { focusNode(target); return true; }
        return false;
      }
      function focusFirst(selector) {
        const target = document.querySelector(selector + " [data-focusable], " + selector + "[data-focusable]");
        if (target) { focusNode(target); return true; }
        return false;
      }

      // ---------------------------------------------------------------------
      // The connection: the same door the Host's window uses, over the wire.
      // ---------------------------------------------------------------------
      const net = {
        socket: null,
        nextId: 1,
        pending: new Map(),
        connect(onFrame) {
          const scheme = location.protocol === "https:" ? "wss" : "ws";
          this.socket = new WebSocket(scheme + "://" + location.host + "/");
          this.socket.addEventListener("open", () => onFrame({ open: true }));
          this.socket.addEventListener("message", (event) => {
            let frame;
            try { frame = JSON.parse(event.data); } catch (e) { return; }
            onFrame({ frame });
          });
          this.socket.addEventListener("close", () => onFrame({ close: true }));
        },
        send(frame) {
          if (this.socket && this.socket.readyState === WebSocket.OPEN) {
            this.socket.send(JSON.stringify(frame));
            return true;
          }
          return false;
        },
        command(action, resolve, reject) {
          const id = this.nextId++;
          this.pending.set(id, { resolve, reject });
          if (!this.send({ version: VERSION, id, command: action })) {
            this.pending.delete(id);
            reject({ kind: "unreachable", detail: "the Host is not connected" });
          }
        },
      };

      /** A value with object keys in one order, so two builds of one Action agree. */
      function ordered(value) {
        if (Array.isArray(value)) { return value.map(ordered); }
        if (value !== null && typeof value === "object") {
          const sorted = {};
          Object.keys(value).sort().forEach((key) => { sorted[key] = ordered(value[key]); });
          return sorted;
        }
        return value;
      }
      function actionKey(action) { return JSON.stringify(ordered(action)); }
      function sendCommand(action) {
        return new Promise((resolve, reject) => {
          if (CAPABILITIES.indexOf(action.type) === -1) {
            reject({ kind: "malformed", detail: "this remote has no control for " + action.type });
            return;
          }
          net.command(action, resolve, reject);
        });
      }
      function dispatch(action) {
        // A relative Action in flight does not absorb the next one: two rewinds
        // are two steps (#137). Everything else joins an identical Action
        // already in flight, so a double press sends one.
        if (REPEATING_ACTIONS.has(action.type)) { return sendCommand(action); }
        const key = actionKey(action);
        const held = commandsInFlight.get(key);
        if (held) { return held; }
        const started = sendCommand(action);
        commandsInFlight.set(key, started);
        const release = () => {
          if (commandsInFlight.get(key) === started) { commandsInFlight.delete(key); }
        };
        started.then(release, release);
        return started;
      }

      // ---------------------------------------------------------------------
      // This client's own state. None of it is shared: which row is paged,
      // which Title is open, which Streams are listed and which destination is
      // showing all belong to this device (ADR-0005). What the Host publishes —
      // playback, the library, the Addons — is rendered from the Snapshot.
      // ---------------------------------------------------------------------
      const state = {
        token: null,
        device: null,
        snapshot: null,
        online: false,
        error: null,
        // The Stream buffer pair the preferences chips draw before the Host has
        // answered a press, so two quick presses compose instead of the second
        // reverting the first (ADR-0026).
        bufferDraft: null,
        // The browse surface
        destination: "home",
        heroIndex: 0,
        heroHeld: false,
        catalogueKeys: null,
        tmdbHeld: null,
        home: { rows: [], loading: false, generation: 0, paging: [] },
        discover: { kind: MOVIE, genre: null, feed: blankFeed(), loading: false, generation: 0 },
        search: {
          draft: "", committed: null, movie: blankFeed(), series: blankFeed(),
          paging: [], catalog: { rows: null, loading: false, failure: null },
          generation: 0, status: null,
        },
        unplayable: new Set(),
        addons: { expanded: null, status: null },
        // The level stack above the destination, outermost first.
        levels: [],
        // The three surfaces. `sheet` is the open drawer's kind: null, "av",
        // "episodes", "speed", "chapters" or "picture". Volume is the one menu
        // that opens a popover over the card instead of the shared drawer.
        cast: false,
        sheet: null,
        sheetOpened: false,
        episodes: null,
        showStatistics: false,
        // What a render should focus, and what a surface returns to.
        focusTarget: null,
        sheetReturn: null,
        castReturn: null,
        seriesCache: new Map(),
        // Signatures that decide when a region is redrawn.
        screenSignature: null,
        levelSignature: null,
        miniSignature: null,
        castSignature: null,
        sheetSignature: null,
        heroTimer: null,
      };
      try { state.token = window.localStorage.getItem(TOKEN_KEY); } catch (e) { state.token = null; }

      // Lookups the delegated handlers read, rebuilt as things are drawn.
      const metaIndex = new Map();
      const videoIndex = new Map();
      const rowIndex = new Map();
      const groupIndex = new Map();
      const entryIndex = new Map();
      const cropIndex = new Map();
      const aspectIndex = new Map();
      /** The Actions in flight, so an identical press joins the first (#137). */
      const commandsInFlight = new Map();
      /** Actions that are one more step: two presses are two steps, never one. */
      const REPEATING_ACTIONS = new Set(["seek", "next_chapter", "previous_chapter", "autocrop"]);
      /** Controls whose Action waits on the Host: these say so and lock (#137). */
      const WAITING_CONTROLS = new Set([
        "open-card", "open-featured", "resume", "play-film", "title-play-film",
        "title-episode", "choose-stream", "next-episode", "previous-episode",
      ]);

      // ---------------------------------------------------------------------
      // Drawing
      // ---------------------------------------------------------------------
      function playback() { return state.snapshot ? state.snapshot.playback : null; }

      // ---------------------------------------------------------------------
      // Motion (ADR-0031): the staged page imports the pinned `animate` bundle
      // from the Host, reads the same spring durations as the window, and drops
      // movement under the system's reduced-motion setting while keeping the
      // fades. Before the asset arrives, or where it cannot, every panel is
      // simply drawn at its final position.
      // ---------------------------------------------------------------------
      const motion = { animate: null, reduced: false };

      function motionSeconds(property, fallback) {
        const value = getComputedStyle(document.documentElement).getPropertyValue(property).trim();
        const match = /^([\d.]+)\s*(ms|s)$/.exec(value);
        if (!match) { return fallback; }
        const amount = Number(match[1]);
        return match[2] === "ms" ? amount / 1000 : amount;
      }

      function panelTransition() {
        return {
          type: "spring",
          visualDuration: motionSeconds("--rep-motion-panel", 0.24),
          bounce: 0,
        };
      }

      /** A focus reveal inside a rail, and other small state changes. */
      function quickTransition() {
        return {
          type: "spring",
          visualDuration: motionSeconds("--rep-motion-quick", 0.14),
          bounce: 0,
        };
      }

      function fadeTransition() {
        return {
          duration: motionSeconds("--rep-motion-fade", 0.14),
          ease: [0.22, 1, 0.36, 1],
        };
      }

      /**
       * A panel rises 12–16px with a fade on the panel spring. Under reduced
       * motion the movement is gone and the fade stays (design record §6).
       */
      function animateRise(node, fromY) {
        if (!node || !motion.animate) { return; }
        const keyframes = motion.reduced
          ? [{ opacity: 0 }, { opacity: 1 }]
          : [{ opacity: 0, y: fromY === undefined ? 14 : fromY }, { opacity: 1, y: 0 }];
        motion.animate(node, keyframes, motion.reduced ? fadeTransition() : panelTransition());
      }

      /** The same shape in reverse, then the caller's work. */
      function animateSink(node, done) {
        if (!node || !motion.animate) { done(); return; }
        const keyframes = motion.reduced
          ? [{ opacity: 1 }, { opacity: 0 }]
          : [{ opacity: 1, y: 0 }, { opacity: 0, y: 16 }];
        const controls = motion.animate(
          node,
          keyframes,
          motion.reduced ? fadeTransition() : panelTransition(),
        );
        controls.finished.then(done, done);
      }

      /** The scrim under a drawer fades in with it, never slides. */
      function animateFade(node, to) {
        if (!node) { return; }
        if (!motion.animate) {
          node.style.opacity = String(to);
          return;
        }
        motion.animate(node, { opacity: to }, fadeTransition());
      }

      /**
       * The module script hands the imported `animate` here. The media query is
       * read at call time and again on every change, so a person who turns
       * reduced motion on keeps the fades without the movement.
       */
      function startRepertoryMotion(animate) {
        motion.animate = animate;
        if (typeof window.matchMedia !== "function") {
          return;
        }
        const media = window.matchMedia("(prefers-reduced-motion: reduce)");
        motion.reduced = media.matches;
        const update = () => { motion.reduced = media.matches; };
        if (typeof media.addEventListener === "function") {
          media.addEventListener("change", update);
        } else if (typeof media.addListener === "function") {
          media.addListener(update);
        }
      }
      window.startRepertoryMotion = startRepertoryMotion;

      /**
       * Open one of the shared playback drawers. Audio & Subtitles, Episodes,
       * Speed, Chapters and Picture all use this one surface and its Done/Back
       * rule; Volume is the exception and opens its own popover.
       */
      function openMenu(menu, returnKey) {
        state.sheetReturn = returnKey || focusKey(document.activeElement);
        state.sheetOpened = true;
        state.sheetSignature = null;
        state.sheet = menu;
        if (menu !== "episodes") { state.episodes = null; }
        state.focusTarget = "sheet";
        paint();
      }

      /**
       * Close the shared drawer at once. Its last frame is cloned into a
       * pointer-inert ghost and sinks with the panel spring, so the state, the
       * focus and a second Back are never held by the animation (ADR-0031 §4).
       */
      function closeSheet() {
        const sheet = $("sheet");
        const panel = sheet.querySelector(".sheet-panel");
        if (motion.animate && panel && !sheet.classList.contains("hidden")) {
          const ghost = panel.cloneNode(true);
          const rect = panel.getBoundingClientRect();
          ghost.classList.add("sheet-ghost");
          ghost.setAttribute("aria-hidden", "true");
          ghost.querySelectorAll("[data-focusable]").forEach((node) => {
            node.removeAttribute("data-focusable");
            node.tabIndex = -1;
          });
          ghost.style.left = rect.left + "px";
          ghost.style.top = rect.top + "px";
          ghost.style.width = rect.width + "px";
          ghost.style.height = rect.height + "px";
          document.body.appendChild(ghost);
          animateSink(ghost, () => ghost.remove());
        }
        state.sheet = null;
        state.episodes = null;
        state.focusTarget = state.sheetReturn ? { key: state.sheetReturn } : "cast";
        paint();
      }

      function showPairing(message) {
        $("pairing").classList.remove("hidden");
        $("app").classList.add("hidden");
        if (message) { $("pair-error").textContent = message; }
      }
      function showApp() {
        $("pairing").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("pair-error").textContent = "";
      }

      function renderConnection() {
        const node = $("connection");
        if (!state.device) { node.textContent = ""; return; }
        node.dataset.live = pressed(state.online);
        node.textContent = state.online ? "live" : "reconnecting\u2026";
      }

      function renderError() {
        const node = $("error");
        const p = playback();
        const failure = p && p.failure;
        const message = state.error ? explain(state.error)
          : failure ? failure + " Pick another Stream from the list." : "";
        node.textContent = message;
        node.classList.toggle("hidden", !message);
      }

      function renderNav() {
        $("bottom-nav").innerHTML = html`${NAV.map((entry) => html`
          <button type="button" class="nav-item" data-focusable data-a="destination"
                  data-destination="${entry.id}" data-focus-key="nav-${entry.id}"
                  aria-current="${state.destination === entry.id ? "page" : "false"}">
            ${mark(entry.id, 1.7)}
            <span>${entry.label}</span>
          </button>
        `)}`.markup;
      }

      // --- what draws, and when --------------------------------------------
      function screenSignature() {
        const s = state.snapshot;
        if (!s) { return "none"; }
        const addons = s.addons.map((addon) => addon.id + ":" + addon.version).join("|");
        const progress = s.watchProgress
          .map((entry) => entry.video.id + ":" + entry.position + ":" + entry.duration + ":" + entry.watched)
          .join("|");
        switch (state.destination) {
          case "home":
            return ["home", addons, progress, JSON.stringify(s.featuredCatalog),
              state.home.rows.map((row) => keyOf(row) + ":" + row.metas.length + ":" + row.offset + ":" +
                row.done + ":" + (row.failure ? row.failure.kind : "")).join(",")].join("::");
          case "discover":
            return ["discover", s.protection.tmdbHeld, addons,
              [...state.unplayable].sort().join(","), state.discover.kind,
              state.discover.genre, state.discover.loading, state.discover.feed.page,
              state.discover.feed.items.map((meta) => meta.id).join(","),
              state.discover.feed.failure ? state.discover.feed.failure.kind : ""].join("::");
          case "search":
            return ["search", s.protection.tmdbHeld, addons,
              [...state.unplayable].sort().join(","), state.search.committed, state.search.status,
              state.search.movie.page, state.search.series.page,
              state.search.movie.items.map((meta) => meta.id).join(","),
              state.search.series.items.map((meta) => meta.id).join(","),
              state.search.catalog.rows ? state.search.catalog.rows.map(keyOf).join(",") : "none",
              state.search.catalog.loading].join("::");
          case "library":
            return ["library", s.protection.stremioHeld].join("::");
          case "addons":
            return ["addons", addons, state.addons.expanded, state.addons.status ? state.addons.status.kind : ""].join("::");
          case "settings":
            return "settings";
          default:
            return state.destination;
        }
      }

      function levelSignature() {
        const level = state.levels[state.levels.length - 1];
        if (!level) { return "none"; }
        const s = state.snapshot;
        switch (level.kind) {
          case "title":
            return ["title", level.loading, level.title ? level.title.id : "", level.shownSeason,
              level.selected ? level.selected.id : "", level.failure ? level.failure.kind : ""].join("|");
          case "streams":
            return ["streams", level.loading, level.groups ? level.groups.length : "",
              level.groups ? level.groups.map((group) => group.addon + ":" + group.streams.length).join(",") : "",
              level.failure ? level.failure.kind : "", level.chosen ? streamName(level.chosen) : ""].join("|");
          case "settings":
            return ["settings", level.category, JSON.stringify({
              addons: s ? s.addons.map((addon) => addon.id + ":" + addon.version) : [],
              protection: s ? s.protection : null,
              address: s ? s.address : null,
              pairing: s ? s.pairingCode : null,
              devices: s ? s.devices.map((device) => device.id) : [],
              preferences: s ? s.preferences : null,
              featured: s ? s.featuredCatalog : null,
            }), level.failure ? level.failure.kind : ""].join("|");
          case "confirm":
            return ["confirm", level.id, level.failure ? level.failure.kind : ""].join("|");
          default:
            return level.kind;
        }
      }

      function miniSignature() {
        const p = playback();
        if (!p || !watching(p.state)) { return "none"; }
        return JSON.stringify({
          state: p.state,
          playing: p.nowPlaying ? p.nowPlaying.video.type + "/" + p.nowPlaying.video.id : null,
          episode: p.episode,
          online: state.online,
          device: state.device ? state.device.name : null,
        });
      }

      function castSignature() {
        const p = playback();
        if (!p || !watching(p.state)) { return "none"; }
        return JSON.stringify({
          open: state.cast,
          sheet: state.sheet,
          showStatistics: state.showStatistics,
          state: p.state,
          playing: p.nowPlaying ? p.nowPlaying.video.type + "/" + p.nowPlaying.video.id : null,
          episode: p.episode,
          duration: p.duration,
          tracks: p.tracks,
          muted: p.muted,
          volume: p.volume,
          speed: p.speed,
          chapters: p.chapters,
          chapter: p.chapter,
          crop: p.crop,
          aspect: p.aspect,
          resolution: p.resolution,
          statistics: p.statistics,
          failure: p.failure,
          online: state.online,
          device: state.device ? state.device.name : null,
          address: state.snapshot ? state.snapshot.address : null,
          progress: state.snapshot
            ? state.snapshot.watchProgress.map((entry) => entry.video.id + ":" + entry.title.name + ":" +
              entry.title.poster + ":" + entry.title.background).join("|")
            : "",
        });
      }

      function sheetSignature() {
        const p = playback();
        if (!state.sheet || !p || !watching(p.state)) { return "none"; }
        return JSON.stringify({
          menu: state.sheet,
          tracks: p.tracks,
          delay: p.subtitleDelay,
          subtitleScale: state.snapshot ? state.snapshot.preferences.subtitleScale : null,
          speed: p.speed,
          chapters: p.chapters,
          chapter: p.chapter,
          crop: p.crop,
          aspect: p.aspect,
          resolution: p.resolution,
          statistics: p.statistics,
          showStatistics: state.showStatistics,
          episodes: state.episodes
            ? {
                loading: state.episodes.loading,
                title: state.episodes.title ? state.episodes.title.id : null,
                shownSeason: state.episodes.shownSeason,
                failure: state.episodes.failure ? state.episodes.failure.kind : null,
                loadingStreams: state.episodes.loadingStreams,
              }
            : null,
        });
      }

      // --- the base screen -------------------------------------------------
      function renderScreen() {
        const view = captureView();
        metaIndex.clear();
        rowIndex.clear();
        entryIndex.clear();
        const screen = $("screen");
        screen.innerHTML = renderDestination().markup;
        state.screenSignature = screenSignature();
        scheduleHero();
        if (!state.focusTarget) { restoreView(view); }
      }

      function renderDestination() {
        if (!state.snapshot) { return html`<p class="note">Waiting for the Host\u2026</p>`; }
        switch (state.destination) {
          case "home": return renderHome();
          case "discover": return renderDiscover();
          case "search": return renderSearch();
          case "library": return renderLibrary();
          case "addons": return renderAddons();
          case "settings": return renderSettings();
          default: return renderHome();
        }
      }

      // --- Home -------------------------------------------------------------
      function renderHome() {
        const s = state.snapshot;
        const rows = state.home.rows;
        const catalogs = declaredCatalogs(s);
        const featured = featuredRow(s, rows);
        const slides = featured ? heroSlides(featured.metas) : [];
        const active = slides.length > 0 ? Math.min(state.heroIndex, slides.length - 1) : 0;
        const slide = slides[active];
        const heroMeta = slide && featured
          ? featured.metas.find((meta) => meta.id === slide.id) || null : null;
        if (heroMeta) { metaIndex.set("hero|" + slide.id, heroMeta); }
        const empty = catalogs.length === 0;

        return html`
          <h1 class="screen-title">Home</h1>
          ${slide
            ? html`
                <section class="hero" aria-label="Featured">
                  <button type="button" class="hero-button lift" data-focusable data-focus-key="home-hero"
                          data-a="open-featured" data-ref="hero|${slide.id}" aria-label="Featured Title: ${slide.name}. Open Title.">
                    ${slide.art ? html`<img class="hero-art" src="${slide.art}" alt="" data-art="${slide.artKind}" />` : null}
                    <span class="hero-scrim" aria-hidden="true"></span>
                    <span class="hero-copy">
                      <span class="hero-kicker">${featured ? featured.name : "Featured"}</span>
                      <span class="hero-name">${slide.name}</span>
                      ${slide.description ? html`<span class="hero-desc">${slide.description}</span>` : null}
                    </span>
                  </button>
                  ${slides.length > 1
                    ? html`<div class="hero-dots">${slides.map((dot, index) => html`
                        <button type="button" class="hero-dot" data-focusable data-a="hero-slide"
                                data-slide="${index}" data-focus-key="hero-dot-${index}"
                                aria-current="${index === active}">
                          <span class="visually-hidden">Slide ${index + 1}</span>
                        </button>`)}</div>`
                    : null}
                </section>`
            : null}

          ${s.watchProgress.length > 0
            ? html`
                <section aria-labelledby="continue-heading">
                  <div class="section-head">
                    <h2 id="continue-heading">Continue watching</h2>
                    <span class="section-tag">Host Watch progress</span>
                  </div>
                  <div class="strip">
                    ${s.watchProgress.map((entry) => {
                      const key = entry.title.type + "/" + entry.video.id;
                      entryIndex.set(key, entry);
                      const art = continueArt(entry);
                      const fraction = progressOf(entry);
                      const playable = resumable(entry);
                      return html`
                        <button type="button" class="continue lift" data-focusable
                                data-focus-key="continue-${entry.video.id}"
                                data-a="resume" data-ref="${key}"
                                ${off(!playable)} data-unplayable="${!playable}">
                          <span class="continue-frame">
                            ${art ? html`<img class="continue-art" src="${art}" alt="" loading="lazy" />` : null}
                            ${fraction !== null
                              ? html`<span class="continue-bar"><span style="width:${Math.round(fraction * 100)}%"></span></span>`
                              : null}
                          </span>
                          <span class="continue-info">
                            <span class="continue-name">${cardName(entry)}</span>
                            <span class="continue-note" data-warn="${!playable}">${cardNote(entry)}</span>
                          </span>
                        </button>`;
                    })}
                  </div>
                </section>`
            : null}

          ${empty
            ? html`
                <div class="empty">
                  <h2>${s.addons.length === 0 ? "No Addons are configured" : "No Catalogs are configured"}</h2>
                  <p>${s.addons.length === 0
                    ? "Home draws its rows from the Catalogs Addons offer. Add an Addon to start browsing."
                    : "The configured Addons offer no Catalogs, so Home has no rows to draw. Choose an Addon that offers one."}</p>
                  <button type="button" class="btn btn-primary" data-focusable data-a="destination" data-destination="addons">
                    Open Addons
                  </button>
                </div>`
            : null}

          ${state.home.loading ? html`<p class="note" role="status">Loading the Addons' Catalogs\u2026</p>` : null}

          ${rows.map((row) => {
            const key = keyOf(row);
            rowIndex.set(key, row);
            return html`
              <section aria-labelledby="row-${key}">
                <div class="section-head">
                  <h2 id="row-${key}">${row.name}</h2>
                  <span class="section-tag">${addonName(s, row.addon) || row.addon}</span>
                </div>
                ${row.failure ? html`<p class="error" role="alert">${explain(row.failure)}</p>` : null}
                ${row.metas.length === 0 && !row.failure
                  ? html`<p class="row-note">This catalog is empty.</p>` : null}
                <div class="strip">
                  ${row.metas.map((meta) => renderPoster(row.addon, meta))}
                  ${pageable(s, row) && !row.done && (row.metas.length > 0 || row.failure !== null)
                    ? html`<button type="button" class="more-card" data-focusable data-a="page-row"
                            data-ref="${key}" data-focus-key="page-${key}"
                            ${off(state.home.paging.includes(key))}>More</button>`
                    : null}
                </div>
              </section>`;
          })}
        `;
      }

      function renderPoster(addon, meta) {
        const ref = addon + "|" + meta.type + "|" + meta.id;
        metaIndex.set(ref, meta);
        return html`
          <button type="button" class="poster lift" data-focusable data-focus-key="poster-${ref}"
                  data-a="open-card" data-source="addon" data-addon="${addon}" data-ref="${ref}">
            <span class="poster-frame">
              ${meta.poster ? html`<img class="poster-art" src="${meta.poster}" alt="" loading="lazy" />` : null}
            </span>
            <span class="poster-info">
              <span class="poster-name">${meta.name}</span>
              ${meta.releaseInfo ? html`<span class="poster-sub">${meta.releaseInfo}</span>` : null}
              ${meta.description ? html`<span class="poster-note">${meta.description}</span>` : null}
            </span>
          </button>`;
      }

      function renderTmdbPoster(meta, kind) {
        metaIndex.set(meta.id, meta);
        const unplayable = !discoverPlayable(state.snapshot ? state.snapshot.addons : [], kind) ||
          state.unplayable.has(meta.id);
        return html`
          <button type="button" class="poster lift" data-focusable data-focus-key="tmdb-${meta.id}"
                  data-a="open-card" data-source="tmdb" data-ref="${meta.id}">
            <span class="poster-frame">
              ${meta.poster ? html`<img class="poster-art" src="${meta.poster}" alt="" loading="lazy" />` : null}
              ${unplayable ? html`<span class="badge badge-danger">Unplayable</span>` : null}
            </span>
            <span class="poster-info">
              <span class="poster-name">${meta.name}</span>
              ${meta.releaseInfo ? html`<span class="poster-sub">${meta.releaseInfo}</span>` : null}
              ${meta.description ? html`<span class="poster-note">${meta.description}</span>` : null}
            </span>
          </button>`;
      }

      // --- Discover ---------------------------------------------------------
      function renderDiscover() {
        const s = state.snapshot;
        const keyed = s.protection.tmdbHeld;
        const discover = state.discover;
        const couldPlay = discoverPlayable(s.addons, discover.kind);
        const moreAvailable = !discover.feed.done &&
          (discover.feed.items.length > 0 || discover.feed.failure !== null);

        return html`
          <h1 class="screen-title">Discover</h1>
          ${!keyed
            ? html`
                <div class="empty">
                  <h2>Discover is powered by TMDB</h2>
                  <p>TMDB supplies the weekly Trending feed and the genres it can be filtered by.
                    Add a TMDB API key in <strong>Settings \u2192 Credentials</strong> to browse it.</p>
                  <button type="button" class="btn btn-primary" data-focusable data-a="credentials"
                          data-focus-key="discover-credentials">Open Settings \u2192 Credentials</button>
                </div>`
            : html`
                <p class="lede">TMDB's weekly Trending feed. Choose a kind, narrow it by a genre, or
                  page on through what is popular now.</p>

                <div class="chip-row" aria-label="Kind">
                  <button type="button" class="chip" data-focusable data-a="discover-kind" data-kind="movie"
                          data-focus-key="discover-movie" aria-pressed="${pressed(discover.kind === MOVIE)}">Movie</button>
                  <button type="button" class="chip" data-focusable data-a="discover-kind" data-kind="series"
                          data-focus-key="discover-series" aria-pressed="${pressed(discover.kind === SERIES)}">Series</button>
                </div>

                <div class="chip-row" aria-label="Genres">
                  <button type="button" class="chip" data-focusable data-a="discover-genre" data-genre="all"
                          data-focus-key="discover-genre-all" aria-pressed="${pressed(discover.genre === null)}">All genres</button>
                  ${genresOf(discover.kind).map((genre) => html`
                    <button type="button" class="chip" data-focusable data-a="discover-genre"
                            data-genre="${genre.id}" data-focus-key="discover-genre-${genre.id}"
                            aria-pressed="${pressed(discover.genre === genre.id)}">${genre.name}</button>`)}
                </div>

                ${discover.loading && discover.feed.page === 0
                  ? html`<p class="note" role="status">Looking for Titles\u2026</p>` : null}
                ${discover.feed.failure
                  ? html`<p class="error" role="alert">${explain(discover.feed.failure)}</p>` : null}

                <section class="grid" aria-label="Discover titles">
                  ${discover.feed.items.map((meta) => renderTmdbPoster(meta, discover.kind))}
                </section>
                ${!couldPlay && discover.feed.items.length > 0
                  ? html`<p class="row-note">No configured Addon answers for TMDB Titles of this kind,
                      so these are marked unplayable.</p>` : null}
                ${moreAvailable
                  ? html`<div class="grid-foot"><button type="button" class="btn" data-focusable
                          data-a="discover-more" data-focus-key="discover-more"
                          ${off(discover.loading)}>More</button></div>` : null}
            `}

          <footer class="credit">
            <span class="tmdb-logo">/*__SPLICE_TMDB_LOGO__*/</span>
            <p class="credit-notice">This product uses the TMDB API but is not endorsed or certified by TMDB</p>
          </footer>
        `;
      }

      // --- Search -----------------------------------------------------------
      function renderSearch() {
        const s = state.snapshot;
        const keyed = s.protection.tmdbHeld;
        const search = state.search;

        return html`
          <h1 class="screen-title">Search</h1>
          <p class="lede">${keyed
            ? "TMDB searches its Movies and Series together: both rows are asked, and each page is read fresh."
            : "Every Addon's Catalog that offers a search answers, in the order the Addons are configured."}</p>

          <form id="search-form" class="search-bar" role="search">
            <label class="visually-hidden" for="search-input">Search for a Title</label>
            <input id="search-input" type="search" autocomplete="off" placeholder="${keyed
              ? "Search TMDB for a film or a series" : "Search the Addons' searchable Catalogs"}"
              value="${search.draft}" data-focusable data-focus-key="search-input" />
            <button type="submit" class="btn btn-primary" data-focusable data-focus-key="search-submit"
                    ${off(search.draft.trim().length === 0)}>Search</button>
          </form>

          ${keyed && search.committed !== null
            ? SEARCH_KINDS.map(({ kind, label }) => {
                const feed = search[kind];
                const loading = search.paging.includes(kind);
                const moreAvailable = !loading && !feed.done && (feed.page > 0 || feed.failure !== null);
                return html`
                  <section class="answer-row" aria-label="${label}">
                    <div class="answer-head">
                      <h2>${label}</h2>
                      <span class="answer-tag">TMDB</span>
                    </div>
                    ${feed.failure ? html`<p class="error" role="alert">${explain(feed.failure)}</p>` : null}
                    <div class="grid">
                      ${feed.items.map((meta) => renderTmdbPoster(meta, kind))}
                    </div>
                    ${loading
                      ? html`<p class="note" role="status">${feed.items.length === 0
                          ? "Looking for " + label.toLowerCase() + "\u2026"
                          : "Looking for more " + label.toLowerCase() + "\u2026"}</p>`
                      : !feed.failure && feed.done && feed.items.length === 0
                        ? html`<p class="note">No ${label.toLowerCase()} matched \u201c${search.committed}\u201d.</p>`
                        : null}
                    ${moreAvailable
                      ? html`<div class="grid-foot"><button type="button" class="btn" data-focusable
                              data-a="search-more" data-kind="${kind}" data-focus-key="search-more-${kind}"
                              ${off(loading)}>More</button></div>` : null}
                  </section>`;
              })
            : null}

          ${!keyed && search.committed !== null
            ? html`
                <div class="answer-row">
                  ${search.catalog.loading
                    ? html`<p class="note" role="status">Searching every searchable Catalog\u2026</p>` : null}
                  ${search.catalog.failure
                    ? html`<p class="error" role="alert">${explain(search.catalog.failure)}</p>` : null}
                  ${(search.catalog.rows || []).map((row) => html`
                    <section class="answer-row" aria-label="${row.name}">
                      <div class="answer-head">
                        <h2>${row.name}</h2>
                        <span class="answer-tag">${addonName(s, row.addon) || row.addon}</span>
                      </div>
                      ${row.failure ? html`<p class="error" role="alert">${explain(row.failure)}</p>` : null}
                      <div class="grid">
                        ${row.metas.map((meta) => renderPoster(row.addon, meta))}
                      </div>
                      ${!row.failure && row.sent === 0
                        ? html`<p class="note">This Catalog answered with no match.</p>` : null}
                    </section>`)}
                  ${!search.catalog.loading && !search.catalog.failure &&
                    search.catalog.rows && search.catalog.rows.length === 0
                    ? html`<p class="note">No Addon offers a Catalog that can be searched.</p>` : null}
                </div>`
            : null}
        `;
      }

      // --- Library ----------------------------------------------------------
      function renderLibrary() {
        const s = state.snapshot;
        return html`
          <h1 class="screen-title">Library</h1>
          ${s.protection.stremioHeld
            ? html`<p class="lede">Signed in to Stremio. The Titles saved in your account will appear
                here once the Library is built.</p>`
            : html`
                <p class="lede">Your Library will hold the Titles saved in your Stremio account. It is
                  not built yet \u2014 sign in to Stremio to connect the account it will draw from.</p>
                ${renderStremioForm("library")} `}
        `;
      }

      function renderStremioForm(prefix, allowSignOut) {
        const s = state.snapshot;
        if (s.protection.stremioHeld) {
          if (!allowSignOut) { return null; }
          return html`<button type="button" class="btn" data-focusable data-a="sign-out-stremio"
                  data-focus-key="sign-out-stremio">Sign out</button>`;
        }
        return html`
          <form id="${prefix}-stremio-form" class="card-panel" novalidate>
            <div class="form-field">
              <label for="${prefix}-stremio-email">Stremio email</label>
              <input id="${prefix}-stremio-email" type="email" autocomplete="off"
                     placeholder="you@example.com" data-focusable data-focus-key="${prefix}-stremio-email" />
            </div>
            <div class="form-field">
              <label for="${prefix}-stremio-password">Stremio password</label>
              <input id="${prefix}-stremio-password" type="password" autocomplete="off"
                     placeholder="the password Stremio knows" data-focusable data-focus-key="${prefix}-stremio-password" />
            </div>
            <button type="submit" class="btn btn-primary" data-focusable data-focus-key="${prefix}-stremio-submit">Sign in</button>
          </form>`;
      }

      // --- Addons -----------------------------------------------------------
      function renderAddons() {
        const s = state.snapshot;
        const addons = s.addons;
        return html`
          <h1 class="screen-title">Addons</h1>
          <p class="lede">An Addon's manifest URL adds it. The Host fetches and reads the manifest,
            keeps the Addon, and Home's Catalog rows follow your order.</p>

          <form id="addon-form" class="card-panel">
            <div class="form-field">
              <label for="manifest-url">Addon manifest URL</label>
              <input id="manifest-url" placeholder="https://example.com/manifest.json"
                     autocomplete="off" data-focusable data-focus-key="manifest-url" />
            </div>
            <button type="submit" class="btn btn-primary" data-focusable data-focus-key="add-addon-submit">Add</button>
          </form>

          ${state.addons.status
            ? html`<p class="status" role="status">${state.addons.status.kind === "added"
                ? state.addons.status.name + " was added."
                : (state.addons.status.name
                  ? "That manifest is already configured as " + state.addons.status.name +
                    "; the Host refreshed that Addon instead of adding a second one."
                  : "That manifest is already configured; the Host refreshed that Addon instead of adding a second one.")}</p>`
            : null}

          ${addons.length === 0
            ? html`<p class="note">No Addons are configured yet. Paste an Addon's manifest URL above to
                add the first one.</p>`
            : html`
                <ul class="addon-list">
                  ${addons.map((addon, index) => {
                    const open = state.addons.expanded === addon.id;
                    return html`
                      <li class="addon-row" data-expanded="${open}">
                        <button type="button" class="addon-summary" data-focusable
                                data-a="addon-toggle" data-id="${addon.id}"
                                data-focus-key="addon-${addon.id}" aria-expanded="${open}">
                          <span class="addon-name">${addon.name}</span>
                          <span class="addon-version">${addon.version}</span>
                        </button>
                        ${open
                          ? html`
                              <div class="addon-details">
                                <dl class="facts">
                                  <dt>Id</dt><dd>${addon.id}</dd>
                                  <dt>Resources</dt><dd>${resourcesOf(addon)}</dd>
                                  <dt>Types</dt><dd>${joinOrNone(addon.types)}</dd>
                                  <dt>Catalogs</dt><dd>${catalogsOf(addon)}</dd>
                                </dl>
                                <div class="addon-controls">
                                  <button type="button" class="btn" data-focusable data-a="addon-move"
                                          data-id="${addon.id}" data-delta="-1"
                                          data-focus-key="addon-${addon.id}-up"
                                          ${off(moveTarget(index, -1, addons.length) === null)}>Move up</button>
                                  <button type="button" class="btn" data-focusable data-a="addon-move"
                                          data-id="${addon.id}" data-delta="1"
                                          data-focus-key="addon-${addon.id}-down"
                                          ${off(moveTarget(index, 1, addons.length) === null)}>Move down</button>
                                  <button type="button" class="btn btn-danger" data-focusable data-a="addon-remove"
                                          data-id="${addon.id}" data-focus-key="addon-${addon.id}-remove">Remove</button>
                                </div>
                              </div>`
                          : null}
                      </li>`;
                  })}
                </ul>`}
        `;
      }

      // --- Settings ---------------------------------------------------------
      function renderSettings() {
        return html`
          <h1 class="screen-title">Settings</h1>
          <p class="lede">The Host's credentials, preferences, paired devices, and the credits its
            software and data sources ask it to carry.</p>
          <ul class="settings-list">
            ${SETTINGS_CATEGORIES.map((category) => html`
              <li>
                <button type="button" class="settings-category" data-focusable
                        data-a="settings-category" data-category="${category.id}"
                        data-focus-key="settings-${category.id}">
                  <span class="settings-category-title">${category.title}</span>
                  <span class="settings-category-note">${category.note}</span>
                  <span class="settings-category-mark" aria-hidden="true">${mark("chevron", 1.7)}</span>
                </button>
              </li>`)}
          </ul>
        `;
      }

      // --- the level stack --------------------------------------------------
      function renderLevel() {
        const view = captureView();
        const host = $("level-host");
        const level = state.levels[state.levels.length - 1];
        if (!level) {
          host.classList.add("hidden");
          host.innerHTML = "";
          state.levelSignature = "none";
          if (!state.focusTarget) { restoreView(view); }
          return;
        }
        videoIndex.clear();
        groupIndex.clear();
        aspectIndex.clear();
        cropIndex.clear();
        host.classList.remove("hidden");
        host.innerHTML = renderLevelMarkup(level).markup;
        state.levelSignature = levelSignature();
        if (!state.focusTarget) { restoreView(view); }
      }

      function levelFrame(title, body) {
        return html`
          <div class="level">
            <header class="level-head">
              <button type="button" class="btn btn-ghost" data-focusable data-a="pop-level"
                      data-focus-key="level-back">\u2039 Back</button>
              <h1 class="level-title">${title}</h1>
            </header>
            <div class="level-body">${body}</div>
          </div>`;
      }

      function renderLevelMarkup(level) {
        switch (level.kind) {
          case "title": return renderTitleLevel(level);
          case "streams": return renderStreamsLevel(level);
          case "settings": return renderSettingsLevel(level);
          case "confirm": return renderConfirmLevel(level);
          default: return levelFrame("Error", html`<p class="error">Unknown level.</p>`);
        }
      }

      function renderTitleLevel(level) {
        const preview = level.preview;
        if (level.loading) {
          const art = preview && (preview.background || preview.poster);
          return html`
            <div class="level">
              <header class="level-head">
                <button type="button" class="btn btn-ghost" data-focusable data-a="pop-level"
                        data-focus-key="level-back">\u2039 Back</button>
                <h1 class="level-title">Opening ${preview ? preview.name : "Title"}</h1>
              </header>
              <div class="title-hero">
                ${art ? html`<img class="title-art" src="${art}" alt="" />` : null}
                <span class="title-scrim" aria-hidden="true"></span>
                <div class="title-copy">
                  <h2 class="title-name">${preview ? preview.name : "Title"}</h2>
                  <p class="title-desc">Looking for this Title\u2026</p>
                </div>
              </div>
            </div>`;
        }
        if (level.failure) {
          return levelFrame(nameOf(level.title || { name: "Title", id: "" }, preview),
            html`<p class="error" role="alert">${explain(level.failure)}</p>`);
        }

        const title = level.title;
        const name = nameOf(title, preview);
        const art = titleArtOf(title, preview);
        const release = releaseOf(title, preview);
        const seasons = seasonsOf(title);
        const shown = seasons.find((season) => season.season === level.shownSeason) || seasons[0];
        const facts = [];
        if (title.imdbRating) { facts.push({ text: "\u2605 " + title.imdbRating, tone: "accent" }); }
        if (release) { facts.push({ text: release }); }
        if (title.runtime) { facts.push({ text: title.runtime }); }
        for (const genre of title.genres) { facts.push({ text: genre }); }

        return html`
          <div class="level">
            <article aria-label="${name}">
              <header class="title-hero">
                ${art.src ? html`<img class="title-art" src="${art.src}" alt="" data-art="${art.kind}" />` : null}
                <span class="title-scrim" aria-hidden="true"></span>
                <div class="title-copy">
                  <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
                    <button type="button" class="btn btn-ghost" data-focusable data-a="pop-level"
                            data-focus-key="level-back" data-autofocus>\u2039 Back</button>
                  </div>
                  ${title.logo
                    ? html`<img class="title-logo" src="${title.logo}" alt="${name}" />`
                    : html`<h1 class="title-name">${name}</h1>`}
                  ${facts.length > 0
                    ? html`<div class="chip-row">${facts.map((fact) => html`
                        <span class="chip" aria-pressed="${fact.tone === "accent"}">${fact.text}</span>`)}</div>`
                    : null}
                  <div class="chip-row">
                    ${title.addon ? html`<span class="chip" aria-pressed="true">${title.addon}</span>` : null}
                    ${title.key && title.key.kind === "addon"
                      ? html`<span class="chip">Unmapped \u2014 no TMDB record met this Title.</span>` : null}
                  </div>
                  ${title.description ? html`<p class="title-desc">${title.description}</p>` : null}
                </div>
              </header>

              <div class="level-body">
                ${seasons.length === 0
                  ? html`
                      <p class="note">${isSeries(title)
                        ? "This series' Addon listed no episodes."
                        : "This Title is one Video: the film itself."}</p>
                      ${isSeries(title) ? null : html`
                        <button type="button" class="btn btn-primary" data-focusable data-a="title-play-film"
                                data-focus-key="title-play-film">Play</button>`}`
                  : html`
                      <div class="chip-row" aria-label="Seasons">
                        ${seasons.map(({ season }) => html`
                          <button type="button" class="chip" data-focusable data-a="title-season"
                                  data-season="${season === null ? "none" : season}"
                                  data-focus-key="title-season-${season === null ? "none" : season}"
                                  aria-pressed="${pressed(shown && shown.season === season)}">${seasonName(season)}</button>`)}
                      </div>
                      ${shown ? shown.videos.map((video) => {
                        videoIndex.set(video.id, video);
                        const label = labelOf(video);
                        return html`
                          <button type="button" class="episode lift" data-focusable
                                  data-a="title-episode" data-id="${video.id}"
                                  data-focus-key="title-episode-${video.id}"
                                  aria-pressed="${pressed(level.selected && level.selected.id === video.id)}">
                            ${video.thumbnail
                              ? html`<span class="episode-still"><img src="${video.thumbnail}" alt="" loading="lazy" /></span>`
                              : null}
                            <span>
                              ${label ? html`<span class="episode-label">${label}</span><br />` : null}
                              <span class="episode-name">${video.name || video.id}</span>
                            </span>
                          </button>`;
                      }) : null}`}
              </div>
            </article>
          </div>`;
      }

      function renderStreamsLevel(level) {
        const subject = isSeries(level.title)
          ? [labelOf(level.video) || level.video.id, level.video.name].filter(Boolean).join(" \u2014 ")
          : nameOf(level.title, level.preview);
        const head = html`
          <header class="level-head">
            <button type="button" class="btn btn-ghost" data-focusable data-a="pop-level"
                    data-focus-key="level-back" data-autofocus>\u2039 Back</button>
            <h1 class="level-title">Streams \u2014 ${subject}</h1>
          </header>`;

        if (level.loading) {
          return html`<div class="level">${head}<div class="level-body">
            <p class="note" role="status">Looking for Streams\u2026</p></div></div>`;
        }
        if (level.failure) {
          return html`<div class="level">${head}<div class="level-body">
            <p class="error" role="alert">${explain(level.failure)}</p></div></div>`;
        }
        const groups = level.groups || [];
        return html`
          <div class="level">
            ${head}
            <div class="level-body">
              ${groups.length === 0
                ? html`<p class="note">No configured Addon offers Streams for this Video.</p>` : null}
              ${groups.map((group) => {
                groupIndex.set(group.addon, group);
                return html`
                  <section class="stream-group" aria-label="${group.addon}">
                    <h2>${group.addon}</h2>
                    ${group.failure ? html`<p class="error" role="alert">${explain(group.failure)}</p>` : null}
                    ${!group.failure && group.streams.length === 0
                      ? html`<p class="note">This Addon answered nothing this Host can play.</p>` : null}
                    ${group.streams.map((stream, index) => {
                      const badges = badgeLines(stream);
                      const note = playabilityNote(stream.playback);
                      return html`
                        <button type="button" class="stream lift" data-focusable
                                data-a="choose-stream" data-addon="${group.addon}" data-index="${index}"
                                data-focus-key="stream-${group.addon}-${index}"
                                aria-pressed="${pressed(level.chosen === stream)}">
                          ${badges.length > 0
                            ? html`<span class="stream-badges">${badges.map((badge) => html`
                                <span class="stream-badge">${badge}</span>`)}</span>` : null}
                          ${stream.filename ? html`<span class="stream-file">${stream.filename}</span>` : null}
                          ${stream.description ? html`<span class="stream-desc">${stream.description}</span>` : null}
                          ${stream.warnings.map((warning) => html`<span class="stream-warn">${warningNote(warning)}</span>`)}
                          ${note ? html`<span class="stream-danger">${note}</span>` : null}
                        </button>`;
                    })}
                  </section>`;
              })}
              ${level.chosen
                ? html`<p class="status" role="status">${unplayableNote(level.chosen)}</p>` : null}
            </div>
          </div>`;
      }

      function renderSettingsLevel(level) {
        const category = SETTINGS_CATEGORIES.find((held) => held.id === level.category);
        const title = category ? category.title : "Settings";
        const body = level.category === "credentials" ? renderCredentials()
