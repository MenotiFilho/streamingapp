<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>streamingapp — Cast Remote</title>
    <style>
      /*
       * The repertory token sheet (#149, #160), spliced from the file the
       * window imports (`src/shell/repertory/tokens.css`). One palette, one
       * family stack and one phone scale for both clients.
       */
      /*__SPLICE_REPERTORY_TOKENS__*/

      /* ------------------------------------------------------------------
       * The Cast Remote: phone-first structure, three surfaces, one page.
       * Ink/ivory/brass, Bodoni Moda / Inter / IBM Plex Mono, hairlines,
       * no glass and no rounding (#149, #160).
       * ------------------------------------------------------------------ */

      *, *::before, *::after {
        box-sizing: border-box;
        border-radius: 0;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--rep-ink);
        color: var(--rep-ivory);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-body);
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      button, input { font: inherit; }
      button { color: inherit; touch-action: manipulation; }
      a { color: var(--rep-house); }
      .hidden { display: none !important; }
      .dim { color: var(--rep-dim); }
      .muted { color: var(--rep-muted); }
      .tabular { font-variant-numeric: tabular-nums; }
      .visually-hidden {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
        white-space: nowrap;
      }
      ::selection { background: var(--rep-house); color: var(--rep-ink); }

      [data-focusable] {
        position: relative;
        transition:
          background-color var(--rep-motion-fade) var(--rep-ease),
          border-color var(--rep-motion-fade) var(--rep-ease),
          color var(--rep-motion-fade) var(--rep-ease);
      }
      [data-focusable]:focus,
      [data-focusable]:focus-visible {
        outline: 2px solid var(--rep-ivory);
        outline-offset: 3px;
        box-shadow: none;
        z-index: 5;
      }
      .lift[data-focusable]:focus,
      .lift[data-focusable]:focus-visible {
        transform: none;
      }

      /* --- controls, chips and fields ---------------------------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        min-height: var(--rep-remote-touch);
        padding: 0 0.8rem;
        border: 1px solid var(--rep-hairline);
        background: transparent;
        color: var(--rep-ivory);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-mono);
        font-weight: 400;
        letter-spacing: 0.04em;
        line-height: 1.1;
        text-transform: uppercase;
        cursor: pointer;
      }
      .btn:active { background: var(--rep-ink-raised); }
      .btn-primary {
        border-color: var(--rep-house);
        background: var(--rep-house);
        color: var(--rep-ink);
      }
      .btn-primary:active { background: var(--rep-house-deep); }
      .btn-ghost {
        min-height: auto;
        padding: 0 0 4px;
        border: 0;
        border-bottom: 1px solid var(--rep-hairline);
        background: transparent;
        color: var(--rep-dim);
      }
      .btn-ghost:active { background: transparent; color: var(--rep-ivory); }
      .btn-danger {
        border-color: var(--rep-status-red);
        background: transparent;
        color: var(--rep-status-red);
      }
      .btn-icon {
        width: var(--rep-remote-touch);
        min-width: var(--rep-remote-touch);
        height: var(--rep-remote-touch);
        padding: 0;
      }
      .btn-round {
        width: 3.25rem;
        height: 3.25rem;
        padding: 0;
      }
      .btn:disabled { opacity: 0.4; cursor: default; }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        min-height: 2.5rem;
        padding: 0.35rem 0.65rem;
        border: 1px solid var(--rep-hairline);
        background: transparent;
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-mono);
        font-weight: 400;
        letter-spacing: 0.02em;
        white-space: nowrap;
        cursor: pointer;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--rep-house);
        background: transparent;
        color: var(--rep-ivory);
        box-shadow: inset 2px 0 0 var(--rep-house);
      }
      .chip:disabled { opacity: 0.45; cursor: default; }
      .chip-row {
        display: flex;
        gap: 0.4rem;
        padding: 0.2rem 0 0.4rem;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .chip-row::-webkit-scrollbar { display: none; }

      .form-field { display: grid; gap: 0.4rem; margin: 0 0 1.15rem; }
      .form-field label {
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        font-weight: 400;
        letter-spacing: var(--rep-tracking-caps);
        text-transform: uppercase;
      }
      input:not([type="range"]) {
        width: 100%;
        min-height: var(--rep-remote-touch);
        padding: 0.5rem 0;
        border: 0;
        border-bottom: 1px solid var(--rep-hairline);
        background: transparent;
        color: var(--rep-ivory);
        font-family: var(--rep-mono);
        font-size: 16px;
        box-sizing: border-box;
      }
      input:not([type="range"])::placeholder { color: var(--rep-muted); }
      input:not([type="range"]):focus,
      input:not([type="range"]):focus-visible {
        border-bottom-color: transparent;
      }
      input[type="range"] { width: 100%; accent-color: var(--rep-house); }

      .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
      .note {
        margin: 0.6rem 0;
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        line-height: 1.5;
      }
      .error {
        color: var(--rep-status-red);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-caption);
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .status {
        color: var(--rep-house);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
      }

      /* --- pairing: a call board, not a card ---------------------------- */
      .pairing {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding:
          calc(1.5rem + env(safe-area-inset-top))
          max(1.25rem, env(safe-area-inset-right))
          calc(1.5rem + env(safe-area-inset-bottom))
          max(1.25rem, env(safe-area-inset-left));
        background: var(--rep-ink);
      }
      .pairing-card {
        width: 100%;
        max-width: 26rem;
        padding: 1.5rem 0;
        border: 0;
        border-top: 1px solid var(--rep-hairline);
        border-bottom: 1px solid var(--rep-hairline);
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }
      .pairing-card h1 {
        margin: 0 0 0.65rem;
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-hero);
        font-weight: 500;
        letter-spacing: var(--rep-tracking-display);
        line-height: 1.02;
      }
      .pairing-card .lede { margin: 0 0 1.4rem; }
      #code {
        color: var(--rep-house);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-title);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      /* --- surface 1: the programme with the docked strip ---------------- */
      .app { position: fixed; inset: 0; }
      .surface-browse {
        position: absolute;
        inset: 0;
        width: 100%;
        max-width: 48rem;
        margin: 0 auto;
      }
      .topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        height: calc(3.25rem + env(safe-area-inset-top));
        padding:
          env(safe-area-inset-top)
          calc(var(--rep-remote-gutter) + env(safe-area-inset-right))
          0
          calc(var(--rep-remote-gutter) + env(safe-area-inset-left));
        background: var(--rep-ink);
        border-bottom: 1px solid var(--rep-hairline);
        backdrop-filter: none;
      }
      .brand {
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-title);
        font-weight: 500;
        letter-spacing: var(--rep-tracking-display);
        line-height: 1;
      }
      .connection {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .connection::before {
        content: "";
        width: 0.35rem;
        height: 0.35rem;
        background: var(--rep-house);
        box-shadow: none;
      }
      .connection[data-live="false"]::before { background: var(--rep-status-red); }

      .screen {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(3.25rem + env(safe-area-inset-top));
        bottom: calc(var(--rep-remote-nav) + env(safe-area-inset-bottom));
        overflow-y: auto;
        padding:
          1.1rem
          calc(var(--rep-remote-gutter) + env(safe-area-inset-right))
          1.5rem
          calc(var(--rep-remote-gutter) + env(safe-area-inset-left));
        background: var(--rep-ink);
        overscroll-behavior: contain;
      }
      /* The docked strip is the remote's collapsed state: the page makes room
         for it instead of being covered by it. */
      .surface-browse:has(.mini-strip:not(.hidden)) .screen {
        bottom: calc(
          var(--rep-remote-nav) + var(--rep-remote-strip) + env(safe-area-inset-bottom)
        );
      }
      .screen-title {
        margin: 0 0 1rem;
        padding-bottom: 0.55rem;
        border-bottom: 1px solid var(--rep-hairline);
        color: var(--rep-house);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-mono);
        font-weight: 400;
        letter-spacing: var(--rep-tracking-caps);
        line-height: 1.2;
        text-transform: uppercase;
      }
      .lede {
        max-width: 60ch;
        margin: 0 0 1.1rem;
        color: var(--rep-dim);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
        line-height: 1.5;
      }
      .section-head {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        margin: 1.6rem 0 0.65rem;
        padding-bottom: 0.45rem;
        border-bottom: 1px solid var(--rep-hairline);
      }
      .section-head h2 {
        margin: 0;
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-section);
        font-weight: 500;
        letter-spacing: var(--rep-tracking-display);
        line-height: 1.05;
      }
      .section-tag {
        margin-left: auto;
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .empty {
        display: grid;
        gap: 0.8rem;
        margin: 1.4rem 0;
        padding: 1.25rem 0;
        border: 0;
        border-top: 1px solid var(--rep-hairline);
        border-bottom: 1px solid var(--rep-hairline);
        background: transparent;
      }
      .empty h2 {
        margin: 0;
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-section);
        font-weight: 500;
      }
      .empty p {
        margin: 0;
        color: var(--rep-dim);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
        line-height: 1.5;
      }
      .row-note {
        margin: 0.3rem 0 0.7rem;
        color: var(--rep-muted);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
      }

      /* --- the feature --------------------------------------------------- */
      .hero {
        position: relative;
        margin: 0 calc(-1 * var(--rep-remote-gutter)) 0.5rem;
      }
      .hero-button {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        padding: 0;
        overflow: hidden;
        text-align: left;
        cursor: pointer;
        border: 0;
        border-top: 1px solid var(--rep-hairline);
        border-bottom: 1px solid var(--rep-hairline);
        background: var(--rep-ink-raised);
        color: var(--rep-ivory);
      }
      .hero-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) brightness(0.78);
      }
      .hero-scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(0deg, var(--rep-ink) 0%, color-mix(in srgb, var(--rep-ink) 58%, transparent) 42%, transparent 76%),
          linear-gradient(90deg, color-mix(in srgb, var(--rep-ink) 52%, transparent), transparent 64%);
      }
      .hero-copy {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        gap: 0.3rem;
        padding: 1rem calc(var(--rep-remote-gutter) + env(safe-area-inset-left)) 1.05rem;
      }
      .hero-kicker {
        color: var(--rep-house);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .hero-name {
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-hero);
        font-weight: 500;
        letter-spacing: var(--rep-tracking-display);
        line-height: 1.02;
      }
      .hero-desc {
        display: -webkit-box;
        overflow: hidden;
        color: var(--rep-dim);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
        line-height: 1.4;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .hero-dots { display: flex; justify-content: center; gap: 0.3rem; padding: 0.55rem 0 0; }
      .hero-dot {
        width: 1.5rem;
        height: 2px;
        padding: 0;
        border: 0;
        background: var(--rep-hairline);
        cursor: pointer;
      }
      .hero-dot[aria-current="true"] {
        background: var(--rep-house);
        box-shadow: none;
      }

      /* --- cards: unframed pictures with printed captions ---------------- */
      .strip {
        display: flex;
        gap: 0.9rem;
        padding: 0.2rem 0 0.55rem;
        overflow-x: auto;
        scrollbar-width: none;
        /* No snapping: the rail is redirected by Motion when a press moves it
         * mid-flight (ADR-0031 §2). */
        scroll-snap-type: none;
      }
      .strip > * { flex: 0 0 auto; scroll-snap-align: none; }
      .strip::-webkit-scrollbar { display: none; }
      .rep-icon {
        display: block;
        width: 1.15rem;
        height: 1.15rem;
        flex: none;
      }
      .poster {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 7.5rem;
        padding: 0;
        border: 0;
        background: transparent;
        text-align: left;
        overflow: visible;
        cursor: pointer;
      }
      .poster-frame {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 2 / 3;
        background: var(--rep-ink-raised);
        overflow: hidden;
      }
      .poster-art {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) brightness(0.88);
      }
      .poster-info {
        display: flex;
        flex-direction: row;
        align-items: baseline;
        gap: 0.35rem;
        padding: 0.5rem 0 0;
      }
      .poster-name {
        display: -webkit-box;
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        color: var(--rep-dim);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
        font-weight: 500;
        line-height: 1.22;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .poster:focus .poster-name,
      .poster:focus-visible .poster-name { color: var(--rep-ivory); }
      .poster-sub {
        flex: none;
        padding: 0 0.3rem;
        border: 1px solid var(--rep-hairline);
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        line-height: 1.35;
        white-space: nowrap;
      }
      .poster-note { display: none; }
      .badge {
        position: absolute;
        top: 0.45rem;
        left: 0.45rem;
        z-index: 2;
        padding: 0.1rem 0.4rem;
        border: 1px solid var(--rep-hairline);
        background: var(--rep-ink);
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .badge-danger {
        border-color: var(--rep-status-red);
        color: var(--rep-status-red);
      }
      .badge-warn {
        border-color: var(--rep-house);
        color: var(--rep-house);
      }

      .continue {
        display: flex;
        flex-direction: column;
        width: 12.5rem;
        padding: 0;
        text-align: left;
        border: 0;
        background: transparent;
        overflow: visible;
        cursor: pointer;
      }
      .continue-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: var(--rep-ink-raised);
        overflow: hidden;
      }
      .continue-art {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) brightness(0.86);
      }
      .continue-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: var(--rep-hairline);
      }
      .continue-bar span { display: block; height: 100%; background: var(--rep-house); }
      .continue-info { display: grid; gap: 0.25rem; padding: 0.5rem 0 0; }
      .continue-name {
        color: var(--rep-dim);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
        font-weight: 500;
        line-height: 1.22;
      }
      .continue-note {
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
      }
      .continue-note[data-warn="true"] { color: var(--rep-house); }
      .continue[data-unplayable="true"] {
        opacity: 0.55;
        border: 0;
        cursor: not-allowed;
      }
      .more-card {
        display: grid;
        place-items: center;
        min-width: 5rem;
        border: 1px solid var(--rep-hairline);
        background: transparent;
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-mono);
        letter-spacing: 0.04em;
        cursor: pointer;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.9rem;
      }
      .grid .poster { width: 100%; }
      .grid-foot { display: flex; justify-content: center; padding: 1.1rem 0 0.3rem; }
      .credit {
        display: grid;
        justify-items: center;
        gap: 0.4rem;
        margin: 2rem 0 0;
        padding: 1rem 0;
        border-top: 1px solid var(--rep-hairline);
      }
      .tmdb-logo { display: block; width: 6rem; height: auto; }
      .tmdb-logo svg { display: block; width: 100%; height: auto; }
      .credit-notice {
        margin: 0;
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        line-height: 1.45;
        text-align: center;
      }

      /* --- search -------------------------------------------------------- */
      .search-bar {
        display: flex;
        gap: 0.5rem;
        margin: 0 0 1.2rem;
        padding-bottom: 0.15rem;
        border-bottom: 1px solid var(--rep-hairline);
      }
      .search-bar input {
        flex: 1 1 auto;
        min-width: 0;
        border-bottom: 0;
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-title);
      }
      .search-bar .btn { min-height: 2.5rem; }
      .answer-row { margin-top: 1.4rem; }
      .answer-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.55rem;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid var(--rep-hairline);
      }
      .answer-head h2 {
        margin: 0;
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-section);
        font-weight: 500;
      }
      .answer-tag {
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
      }

      /* --- library, Addons and Settings ---------------------------------- */
      .card-panel {
        padding: 1rem 0;
        border: 0;
        border-top: 1px solid var(--rep-hairline);
        border-bottom: 1px solid var(--rep-hairline);
        background: transparent;
      }
      .addon-list,
      .settings-list {
        display: grid;
        gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--rep-hairline);
      }
      .addon-row {
        border: 0;
        border-bottom: 1px solid var(--rep-hairline);
        background: transparent;
        overflow: hidden;
      }
      .addon-summary {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        width: 100%;
        padding: 0.9rem 0;
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .addon-name {
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-section);
        font-weight: 500;
        letter-spacing: -0.008em;
      }
      .addon-version,
      .addon-id {
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
      }
      .addon-details {
        padding: 0 0 0.9rem 0.5rem;
        border-top: 1px solid var(--rep-hairline);
      }
      .facts {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.3rem 0.8rem;
        margin: 0.75rem 0;
        font-size: var(--rep-remote-text-badge);
      }
      .facts dt {
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        letter-spacing: var(--rep-tracking-caps);
        text-transform: uppercase;
      }
      .facts dd {
        margin: 0;
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        overflow-wrap: anywhere;
      }
      .addon-controls { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .settings-category {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.2rem 0.6rem;
        width: 100%;
        padding: 1rem 0;
        border: 0;
        border-bottom: 1px solid var(--rep-hairline);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .settings-category-title {
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-section);
        font-weight: 500;
      }
      .settings-category-note {
        grid-column: 1;
        color: var(--rep-muted);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
        line-height: 1.4;
      }
      .settings-category-mark {
        grid-row: 1 / span 2;
        grid-column: 2;
        align-self: center;
        color: var(--rep-house);
      }
      .settings-section { margin-top: 1.6rem; }
      .settings-section h2 {
        margin: 0 0 0.65rem;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid var(--rep-hairline);
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-section);
        font-weight: 500;
      }
      .settings-copy {
        margin: 0 0 0.8rem;
        color: var(--rep-dim);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
        line-height: 1.5;
      }
      .readout {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.3rem 0.8rem;
        margin: 0 0 0.8rem;
        font-size: var(--rep-remote-text-badge);
      }
      .readout dt {
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        letter-spacing: var(--rep-tracking-caps);
        text-transform: uppercase;
      }
      .readout dd {
        margin: 0;
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        overflow-wrap: anywhere;
      }
      .device-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--rep-hairline);
      }
      .device-row:last-child { border-bottom: 0; }
      .device-name {
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-body);
        font-weight: 500;
      }
      .device-date {
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
      }

      /* --- the pushed levels: the same programme, one level deeper ------- */
      .level-host {
        position: fixed;
        inset: 0;
        z-index: 50;
        overflow-y: auto;
        background: var(--rep-ink);
      }
      .level { min-height: 100%; padding-bottom: 2rem; }
      .level-head {
        position: sticky;
        top: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding:
          calc(0.55rem + env(safe-area-inset-top))
          calc(var(--rep-remote-gutter) + env(safe-area-inset-right))
          0.55rem
          calc(var(--rep-remote-gutter) + env(safe-area-inset-left));
        background: var(--rep-ink);
        border-bottom: 1px solid var(--rep-hairline);
        backdrop-filter: none;
      }
      .level-title {
        margin: 0;
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-section);
        font-weight: 500;
        letter-spacing: var(--rep-tracking-display);
        line-height: 1.05;
      }
      .level-body {
        padding:
          1rem
          calc(var(--rep-remote-gutter) + env(safe-area-inset-right))
          calc(2rem + env(safe-area-inset-bottom))
          calc(var(--rep-remote-gutter) + env(safe-area-inset-left));
      }
      .title-hero {
        position: relative;
        min-height: 18rem;
        padding: 0.75rem calc(var(--rep-remote-gutter) + env(safe-area-inset-left)) 1.1rem;
        overflow: hidden;
        border-bottom: 1px solid var(--rep-hairline);
      }
      .title-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) brightness(0.76);
      }
      .title-scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(0deg, var(--rep-ink) 2%, color-mix(in srgb, var(--rep-ink) 58%, transparent) 46%, transparent 100%),
          linear-gradient(90deg, color-mix(in srgb, var(--rep-ink) 62%, transparent), transparent 72%);
      }
      .title-copy {
        position: relative;
        z-index: 2;
        display: grid;
        gap: 0.6rem;
        margin-top: 6rem;
      }
      .title-logo {
        display: block;
        max-width: min(18rem, 80%);
        max-height: 5rem;
        object-fit: contain;
        object-position: left center;
      }
      .title-name {
        margin: 0;
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-title);
        font-weight: 500;
        letter-spacing: var(--rep-tracking-display);
        line-height: 1.03;
      }
      .title-desc {
        margin: 0.25rem 0 0;
        max-width: 65ch;
        color: var(--rep-dim);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
        line-height: 1.5;
      }
      .episode {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        width: 100%;
        margin: 0;
        padding: 0.6rem 0;
        border: 0;
        border-bottom: 1px solid var(--rep-hairline);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .episode-still {
        flex: 0 0 5.5rem;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: var(--rep-ink-raised);
      }
      .episode-still img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .episode-label {
        color: var(--rep-house);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        font-weight: 400;
        letter-spacing: 0.04em;
      }
      .episode-name {
        color: var(--rep-dim);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
        font-weight: 500;
      }
      .stream-group { margin-top: 1.2rem; }
      .stream-group h2 {
        margin: 0 0 0.45rem;
        padding-bottom: 0.35rem;
        border-bottom: 1px solid var(--rep-hairline);
        color: var(--rep-house);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        font-weight: 400;
        letter-spacing: var(--rep-tracking-caps);
        text-transform: uppercase;
      }
      .stream {
        display: grid;
        gap: 0.35rem;
        width: 100%;
        margin: 0;
        padding: 0.75rem 0;
        border: 0;
        border-bottom: 1px solid var(--rep-hairline);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .stream[aria-pressed="true"] { box-shadow: inset 2px 0 0 var(--rep-house); }
      .stream-badges { display: flex; flex-wrap: wrap; gap: 0.25rem; }
      .stream-badge {
        padding: 0 0.35rem;
        border: 1px solid var(--rep-hairline);
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        font-weight: 400;
        line-height: 1.45;
      }
      .stream-file {
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .stream-desc {
        color: var(--rep-dim);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-badge);
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .stream-warn {
        color: var(--rep-house);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
      }
      .stream-danger {
        color: var(--rep-status-red);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
      }
      .confirm-layer {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background: color-mix(in srgb, var(--rep-ink) 82%, transparent);
      }
      .confirm-card {
        width: min(24rem, 100%);
        padding: 1.25rem;
        border: 1px solid var(--rep-hairline);
        background: var(--rep-ink-elevated);
        box-shadow: none;
      }
      .confirm-card h2 {
        margin: 0 0 0.6rem;
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-section);
        font-weight: 500;
      }
      .confirm-card p {
        margin: 0 0 1.1rem;
        color: var(--rep-dim);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
        line-height: 1.5;
      }

      /* --- the docked cast strip ---------------------------------------- */
      .mini-strip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(var(--rep-remote-nav) + env(safe-area-inset-bottom));
        z-index: 13;
        display: grid;
        grid-template-columns: 2.35rem var(--rep-remote-touch) minmax(0, 1fr) var(--rep-remote-touch);
        align-items: center;
        gap: 0.45rem;
        width: 100%;
        max-width: 48rem;
        height: var(--rep-remote-strip);
        margin: 0 auto;
        padding:
          0.35rem
          calc(var(--rep-remote-gutter) + env(safe-area-inset-right))
          0.35rem
          calc(var(--rep-remote-gutter) + env(safe-area-inset-left));
        border: 0;
        border-top: 1px solid var(--rep-hairline);
        border-bottom: 1px solid var(--rep-hairline);
        background: var(--rep-ink);
        box-shadow: none;
        overflow: hidden;
      }
      .mini-strip::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        background: var(--rep-house);
        opacity: 0.55;
      }
      .mini-art {
        display: block;
        width: 2.35rem;
        height: calc(var(--rep-remote-strip) - 0.7rem);
        overflow: hidden;
        background: var(--rep-ink-raised);
      }
      .mini-art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) brightness(0.86);
      }
      .mini-progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: block;
        height: 2px;
        background: var(--rep-hairline);
        pointer-events: none;
      }
      .mini-progress span {
        display: block;
        height: 100%;
        background: var(--rep-house);
      }
      .mini-center {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-rows: auto auto;
        column-gap: 0.45rem;
        align-items: center;
        min-width: 0;
        height: calc(var(--rep-remote-strip) - 0.7rem);
        padding: 0;
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .mini-chevron {
        grid-row: 1 / span 2;
        color: var(--rep-house);
        line-height: 1;
      }
      .mini-name {
        overflow: hidden;
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-body);
        font-weight: 500;
        line-height: 1.08;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mini-episode {
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        line-height: 1.2;
      }
      .mini-strip .btn-icon {
        width: var(--rep-remote-touch);
        height: var(--rep-remote-touch);
        border-color: transparent;
        color: var(--rep-dim);
      }
      .mini-strip .btn-primary {
        border-color: var(--rep-house);
        background: var(--rep-house);
        color: var(--rep-ink);
      }

      /* --- the bottom index --------------------------------------------- */
      .bottom-nav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 12;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        height: calc(var(--rep-remote-nav) + env(safe-area-inset-bottom));
        padding:
          0
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        background: var(--rep-ink);
        border-top: 1px solid var(--rep-hairline);
        backdrop-filter: none;
      }
      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.18rem;
        min-height: 0;
        padding: 0.35rem 0.1rem;
        border: 0;
        background: transparent;
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        font-weight: 400;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      .nav-item svg { width: 1.15rem; height: 1.15rem; }
      .nav-item[aria-current="page"] {
        background: transparent;
        color: var(--rep-house);
        box-shadow: inset 0 2px 0 var(--rep-house);
      }

      .alert {
        position: absolute;
        left: var(--rep-remote-gutter);
        right: var(--rep-remote-gutter);
        bottom: calc(var(--rep-remote-nav) + var(--rep-remote-strip) + 0.75rem + env(safe-area-inset-bottom));
        z-index: 60;
        margin: 0;
        padding: 0.7rem 0.8rem;
        border: 1px solid var(--rep-status-red);
        background: var(--rep-ink-raised);
        color: var(--rep-ivory);
        font-family: var(--rep-sans);
        font-size: var(--rep-remote-text-caption);
      }

      .pending-pill {
        position: fixed;
        left: 50%;
        bottom: calc(var(--rep-remote-nav) + var(--rep-remote-strip) + 1rem + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 80;
        padding: 0.45rem 0.8rem;
        border: 1px solid var(--rep-hairline);
        background: var(--rep-ink);
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        pointer-events: none;
      }
      [data-pending="true"] { opacity: 0.5; cursor: progress; }
      [data-pending="true"][data-a="choose-stream"]::after {
        content: "Opening…";
        margin-left: 0.5rem;
        color: var(--rep-dim);
      }

      /* --- surface 2: the expanded programme card ----------------------- */
      .cast {
        position: fixed;
        inset: 0;
        z-index: 45;
        overflow-y: auto;
        background: var(--rep-ink);
        padding: 0 0 1.5rem;
      }
      .cast-inner {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 34rem;
        min-height: 100%;
        margin: 0 auto;
        gap: 0;
        padding: 0 var(--rep-remote-gutter);
      }
      .cast-head {
        order: 0;
        position: sticky;
        top: 0;
        z-index: 6;
        display: grid;
        grid-template-columns: var(--rep-remote-touch) minmax(0, 1fr);
        align-items: center;
        gap: 0.75rem;
        margin: 0 calc(-1 * var(--rep-remote-gutter));
        padding:
          calc(0.55rem + env(safe-area-inset-top))
          var(--rep-remote-gutter)
          0.55rem;
        background: var(--rep-ink);
        border-bottom: 1px solid var(--rep-hairline);
      }
      .cast-live {
        display: inline-flex;
        align-items: center;
        justify-self: end;
        gap: 0.35rem;
        color: var(--rep-muted);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .cast-live::before {
        content: "";
        width: 0.35rem;
        height: 0.35rem;
        background: var(--rep-house);
      }
      .cast-live[data-live="false"]::before { background: var(--rep-status-red); }

      .cast-plate {
        order: 1;
        position: relative;
        display: block;
        margin: 0 calc(-1 * var(--rep-remote-gutter));
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-top: 1px solid var(--rep-hairline);
        border-bottom: 1px solid var(--rep-hairline);
        background: var(--rep-ink-raised);
      }
      .cast-plate-art {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) brightness(0.74);
      }
      .cast-plate-scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(0deg, var(--rep-ink) 0%, color-mix(in srgb, var(--rep-ink) 55%, transparent) 45%, transparent 78%),
          linear-gradient(90deg, color-mix(in srgb, var(--rep-ink) 45%, transparent), transparent 62%);
        pointer-events: none;
      }
      .cast-plate-copy {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        gap: 0.25rem;
        padding: 1rem calc(var(--rep-remote-gutter) + env(safe-area-inset-left)) 0.85rem;
      }
      .cast-plate-kicker {
        color: var(--rep-house);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        letter-spacing: var(--rep-tracking-caps);
        text-transform: uppercase;
      }
      .cast-plate-name {
        display: -webkit-box;
        margin: 0;
        overflow: hidden;
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-hero);
        font-weight: 500;
        letter-spacing: var(--rep-tracking-display);
        line-height: 1.02;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .cast-plate-episode {
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        line-height: 1.3;
      }

      .cast-menus {
        order: 5;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0;
        border-top: 1px solid var(--rep-hairline);
        border-bottom: 1px solid var(--rep-hairline);
      }
      .cast-menus .utility { padding: 0.6rem 0.15rem; }
      .utility {
        display: grid;
        justify-items: center;
        gap: 0.3rem;
        min-height: 3.6rem;
        padding: 0.6rem 0.35rem;
        border: 0;
        border-right: 1px solid var(--rep-hairline);
        background: transparent;
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        font-weight: 400;
        letter-spacing: 0.02em;
        line-height: 1.25;
        cursor: pointer;
      }
      .utility:last-child { border-right: 0; }
      .utility .rep-icon {
        color: var(--rep-house);
        width: 1.2rem;
        height: 1.2rem;
      }
      .utility[aria-expanded="true"] {
        background: var(--rep-ink-raised);
        color: var(--rep-ivory);
        box-shadow: inset 0 -2px 0 var(--rep-house);
      }
      .utility:disabled { opacity: 0.4; cursor: not-allowed; }

      /*
       * Volume is not a menu on the repertory card: it is the one always-visible
       * box, between the transport and the five-menu row. It is a bounded
       * hairline box, not a popover; the mute control is an icon.
       */
      .volume-panel {
        order: 4;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.6rem;
        margin: 0.65rem 0 0.9rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--rep-hairline);
        background: var(--rep-ink-raised);
      }
      .volume-level {
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);
        white-space: nowrap;
      }
      .volume-level::before {
        content: "Vol ";
        color: var(--rep-muted);
      }
      .volume-panel input[type="range"] { width: 100%; }
      .volume-panel .btn-icon {
        width: auto;
        min-width: var(--rep-remote-touch);
        height: var(--rep-remote-touch);
        padding: 0 0.6rem;
      }
      .volume-panel .btn-icon svg {
        display: block;
        width: 1.15rem;
        height: 1.15rem;
      }

      .timeline {
        order: 2;
        display: grid;
        gap: 0.35rem;
        margin-top: 0.55rem;
        padding: 0.35rem 0 0.1rem;
      }
      .seek-track {
        position: relative;
        display: flex;
        align-items: center;
        height: 2.2rem;
      }
      .seek-track::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 2px;
        background: var(--rep-hairline);
        transform: translateY(-50%);
      }
      .seek-buffered,
      .seek-played {
        position: absolute;
        top: 50%;
        height: 2px;
        transform: translateY(-50%);
        pointer-events: none;
      }

        background: transparent;
      }
      .seek-track input[type="range"]::-webkit-slider-thumb {
        appearance: none; -webkit-appearance: none;
        width: 0.7rem;
        height: 0.7rem;

      .transport {
        order: 3;

      .transport .primary-round {

      .cast-footer {

      /* --- surface 3: the Audio & Subtitles drawer ---------------------- */
      .sheet-layer {

        position: fixed;
        z-index: 54;
        overflow: hidden;
        pointer-events: none;
      }
      .sheet-panel {
        width: 100%;
        max-width: 38rem;
        max-height: 88dvh;
        overflow-y: auto;
        padding:
          0
          var(--rep-remote-gutter)
          calc(1.1rem + env(safe-area-inset-bottom));
        border: 0;
        border-top: 1px solid var(--rep-house);
        background: var(--rep-ink);
        box-shadow: none;
      }
      .sheet-head {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 calc(-1 * var(--rep-remote-gutter)) 0.5rem;
        padding: 0.75rem var(--rep-remote-gutter);
        border-bottom: 1px solid var(--rep-hairline);
        background: var(--rep-ink);
        backdrop-filter: none;
      }
      .sheet-head h2 {
        margin: 0;
        color: var(--rep-ivory);
        font-family: var(--rep-display);
        font-size: var(--rep-remote-text-section);
        font-weight: 500;
        letter-spacing: var(--rep-tracking-display);
      }
      .sheet-head .btn-primary {
        min-height: auto;
        padding: 4px 0;
        border: 0;
        border-bottom: 1px solid var(--rep-house);
        background: transparent;
        color: var(--rep-house);
      }
      .sheet-group { margin-top: 1.25rem; }
      .sheet-group h3 {
        margin: 0 0 0.5rem;
        color: var(--rep-muted);
        font-family: var(--rep-mono);

        letter-spacing: var(--rep-tracking-caps);

      .track {

        align-items: center;

        gap: 0.6rem;

        margin: 0;
        padding: 0.75rem 0;
        border: 0;
        border-bottom: 1px solid var(--rep-hairline);
        background: transparent;
        color: var(--rep-dim);

      .delay-row,
      .size-row {

        align-items: center;

        padding: 0.25rem 0 0.5rem;
      }

      .size-readout {
        min-width: 5rem;
        color: var(--rep-dim);
        font-family: var(--rep-mono);
        font-size: var(--rep-remote-text-badge);

      /* --- a phone wide enough for two columns --------------------------- */
      @media (min-width: 720px) {
        .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .poster { width: 9rem; }
        .cast-inner { max-width: 38rem; }
        .mini-strip { max-width: 48rem; }

    </style>

  </head>
  <body>
    <!--
      The repertory icon set, spliced from `crates/host-wire/remote/icons.svg` at
      serve time (#159). One drawn set for the window and the served page; the
      page never draws a Unicode glyph for a mark.
    -->
    <svg id="rep-icon-sprite" aria-hidden="true" focusable="false" style="display:none">
      <!--__SPLICE_REPERTORY_ICONS__-->
    </svg>
    <!--
      The remote's capability list: every Action this page can send, and no
      other. It is the whole Action surface (ADR-0002): the remote is the Host's
      own window's equal, not a curated subset, and the two share one command
      surface. `host-wire` asserts this list against
      `host_core::Action::SPELLINGS` (#32), so a capability added for one client
      cannot go missing from the other. `dispatch` refuses to send a spelling
      that is not here, so the declaration is load-bearing rather than a
      comment: a control wired to an Action this list does not name throws
      rather than sending it.
    -->
    <script type="application/json" id="action-capabilities">["set_subtitle_language","clear_subtitle_language","set_subtitle_color","set_subtitle_scale","set_stream_buffer","set_featured_catalog","clear_featured_catalog","add_addon","reorder_addon","remove_addon","set_tmdb_key","clear_tmdb_key","sign_in_stremio","sign_out_stremio","pair_device","revoke_device","browse_catalog","search_catalogs","discover","search","open_title","open_discovered_title","find_streams","preview","library","play_stream","resume","set_paused","seek","set_audio_track","set_subtitle_track","set_subtitle_delay","set_speed","set_volume","set_muted","next_chapter","previous_chapter","set_chapter","set_crop","autocrop","set_aspect","next_episode","previous_episode","stop_playback"]</script>

    <!-- The wait every control shows while the Host answers (#137). -->
    <div id="pending-pill" class="pending-pill" role="status" aria-live="polite" hidden>
      Waiting for the Host…
    </div>

    <!-- What a device that has not paired sees. -->
    <section id="pairing" class="pairing hidden">
      <form id="pair-form" class="pairing-card">
        <h1>Pair this device</h1>
        <p class="lede">
          Type the code the Host is showing. This device is remembered; the code
          is not needed again.
        </p>
        <div class="form-field">
          <label for="code">Pairing code · single use</label>
          <input id="code" name="code" autocomplete="off" autocapitalize="characters"
                 spellcheck="false" inputmode="latin" maxlength="12" placeholder="ABCDEF" />
        </div>
        <div class="form-field">
          <label for="name">Name this device</label>
          <input id="name" name="name" autocomplete="off" maxlength="64" placeholder="Phone" />
        </div>
        <button type="submit" class="btn btn-primary" data-focusable>Pair</button>
        <p id="pair-error" class="error"></p>
      </form>
    </section>

    <div id="app" class="app hidden">
      <!-- Surface 1: six destinations, the docked strip, and the bottom nav. -->
      <section id="surface-browse" class="surface-browse" aria-label="Cast Remote">
        <header class="topbar">
          <span class="brand">streamingapp</span>
          <span id="connection" class="connection" data-live="true">live</span>
        </header>

        <main id="screen" class="screen"></main>
        <div id="mini-strip" class="mini-strip hidden" aria-label="Now playing"></div>
        <nav id="bottom-nav" class="bottom-nav" aria-label="Destinations"></nav>
        <p id="error" class="alert hidden" role="alert"></p>
      </section>

      <!-- Pushed levels: Titles, Streams, Settings sub-screens, confirms. -->
      <div id="level-host" class="level-host hidden"></div>

      <!-- Surface 2: the expanded Cast Remote. -->
      <section id="surface-remote" class="cast hidden" aria-label="Cast Remote — expanded"></section>

      <!-- Surface 3: the Audio & Subtitles sheet. -->
      <div id="sheet" class="sheet-layer hidden" role="dialog" aria-modal="true" aria-label="Audio and subtitles"></div>
    </div>

    <script>
      "use strict";

      // ---------------------------------------------------------------------
      // The wire: one page, one version, one capability list.
      // ---------------------------------------------------------------------
      const VERSION = 1;
      const TOKEN_KEY = "streamingapp.device.token";
      const CAPABILITIES = JSON.parse(document.getElementById("action-capabilities").textContent);

      // Spliced from `src/subtitle-languages.json` at serve time (#88): one list,
      // two clients. The picker does not carry a second copy.
      const SUBTITLE_LANGUAGES = /*__SPLICE_SUBTITLE_LANGUAGES__*/;
      const HOST_PICKS_PER_VIDEO = "Host picks per Video";

      // The keyboard column of `src/input.ts`, inlined because this page has no
      // build step. The overlap with the window's table is asserted by
      // `host-wire/src/remote.rs`; there is deliberately no pad column here —
      // the Gamepad API is not available on an insecure HTTP origin.
      const KEY_INTENTS = Object.freeze({
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right",
        Escape: "back",
        Backspace: "back",
        GoBack: "back",
      });

      // ---------------------------------------------------------------------
      // Safe HTML
      //
      // Every string that reaches the page — a Title's name, an Addon's own
      // words about a Stream, a poster — is escaped unless it is markup this
      // page built. `html` returns a `Raw`, and interpolating one inserts it
      // unescaped (that is how one template nests in another); everything else
      // is escaped, so an Addon cannot put markup, or an attribute break, into
      // another client's page.
      // ---------------------------------------------------------------------
      class Raw {
        constructor(markup) { this.markup = markup; }
      }
      function raw(markup) { return new Raw(markup); }
      function esc(value) {
        return String(value === null || value === undefined ? "" : value).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]),
        );
      }
      function interpolate(value) {
        if (value === null || value === undefined || value === false) { return ""; }
        if (value instanceof Raw) { return value.markup; }
        if (Array.isArray(value)) { return value.map(interpolate).join(""); }
        return esc(value);
      }
      function html(strings, ...values) {
        let out = "";
        for (let i = 0; i < strings.length; i += 1) {
          out += strings[i];
          if (i < values.length) { out += interpolate(values[i]); }
        }
        return raw(out);
      }
      const $ = (id) => document.getElementById(id);
      /** A boolean attribute, written only when it is true. */
      function off(condition) { return condition ? raw("disabled") : null; }
      function pressed(condition) { return condition ? "true" : "false"; }

      /**
       * One mark from the sprite the Host splices into the page (#159).
       *
       * The window's `icons.tsx` is the source; the sprite carries the same
       * drawings. `stroke-width` is the caller's: chrome is 1.7, a mark that
       * stands alone over the picture is 2–2.2.
       */
      function mark(name, strokeWidth) {
        return html`<svg class="rep-icon" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="${strokeWidth === undefined ? 1.7 : strokeWidth}"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <use href="#rep-icon-${name}"></use>
        </svg>`;
      }

      // ---------------------------------------------------------------------
      // The model: the pure decisions the surface is drawn from, the same ones
      // the Host's own window makes (src/*.ts). Kept here by hand because this
      // page has no build step (ADR-0017 §2); the Host is what decides, and
      // these only say how its facts read.
      // ---------------------------------------------------------------------
      const MOVIE = "movie";
      const SERIES = "series";
      const SKIP = "skip";
      const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
      const DELAY_STEP = 0.1;
      // The subtitle appearance Settings offers (#126, ADR-0024). The list is
      // spliced in from `src/subtitle-appearance.json` at serve time, the same
      // one `src/controls.ts` imports, so the window and this page cannot drift.
      const SUBTITLE_APPEARANCE = /*__SPLICE_SUBTITLE_APPEARANCE__*/;
      const SUBTITLE_COLORS = SUBTITLE_APPEARANCE.colors;
      const SUBTITLE_SCALES = SUBTITLE_APPEARANCE.scales;
      // The Stream buffer presets (#135, ADR-0026), spliced from
      // `src/stream-buffer.json` — the same list the window's Settings imports.
      const STREAM_BUFFER = /*__SPLICE_STREAM_BUFFER__*/;
      const STREAM_BUFFER_SECONDS = STREAM_BUFFER.seconds;
      const STREAM_BUFFER_MEGABYTES = STREAM_BUFFER.megabytes;
      const ASPECTS = [
        { label: "Source", aspect: { kind: "source" } },
        { label: "16:9", aspect: { kind: "ratio", value: 16 / 9 } },
        { label: "4:3", aspect: { kind: "ratio", value: 4 / 3 } },
        { label: "21:9", aspect: { kind: "ratio", value: 21 / 9 } },
      ];
      const CROP_RATIOS = ASPECTS.filter((choice) => choice.aspect.kind === "ratio").map(
        (choice) => ({ label: choice.label, ratio: choice.aspect.value }),
      );
      const HERO_SLIDES = 4;

      const NAV = [
        { id: "home", label: "Home" },
        { id: "discover", label: "Discover" },
        { id: "search", label: "Search" },
        { id: "library", label: "Library" },
        { id: "addons", label: "Addons" },
        { id: "settings", label: "Settings" },
      ];

      /** The four Settings categories, shared by the list and its pushed titles. */
      const SETTINGS_CATEGORIES = [
        { id: "credentials", title: "Credentials", note: "The secret store, the TMDB key, and the Stremio account." },
        { id: "preferences", title: "Preferences", note: "Subtitle language and appearance, the Stream buffer, and the one Catalog Home's hero is drawn from." },
        { id: "remote-devices", title: "Remote devices", note: "The address a browser pairs with, the code, and paired devices." },
        { id: "about", title: "About/Credits", note: "The licences and TMDB attribution." },
      ];

      const MOVIE_GENRES = [
        { id: 28, name: "Action" }, { id: 12, name: "Adventure" }, { id: 16, name: "Animation" },
        { id: 35, name: "Comedy" }, { id: 80, name: "Crime" }, { id: 99, name: "Documentary" },
        { id: 18, name: "Drama" }, { id: 10751, name: "Family" }, { id: 14, name: "Fantasy" },
        { id: 36, name: "History" }, { id: 27, name: "Horror" }, { id: 10402, name: "Music" },
        { id: 9648, name: "Mystery" }, { id: 10749, name: "Romance" }, { id: 878, name: "Science Fiction" },
        { id: 10770, name: "TV Movie" }, { id: 53, name: "Thriller" }, { id: 10752, name: "War" },
        { id: 37, name: "Western" },
      ];
      const SERIES_GENRES = [
        { id: 10759, name: "Action & Adventure" }, { id: 16, name: "Animation" }, { id: 35, name: "Comedy" },
        { id: 80, name: "Crime" }, { id: 99, name: "Documentary" }, { id: 18, name: "Drama" },
        { id: 10751, name: "Family" }, { id: 10762, name: "Kids" }, { id: 9648, name: "Mystery" },
        { id: 10763, name: "News" }, { id: 10764, name: "Reality" }, { id: 10765, name: "Sci-Fi & Fantasy" },
        { id: 10766, name: "Soap" }, { id: 10767, name: "Talk" }, { id: 10768, name: "War & Politics" },
        { id: 37, name: "Western" },
      ];
      function genresOf(kind) { return kind === SERIES ? SERIES_GENRES : MOVIE_GENRES; }
      const SEARCH_KINDS = [{ kind: MOVIE, label: "Movies" }, { kind: SERIES, label: "Series" }];

      function formatTime(seconds) {
        if (seconds === null || seconds === undefined || !isFinite(seconds) || seconds < 0) {
          return "--:--";
        }
        const whole = Math.floor(seconds);
        const minutes = Math.floor(whole / 60);
        const rest = whole % 60;
        const padded = String(rest).padStart(2, "0");
        if (minutes < 60) { return minutes + ":" + padded; }
        const hours = Math.floor(minutes / 60);
        return hours + ":" + String(minutes % 60).padStart(2, "0") + ":" + padded;
      }
      function remainingTime(position, duration) {
        if (position === null || duration === null || !isFinite(position) || !isFinite(duration)) {
          return "--:--";
        }
        return "\u2212" + formatTime(Math.max(0, duration - position));
      }
      /** Where playback is on its track, between 0 and 1; zero where the length is unknown. */
      function timelineFraction(position, duration) {
        if (position === null || position === undefined || duration === null || duration === undefined) {
          return 0;
        }
        if (!isFinite(position) || !isFinite(duration) || duration <= 0) { return 0; }
        return Math.min(1, Math.max(0, position / duration));
      }
      /**
       * The span of the timeline the Player has read ahead, as fractions of the
       * track: mirrors `bufferedSpan` in `src/shell/osd.ts` (#139). Null where
       * there is no answer, no length to place it against, or a span the clamp
       * emptied — a forward seek can leave it behind the played fill, and that
       * gap is the reading, not a mistake.
       */
      function bufferedSpan(buffered, duration) {
        if (!buffered || duration === null || duration === undefined) { return null; }
        if (!isFinite(duration) || duration <= 0) { return null; }
        if (!isFinite(buffered.start) || !isFinite(buffered.end)) { return null; }
        const start = Math.min(duration, Math.max(0, buffered.start));
        const end = Math.min(duration, Math.max(0, buffered.end));
        if (end <= start) { return null; }
        return { left: start / duration, width: (end - start) / duration };
      }
      function formatDelay(seconds) {
        const tenths = Math.round(seconds * 10) / 10;
        if (tenths === 0) { return "0.0 s"; }
        const magnitude = Math.abs(tenths).toFixed(1);
        return tenths > 0 ? "+" + magnitude + " s" : "\u2212" + magnitude + " s";
      }
      function stepDelay(seconds, by) { return Math.round((seconds + by) * 10) / 10; }
      function stepScale(scale, direction) {
        if (direction > 0) {
          const larger = SUBTITLE_SCALES.find((choice) => choice.scale > scale + 1e-6);
          return larger ? larger.scale : SUBTITLE_SCALES[SUBTITLE_SCALES.length - 1].scale;
        }
        const smaller = SUBTITLE_SCALES.slice().reverse()
          .find((choice) => choice.scale < scale - 1e-6);
        return smaller ? smaller.scale : SUBTITLE_SCALES[0].scale;
      }
      function formatScale(scale) { return Math.round(scale * 100) + "%"; }
      function scaleSelected(current, choice) { return Math.abs(current - choice) < 1e-6; }
      function scalePreset(scale) {
        return SUBTITLE_SCALES.some((choice) => scaleSelected(scale, choice.scale));
      }
      function colorSelected(current, choice) {
        return String(current).toUpperCase() === choice.toUpperCase();
      }
      function formatBufferSeconds(seconds) {
        if (seconds >= 60 && seconds % 60 === 0) { return (seconds / 60) + " min"; }
        return seconds + " s";
      }
      function formatBufferMegabytes(megabytes) {
        return megabytes + " MB";
      }
      function bufferSecondsPreset(seconds) {
        return STREAM_BUFFER_SECONDS.some((choice) => choice.seconds === seconds);
      }
      function bufferMegabytesPreset(megabytes) {
        return STREAM_BUFFER_MEGABYTES.some((choice) => choice.megabytes === megabytes);
      }
      /** The pair the chips draw: the draft a press made, or what the Host says. */
      function currentBuffer() {
        return state.bufferDraft || (state.snapshot && state.snapshot.preferences.streamBuffer)
          || { seconds: STREAM_BUFFER.defaultSeconds, megabytes: STREAM_BUFFER.defaultMegabytes };
      }
      function formatSpeed(rate) { return rate + "\u00d7"; }
      function formatVolume(level) { return Math.round(level) + "%"; }
      function chapterLabel(chapter) {
        const at = formatTime(chapter.time);
        return chapter.title ? at + " \u2014 " + chapter.title : at;
      }
      function speedSelected(rate, choice) {
