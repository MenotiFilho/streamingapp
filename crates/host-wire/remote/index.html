              </div>
            </div>`;
        }
        if (level.failure) {
          return levelFrame(nameOf(level.title || { name: "Title", id: "" }, preview),
            html`<p class="error" role="alert">${explain(level.failure)}</p>`);
        }

        const title = level.title;
        const name = nameOf(title, preview);
        const art = titleArtOf(title, preview);
        const release = releaseOf(title, preview);
        const seasons = seasonsOf(title);
        const shown = seasons.find((season) => season.season === level.shownSeason) || seasons[0];
        const facts = [];
        if (title.imdbRating) { facts.push({ text: "\u2605 " + title.imdbRating, tone: "accent" }); }
        if (release) { facts.push({ text: release }); }
        if (title.runtime) { facts.push({ text: title.runtime }); }
        for (const genre of title.genres) { facts.push({ text: genre }); }

        return html`
          <div class="level">
            <article aria-label="${name}">
              <header class="title-hero">
                ${art.src ? html`<img class="title-art" src="${art.src}" alt="" data-art="${art.kind}" />` : null}
                <span class="title-scrim" aria-hidden="true"></span>
                <div class="title-copy">
                  <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
                    <button type="button" class="btn btn-ghost" data-focusable data-a="pop-level"
                            data-focus-key="level-back" data-autofocus>\u2039 Back</button>
                  </div>
                  ${title.logo
                    ? html`<img class="title-logo" src="${title.logo}" alt="${name}" />`
                    : html`<h1 class="title-name">${name}</h1>`}
                  ${facts.length > 0
                    ? html`<div class="chip-row">${facts.map((fact) => html`
                        <span class="chip" aria-pressed="${fact.tone === "accent"}">${fact.text}</span>`)}</div>`
                    : null}
                  <div class="chip-row">
                    ${title.addon ? html`<span class="chip" aria-pressed="true">${title.addon}</span>` : null}
                    ${title.key && title.key.kind === "addon"
                      ? html`<span class="chip">Unmapped \u2014 no TMDB record met this Title.</span>` : null}
                  </div>
                  ${title.description ? html`<p class="title-desc">${title.description}</p>` : null}
                </div>
              </header>

              <div class="level-body">
                ${seasons.length === 0
                  ? html`
                      <p class="note">${isSeries(title)
                        ? "This series' Addon listed no episodes."
                        : "This Title is one Video: the film itself."}</p>
                      ${isSeries(title) ? null : html`
                        <button type="button" class="btn btn-primary" data-focusable data-a="title-play-film"
                                data-focus-key="title-play-film">Play</button>`}`
                  : html`
                      <div class="chip-row" aria-label="Seasons">
                        ${seasons.map(({ season }) => html`
                          <button type="button" class="chip" data-focusable data-a="title-season"
                                  data-season="${season === null ? "none" : season}"
                                  data-focus-key="title-season-${season === null ? "none" : season}"
                                  aria-pressed="${pressed(shown && shown.season === season)}">${seasonName(season)}</button>`)}
                      </div>
                      ${shown ? shown.videos.map((video) => {
                        videoIndex.set(video.id, video);
                        const label = labelOf(video);
                        return html`
                          <button type="button" class="episode lift" data-focusable
                                  data-a="title-episode" data-id="${video.id}"
                                  data-focus-key="title-episode-${video.id}"
                                  aria-pressed="${pressed(level.selected && level.selected.id === video.id)}">
                            ${video.thumbnail
                              ? html`<span class="episode-still"><img src="${video.thumbnail}" alt="" loading="lazy" /></span>`
                              : null}
                            <span>
                              ${label ? html`<span class="episode-label">${label}</span><br />` : null}
                              <span class="episode-name">${video.name || video.id}</span>
                            </span>
                          </button>`;
                      }) : null}`}
              </div>
            </article>
          </div>`;
      }

      function renderStreamsLevel(level) {
        const subject = isSeries(level.title)
          ? [labelOf(level.video) || level.video.id, level.video.name].filter(Boolean).join(" \u2014 ")
          : nameOf(level.title, level.preview);
        const head = html`
          <header class="level-head">
            <button type="button" class="btn btn-ghost" data-focusable data-a="pop-level"
                    data-focus-key="level-back" data-autofocus>\u2039 Back</button>
            <h1 class="level-title">Streams \u2014 ${subject}</h1>
          </header>`;

        if (level.loading) {
          return html`<div class="level">${head}<div class="level-body">
            <p class="note" role="status">Looking for Streams\u2026</p></div></div>`;
        }
        if (level.failure) {
          return html`<div class="level">${head}<div class="level-body">
            <p class="error" role="alert">${explain(level.failure)}</p></div></div>`;
        }
        const groups = level.groups || [];
        return html`
          <div class="level">
            ${head}
            <div class="level-body">
              ${groups.length === 0
                ? html`<p class="note">No configured Addon offers Streams for this Video.</p>` : null}
              ${groups.map((group) => {
                groupIndex.set(group.addon, group);
                return html`
                  <section class="stream-group" aria-label="${group.addon}">
                    <h2>${group.addon}</h2>
                    ${group.failure ? html`<p class="error" role="alert">${explain(group.failure)}</p>` : null}
                    ${!group.failure && group.streams.length === 0
                      ? html`<p class="note">This Addon answered nothing this Host can play.</p>` : null}
                    ${group.streams.map((stream, index) => {
                      const badges = badgeLines(stream);
                      const note = playabilityNote(stream.playback);
                      return html`
                        <button type="button" class="stream lift" data-focusable
                                data-a="choose-stream" data-addon="${group.addon}" data-index="${index}"
                                data-focus-key="stream-${group.addon}-${index}"
                                aria-pressed="${pressed(level.chosen === stream)}">
                          ${badges.length > 0
                            ? html`<span class="stream-badges">${badges.map((badge) => html`
                                <span class="stream-badge">${badge}</span>`)}</span>` : null}
                          ${stream.filename ? html`<span class="stream-file">${stream.filename}</span>` : null}
                          ${stream.description ? html`<span class="stream-desc">${stream.description}</span>` : null}
                          ${stream.warnings.map((warning) => html`<span class="stream-warn">${warningNote(warning)}</span>`)}
                          ${note ? html`<span class="stream-danger">${note}</span>` : null}
                        </button>`;
                    })}
                  </section>`;
              })}
              ${level.chosen
                ? html`<p class="status" role="status">${unplayableNote(level.chosen)}</p>` : null}
            </div>
          </div>`;
      }

      function renderSettingsLevel(level) {
        const titles = {
          credentials: "Credentials",
          preferences: "Preferences",
          "remote-devices": "Remote devices",
          about: "About/Credits",
        };
        const body = level.category === "credentials" ? renderCredentials()
          : level.category === "preferences" ? renderPreferences()
          : level.category === "remote-devices" ? renderRemoteDevices()
          : renderAbout();
        return levelFrame(titles[level.category] || "Settings", body);
      }

      function settingsSection(title, body) {
        return html`<section class="settings-section"><h2>${title}</h2>${body}</section>`;
      }

      function renderCredentials() {
        const s = state.snapshot;
        const held = s.protection.tmdbHeld;
        const readout = protectionReadout(s.protection);
        return html`
          ${settingsSection("Protection", html`
            <dl class="readout">
              <dt>Secret store</dt><dd>${readout.backend}</dd>
              <dt>TMDB key</dt><dd>${readout.tmdb}</dd>
              <dt>Stremio account</dt><dd>${readout.stremio}</dd>
            </dl>`)}

          ${settingsSection("TMDB key", html`
            <p class="settings-copy">TMDB supplies Discover, Search, and the metadata over a mapped
              Title. The Host reads the key when it asks, and no Snapshot carries it.</p>
            <form id="tmdb-form">
              <div class="form-field">
                <label for="tmdb-key">TMDB API key or read-access token</label>
                <input id="tmdb-key" type="password" autocomplete="off" placeholder="the key TMDB gave you"
                       data-focusable data-focus-key="tmdb-key" />
              </div>
              <div class="actions">
                <button type="submit" class="btn btn-primary" data-focusable data-focus-key="tmdb-save">Save key</button>
                <button type="button" class="btn btn-danger" data-focusable data-a="clear-tmdb"
                        data-focus-key="tmdb-clear" ${off(!held)}>Clear key</button>
              </div>
            </form>`)}

          ${settingsSection("Stremio account", html`
            <p class="settings-copy">Sign in once and Watch progress travels both ways: what plays here
              appears in Stremio's own apps, and what is watched there is picked up here. Optional \u2014
              with no account, nothing about the Host depends on Stremio.</p>
            ${renderStremioForm("credentials", true)}`)}
        `;
      }

      function renderPreferences() {
        const s = state.snapshot;
        const heldLanguage = s.preferences.subtitleLanguage;
        const known = SUBTITLE_LANGUAGES.some((language) => language.tag === heldLanguage);
        const catalogs = declaredCatalogs(s);
        const featured = s.featuredCatalog;
        const featuredKey = featured ? featured.addon + "/" + featured.catalog.type + "/" + featured.catalog.id : null;
        return html`
          ${settingsSection("Subtitle language", html`
            <p class="settings-copy">${heldLanguage
              ? "The Host asks mpv to prefer " + subtitleLanguageName(heldLanguage) + " (" + heldLanguage + ")."
              : "The Host picks per Video \u2014 it asks mpv to match whatever subtitles the Stream carries."}</p>
            <div class="chip-row" style="flex-wrap:wrap;overflow:visible">
              <button type="button" class="chip" data-focusable data-a="language"
                      data-tag="host" data-focus-key="language-host"
                      aria-pressed="${pressed(heldLanguage === null)}">${HOST_PICKS_PER_VIDEO}</button>
              ${heldLanguage && !known
                ? html`<button type="button" class="chip" data-focusable data-a="language"
                        data-tag="${heldLanguage}" data-focus-key="language-${heldLanguage}"
                        aria-pressed="true">${subtitleLanguageName(heldLanguage)} (${heldLanguage})</button>`
                : null}
              ${SUBTITLE_LANGUAGES.map((language) => html`
                <button type="button" class="chip" data-focusable data-a="language"
                        data-tag="${language.tag}" data-focus-key="language-${language.tag}"
                        aria-pressed="${pressed(heldLanguage === language.tag)}">${language.name}</button>`)}
            </div>`)}

          ${settingsSection("Featured catalog", html`
            <p class="settings-copy">The one Catalog Home draws its hero from, in the Addon's own
              order. A preference of the Host's, so every client draws the same hero.</p>
            ${catalogs.length === 0
              ? html`<p class="note">No configured Addon offers a Catalog, so there is nothing to feature.</p>`
              : null}
            <div class="chip-row" style="flex-wrap:wrap;overflow:visible">
              <button type="button" class="chip" data-focusable data-a="featured"
                      data-ref="none" data-focus-key="featured-none"
                      aria-pressed="${pressed(featured === null)}">No featured catalog</button>
              ${catalogs.map((choice) => {
                const key = catalogKey(choice);
                const name = addonName(s, choice.addon) || choice.addon;
                return html`<button type="button" class="chip" data-focusable data-a="featured"
                        data-ref="${key}" data-focus-key="featured-${key}"
                        aria-pressed="${pressed(key === featuredKey)}">${choice.catalog.name} \u00b7 ${name}</button>`;
              })}
            </div>`)}
        `;
      }

      function renderRemoteDevices() {
        const s = state.snapshot;
        return html`
          ${settingsSection("Pairing", html`
            <dl class="readout">
              <dt>Address</dt><dd>${s.address || "This Host is not serving the network."}</dd>
              <dt>Pairing code</dt><dd class="tabular">${s.pairingCode}</dd>
            </dl>
            <p class="settings-copy">A browser on this network pairs with the address and code
              above, once. A device can be revoked on its own.</p>`)}

          ${settingsSection("Paired devices", html`
            ${s.devices.length === 0
              ? html`<p class="note">No device is paired yet.</p>`
              : s.devices.map((device) => html`
                  <div class="device-row">
                    <span>
                      <span class="device-name">${device.name}</span><br />
                      <span class="device-date">paired ${new Date(device.pairedAt).toLocaleString()}</span>
                    </span>
                    <button type="button" class="btn btn-danger" data-focusable data-a="revoke"
                            data-id="${device.id}" data-focus-key="revoke-${device.id}">Revoke ${device.name}</button>
                  </div>`)}`)}
        `;
      }

      function renderAbout() {
        return html`
          ${settingsSection("TMDB", html`
            <div class="credit" style="margin:0;border:0">
              <span class="tmdb-logo">/*__SPLICE_TMDB_LOGO__*/</span>
              <p class="credit-notice">This product uses the TMDB API but is not endorsed or certified by TMDB</p>
            </div>`)}

          ${settingsSection("Version", html`<p class="settings-copy">streamingapp
            <span class="tabular">${APP_VERSION}</span></p>`)}

          ${settingsSection("Licences", html`<p class="settings-copy">streamingapp is free software,
            released under the GNU General Public License, version 3 or later (GPL-3.0-or-later).
            Playback uses mpv (libmpv), whose default build is GPLv2 or later, linked in-process so
            the video surface stays mpv's own.</p>`)}
        `;
      }

      function renderConfirmLevel(level) {
        return html`
          <div class="confirm-layer">
            <div class="confirm-card" role="alertdialog" aria-modal="true" aria-label="${level.title}">
              <h2>${level.title}</h2>
              <p>${level.body}</p>
              ${level.failure ? html`<p class="error" role="alert">${explain(level.failure)}</p>` : null}
              <div class="actions">
                <button type="button" class="btn" data-focusable data-a="pop-level"
                        data-focus-key="confirm-cancel" data-autofocus>Cancel</button>
                <button type="button" class="btn btn-danger" data-focusable data-a="confirm"
                        data-focus-key="confirm-go">${level.confirmLabel}</button>
              </div>
            </div>
          </div>`;
      }

      function renderEpisodesLevel(level) {
        const subject = level.seriesName || "Episodes";
        if (level.loading) {
          return levelFrame(subject, html`<p class="note" role="status">Looking for this series' episodes\u2026</p>`);
        }
        if (level.failure) {
          return levelFrame(subject, html`<p class="error" role="alert">${explain(level.failure)}</p>`);
        }
        const title = level.title;
        if (!title) {
          return levelFrame(subject, html`<p class="note">No episodes are available for the playing series.</p>`);
        }
        const seasons = seasonsOf(title);
        const shown = seasons.find((season) => season.season === level.shownSeason) || seasons[0];
        return html`
          <div class="level">
            <header class="level-head">
              <button type="button" class="btn btn-ghost" data-focusable data-a="pop-level"
                      data-focus-key="level-back" data-autofocus>\u2039 Back</button>
              <h1 class="level-title">${nameOf(title, null)}</h1>
            </header>
            <div class="level-body">
              ${level.loadingStreams
                ? html`<p class="note" role="status">Looking for Streams\u2026</p>` : null}
              <div class="chip-row" aria-label="Seasons">
                ${seasons.map(({ season }) => html`
                  <button type="button" class="chip" data-focusable data-a="episode-season"
                          data-season="${season === null ? "none" : season}"
                          data-focus-key="episode-season-${season === null ? "none" : season}"
                          aria-pressed="${pressed(shown && shown.season === season)}">${seasonName(season)}</button>`)}
              </div>
              ${shown ? shown.videos.map((video) => {
                videoIndex.set(video.id, video);
                const label = labelOf(video);
                return html`
                  <button type="button" class="episode lift" data-focusable
                          data-a="episode-play" data-id="${video.id}"
                          data-focus-key="episode-play-${video.id}"
                          ${off(level.loadingStreams)}>
                    ${video.thumbnail
                      ? html`<span class="episode-still"><img src="${video.thumbnail}" alt="" loading="lazy" /></span>`
                      : null}
                    <span>
                      ${label ? html`<span class="episode-label">${label}</span><br />` : null}
                      <span class="episode-name">${video.name || video.id}</span>
                    </span>
                  </button>`;
              }) : null}
            </div>
          </div>`;
      }

      // --- the mini strip ---------------------------------------------------
      function nowTitle() {
        const p = playback();
        if (!p || !p.nowPlaying) { return { name: "a Stream", label: null, entry: null }; }
        const entry = state.snapshot
          ? state.snapshot.watchProgress.find((held) => held.video.id === p.nowPlaying.video.id) || null
          : null;
        const name = entry ? entry.title.name : streamTitle(p.nowPlaying);
        const label = p.episode
          ? "S" + p.episode.season + ":E" + p.episode.episode
          : entry ? labelOf(entry.video) : null;
        return { name, label, entry };
      }

      function renderMini() {
        const strip = $("mini-strip");
        const p = playback();
        const signature = miniSignature();
        if (signature === "none") {
          strip.classList.add("hidden");
          strip.innerHTML = "";
          state.miniSignature = null;
          return;
        }
        strip.classList.remove("hidden");
        if (signature === state.miniSignature) { return; }
        state.miniSignature = signature;
        const playing = p.state === "playing";
        const canTransport = transportable(p.state);
        const current = nowTitle();
        strip.innerHTML = html`
          <span class="mini-live" data-live="${pressed(state.online)}">${state.online ? "live" : "reconnecting\u2026"}</span>
          <button type="button" class="btn btn-icon" data-focusable data-a="seek-by" data-seconds="-10"
                  data-focus-key="mini-rewind" aria-label="Back ten seconds" ${off(!canTransport)}>\u221210s</button>
          <button type="button" class="mini-center" data-focusable data-a="expand-cast" data-focus-key="mini-center"
                  aria-label="Expand the Cast Remote">
            <span class="mini-chevron" aria-hidden="true">\uFE3F</span>
            <span class="mini-name">${current.name}</span>
            <span class="mini-episode">${current.label || ""}</span>
          </button>
          <button type="button" class="btn btn-icon ${playing ? "" : "btn-primary"}" data-focusable
                  data-a="pause-toggle" data-focus-key="mini-pause" aria-label="${playing ? "Pause" : "Play"}"
                  ${off(!canTransport)}>${playing ? "\u2016" : "\u25B6"}</button>
        `.markup;
      }

      // --- surface 2: the expanded Cast Remote ------------------------------
      function renderCast() {
        const view = captureView();
        renderCastBody();
        if (!state.focusTarget) { restoreView(view); }
      }

      function renderCastBody() {
        const cast = $("surface-remote");
        const p = playback();
        if (!state.cast || !p || !watching(p.state)) {
          cast.classList.add("hidden");
          cast.innerHTML = "";
          state.castSignature = null;
          return;
        }
        cast.classList.remove("hidden");
        const signature = castSignature();
        state.castSignature = signature;
        const current = nowTitle();
        const poster = current.entry
          ? current.entry.title.poster || current.entry.title.background
          : null;
        const episode = p.episode;
        const canTransport = transportable(p.state);
        const playing = p.state === "playing";
        const volume = Math.round(p.volume === null ? 100 : p.volume);
        const note = pictureNote(p.picture);

        cast.innerHTML = html`
          <div class="cast-inner">
            <header class="cast-head">
              <button type="button" class="btn btn-icon" data-focusable data-a="collapse-cast"
                      data-focus-key="cast-collapse" aria-label="Collapse the Cast Remote" data-autofocus>\uFE40</button>
              <div class="cast-heading">
                <span class="cast-name">${current.name}</span>
                <span class="cast-episode">${current.label || ""}</span>
              </div>
              <span></span>
            </header>

            <div class="cast-poster">
              ${poster ? html`<img src="${poster}" alt="" />` : null}
            </div>

            <div class="cast-utilities">
              <button type="button" class="utility" data-focusable data-a="open-sheet"
                      data-focus-key="cast-audio" aria-expanded="${state.sheet}">
                <span aria-hidden="true">CC</span>Audio &amp; Subtitles
              </button>
              <button type="button" class="utility" data-focusable data-a="volume-toggle"
                      data-focus-key="cast-volume" aria-expanded="${state.volumeOpen}">
                <span aria-hidden="true">${p.muted ? "\u2715" : "\u266A"}</span>Volume
              </button>
              <button type="button" class="utility" data-focusable data-a="episodes-open"
                      data-focus-key="cast-episodes" ${off(episode === null)}>
                <span aria-hidden="true">\u2630</span>Episodes
              </button>
            </div>

            ${state.volumeOpen
              ? html`
                  <div class="volume-panel">
                    <span class="volume-level" data-volume-level>${formatVolume(volume)}</span>
                    <div></div>
                    <input type="range" data-volume min="0" max="130" step="1" value="${volume}"
                           aria-label="Volume" data-focusable data-focus-key="cast-volume-slider" />
                    <button type="button" class="btn btn-icon" data-focusable data-a="mute-toggle"
                            data-focus-key="cast-mute" aria-pressed="${p.muted === true}"
                            aria-label="${p.muted ? "Unmute" : "Mute"}">${p.muted ? "Unmute" : "Mute"}</button>
                  </div>`
              : null}

            <div class="timeline">
              <input type="range" data-seek min="0" max="${p.duration === null ? 0 : p.duration}" step="1"
                     value="${p.position === null ? 0 : p.position}" aria-label="Position"
                     ${off(p.duration === null || !canTransport)} data-focusable data-focus-key="cast-seek" />
              <div class="times">
                <span class="tabular" data-clock>${formatTime(p.position)}</span>
                <span class="tabular" data-remaining>${remainingTime(p.position, p.duration)}</span>
              </div>
            </div>

            <div class="transport" aria-label="Transport">
              <button type="button" class="btn" data-focusable data-a="previous-episode"
                      data-focus-key="cast-previous" aria-label="Previous episode"
                      ${off(previousEpisodeDisabled(episode))}>\u23EE</button>
              <button type="button" class="btn" data-focusable data-a="seek-by" data-seconds="-10"
                      data-focus-key="cast-rewind" aria-label="Back ten seconds"
                      ${off(!canTransport)}>\u21BA10</button>
              <button type="button" class="btn btn-round primary-round" data-focusable data-a="pause-toggle"
                      data-focus-key="cast-pause" aria-label="${playing ? "Pause" : "Play"}"
                      ${off(!canTransport)}>${playing ? "\u2016" : "\u25B6"}</button>
              <button type="button" class="btn" data-focusable data-a="seek-by" data-seconds="10"
                      data-focus-key="cast-forward" aria-label="Forward ten seconds"
                      ${off(!canTransport)}>10\u21BB</button>
              <button type="button" class="btn" data-focusable data-a="next-episode"
                      data-focus-key="cast-next" aria-label="Next episode"
                      ${off(nextEpisodeDisabled(episode))}>\u23ED</button>
              <button type="button" class="btn" data-focusable data-a="stop"
                      data-focus-key="cast-stop" aria-label="Stop">\u25A0 Stop</button>
            </div>

            <div class="extras" aria-label="Playback controls">
              <button type="button" class="btn" data-focusable data-a="more-panel" data-panel="speed"
                      data-focus-key="cast-speed" aria-expanded="${state.morePanel === "speed"}">Speed</button>
              <button type="button" class="btn" data-focusable data-a="more-panel" data-panel="chapters"
                      data-focus-key="cast-chapters" aria-expanded="${state.morePanel === "chapters"}">Chapters</button>
              <button type="button" class="btn" data-focusable data-a="more-panel" data-panel="picture"
                      data-focus-key="cast-picture" aria-expanded="${state.morePanel === "picture"}">Picture</button>
            </div>

            ${state.morePanel === "speed"
              ? html`<div class="extra-panel"><h3>Playback speed</h3><div class="chip-row">
                  ${SPEEDS.map((rate) => html`
                    <button type="button" class="chip" data-focusable data-a="speed" data-rate="${rate}"
                            data-focus-key="cast-speed-${rate}"
                            aria-pressed="${pressed(speedSelected(p.speed, rate))}">${formatSpeed(rate)}</button>`)}
                </div></div>` : null}

            ${state.morePanel === "chapters"
              ? html`<div class="extra-panel"><h3>Chapters</h3>
                  <div class="actions" style="margin-bottom:0.5rem">
                    <button type="button" class="btn" data-focusable data-a="chapter-prev"
                            data-focus-key="cast-chapter-prev">Previous</button>
                    <button type="button" class="btn" data-focusable data-a="chapter-next"
                            data-focus-key="cast-chapter-next">Next</button>
                  </div>
                  ${p.chapters.length === 0
                    ? html`<p class="note">This Stream lists no chapters.</p>`
                    : p.chapters.map((chapter) => html`
                        <button type="button" class="chip" data-focusable data-a="chapter"
                                data-index="${chapter.index}" data-focus-key="cast-chapter-${chapter.index}"
                                aria-pressed="${pressed(p.chapter === chapter.index)}">${chapterLabel(chapter)}</button>`)}
                </div>` : null}

            ${state.morePanel === "picture"
              ? html`<div class="extra-panel"><h3>Aspect</h3><div class="chip-row">
                  ${ASPECTS.map((choice) => {
                    aspectIndex.set(choice.label, choice.aspect);
                    return html`<button type="button" class="chip" data-focusable data-a="aspect"
                            data-ref="${choice.label}" data-focus-key="cast-aspect-${choice.label}"
                            aria-pressed="${pressed(aspectSelected(p.aspect, choice.aspect))}">${choice.label}</button>`;
                  })}
                </div>
                <h3 style="margin-top:0.75rem">Crop</h3><div class="chip-row">
                  ${cropChoices(p.resolution).map((choice) => {
                    cropIndex.set(choice.label, choice.crop);
                    return html`<button type="button" class="chip" data-focusable data-a="crop"
                            data-ref="${choice.label}" data-focus-key="cast-crop-${choice.label}"
                            aria-pressed="${pressed(cropSelected(p.crop, choice.crop))}">${choice.label}</button>`;
                  })}
                </div>
                <p class="note">${p.crop
                  ? "Autocrop keeps " + p.crop.width + "\u00d7" + p.crop.height + "+" + p.crop.x + "+" + p.crop.y + "."
                  : "Autocrop keeps the whole frame."}</p>
                <h3 style="margin-top:0.75rem">Statistics</h3>
                <button type="button" class="btn" data-focusable data-a="stats-toggle"
                        data-focus-key="cast-statistics" aria-pressed="${state.showStatistics}">
                  ${state.showStatistics ? "Hide statistics" : "Show statistics"}</button>
                ${state.showStatistics
                  ? html`<dl class="readout" style="margin-top:0.5rem">${statisticsLines(p.statistics).map((line) => html`
                      <dt>${line.label}</dt><dd class="tabular">${line.value}</dd>`)}</dl>`
                  : null}
                </div>` : null}

            ${p.state === "opening"
              ? html`<p class="cast-note">Opening ${playingName(p.nowPlaying)}\u2026</p>` : null}
            ${p.state === "ended" ? html`<p class="cast-note">The Stream reached its end.</p>` : null}
            ${p.failure ? html`<p class="cast-note" data-danger="true">${p.failure}</p>` : null}
            ${note ? html`<p class="cast-note">${note}</p>` : null}

            <footer class="cast-footer">
              ${state.online
                ? "Connected to " + (state.device ? state.device.name : "the Host") +
                  (state.snapshot && state.snapshot.address ? " \u00b7 " + state.snapshot.address : "")
                : "Reconnecting\u2026"}
            </footer>
          </div>`.markup;

        updateCastLive();
      }

      function updateCastLive() {
        const p = playback();
        if (!p) { return; }
        const cast = $("surface-remote");
        const clock = cast.querySelector("[data-clock]");
        if (clock) { clock.textContent = formatTime(p.position); }
        const remaining = cast.querySelector("[data-remaining]");
        if (remaining) { remaining.textContent = remainingTime(p.position, p.duration); }
        const seek = cast.querySelector("[data-seek]");
        if (seek && document.activeElement !== seek) {
          seek.max = p.duration === null ? 0 : p.duration;
          seek.value = p.position === null ? 0 : p.position;
        }
        const volumeLevel = cast.querySelector("[data-volume-level]");
        if (volumeLevel) { volumeLevel.textContent = formatVolume(p.volume === null ? 100 : p.volume); }
      }

      // --- surface 3: Audio & Subtitles -------------------------------------
      function renderSheet() {
        const view = captureView();
        renderSheetBody();
        if (!state.focusTarget) { restoreView(view); }
      }

      function renderSheetBody() {
        const sheet = $("sheet");
        const p = playback();
        const signature = sheetSignature();
        if (signature === "none") {
          sheet.classList.add("hidden");
          sheet.innerHTML = "";
          state.sheetSignature = null;
          return;
        }
        if (signature === state.sheetSignature) { return; }
        state.sheetSignature = signature;
        sheet.classList.remove("hidden");
        const audio = orderedTracks(p.tracks, "audio");
        const subtitles = orderedTracks(p.tracks, "subtitle");
        const delay = p.subtitleDelay === null ? 0 : p.subtitleDelay;

        sheet.innerHTML = html`
          <div class="sheet-panel">
            <div class="sheet-head">
              <h2>Audio &amp; Subtitles</h2>
              <button type="button" class="btn btn-primary" data-focusable data-a="close-sheet"
                      data-focus-key="sheet-done" data-autofocus>Done</button>
            </div>

            <div class="sheet-group">
              <h3>Audio</h3>
              ${audio.length === 0
                ? html`<p class="note">This Stream carries no audio track to pick.</p>` : null}
              ${audio.map((track) => renderTrack(track))}
            </div>

            <div class="sheet-group">
              <h3>Subtitles</h3>
              ${subtitles.length === 0
                ? html`<p class="note">This Stream carries no subtitle track to pick.</p>` : null}
              ${subtitles.map((track) => renderTrack(track))}
              <button type="button" class="track" data-focusable data-a="track" data-kind="off"
                      data-focus-key="track-off" aria-pressed="${pressed(!subtitlesOn(p.tracks))}">
                <span>Subtitles off</span>
              </button>
            </div>

            <div class="sheet-group">
              <h3>Subtitle delay</h3>
              <div class="delay-row">
                <span class="delay-readout tabular" data-delay>${formatDelay(delay)}</span>
                <button type="button" class="btn" data-focusable data-a="delay"
                        data-seconds="${stepDelay(delay, -DELAY_STEP)}" data-focus-key="delay-back">\u22120.1 s</button>
                <button type="button" class="btn" data-focusable data-a="delay"
                        data-seconds="${stepDelay(delay, DELAY_STEP)}" data-focus-key="delay-forward">+0.1 s</button>
                <button type="button" class="btn" data-focusable data-a="delay"
                        data-seconds="0" data-focus-key="delay-reset"
                        aria-pressed="${pressed(delay === 0)}">Reset</button>
              </div>
            </div>
          </div>`.markup;
      }

      function renderTrack(track) {
        const marks = trackMarks(track);
        return html`
          <button type="button" class="track" data-focusable data-a="track"
                  data-kind="${track.kind}" data-id="${track.id}"
                  data-focus-key="track-${track.kind}-${track.id}" aria-pressed="${track.selected}">
            <span>${trackLabel(track)}</span>
            ${marks.length > 0 ? html`<span class="track-marks">${marks.join(" \u00b7 ")}</span>` : null}
          </button>`;
      }

      // ---------------------------------------------------------------------
      // Capturing and restoring what a repaint must not disturb: a field being
      // typed into, the control that had focus, and where a surface was read.
      // ---------------------------------------------------------------------
      function captureDrafts() {
        const drafts = {};
        document.querySelectorAll("input[id]").forEach((element) => {
          drafts[element.id] = { value: element.value, checked: element.checked };
        });
        return drafts;
      }
      function restoreDrafts(drafts) {
        for (const id of Object.keys(drafts)) {
          const element = document.getElementById(id);
          if (!element) { continue; }
          if (element.type === "range") { continue; }
          const draft = drafts[id];
          if (element.value !== draft.value) { element.value = draft.value; }
          if (element.type === "checkbox") { element.checked = draft.checked; }
        }
      }
      function captureView() {
        const active = document.activeElement;
        return {
          drafts: captureDrafts(),
          focus: active && active !== document.body ? focusKey(active) : null,
          screen: $("screen") ? $("screen").scrollTop : 0,
          level: $("level-host") ? $("level-host").scrollTop : 0,
          cast: $("surface-remote") ? $("surface-remote").scrollTop : 0,
          sheet: document.querySelector("#sheet .sheet-panel")
            ? document.querySelector("#sheet .sheet-panel").scrollTop : 0,
        };
      }
      function restoreView(view) {
        restoreDrafts(view.drafts);
        const screen = $("screen");
        if (screen) { screen.scrollTop = view.screen; }
        const level = $("level-host");
        if (level) { level.scrollTop = view.level; }
        const cast = $("surface-remote");
        if (cast) { cast.scrollTop = view.cast; }
        const panel = document.querySelector("#sheet .sheet-panel");
        if (panel) { panel.scrollTop = view.sheet; }
        if (state.focusTarget) {
          applyFocusTarget();
        } else if (view.focus) {
          focusByKey(view.focus);
        }
      }
      function applyFocusTarget() {
        const target = state.focusTarget;
        state.focusTarget = null;
        if (!target) { return; }
        if (target === "level") { focusFirst("#level-host"); return; }
        if (target === "sheet") { focusFirst("#sheet"); return; }
        if (target === "cast") { focusFirst("#surface-remote"); return; }
        if (target === "screen") { focusFirst("#screen"); return; }
        if (target.key) { focusByKey(target.key); }
      }

      /** The whole app, drawn from nothing: a connect, or a local change. */
      function paint() {
        if (!state.device) { showPairing(); return; }
        showApp();
        const view = captureView();
        renderConnection();
        renderNav();
        renderScreen();
        renderLevel();
        renderMini();
        renderCast();
        renderSheet();
        renderError();
        restoreView(view);
      }

      /** What a Snapshot moved, redrawn without disturbing what a person is typing. */
      function refresh() {
        if (!state.device || !state.snapshot) { return; }
        const s = state.snapshot;
        const keys = declaredCatalogs(s).map(catalogKey).join("|");
        if (keys !== state.catalogueKeys) {
          state.catalogueKeys = keys;
          void loadHome();
        }
        const keyed = s.protection.tmdbHeld;
        if (keyed !== state.tmdbHeld) {
          state.tmdbHeld = keyed;
          resetDiscover();
          resetSearch();
          if (keyed && state.destination === "discover") { void loadDiscover(true); }
        }

        const view = captureView();
        renderConnection();
        if (screenSignature() !== state.screenSignature) { renderScreen(); }
        if (levelSignature() !== state.levelSignature) { renderLevel(); }
        if (miniSignature() !== state.miniSignature) { renderMini(); }
        if (state.cast) {
          if (!watching(playback().state)) {
            state.cast = false;
            state.morePanel = null;
            state.volumeOpen = false;
            state.sheet = false;
            renderCast();
          } else if (castSignature() !== state.castSignature) {
            renderCast();
          } else {
            updateCastLive();
          }
        }
        renderSheet();
        renderError();
        restoreView(view);
      }

      // ---------------------------------------------------------------------
      // The browse flows: what a person asked, and what answered.
      // ---------------------------------------------------------------------
      async function ask(action) {
        try {
          return { response: await dispatch(action), error: null };
        } catch (error) {
          return { response: null, error };
        }
      }
      async function take(action) {
        state.error = null;
        try {
          return await dispatch(action);
        } catch (error) {
          state.error = error;
          renderError();
          return null;
        }
      }

      function chooseDestination(destination) {
        state.destination = destination;
        state.levels = [];
        stopHero();
        if (destination === "discover") {
          if (state.snapshot && state.snapshot.protection.tmdbHeld &&
              state.discover.feed.page === 0 && !state.discover.loading) {
            void loadDiscover(true);
          }
        }
        paint();
      }

      // --- Home -------------------------------------------------------------
      async function loadRow(row, extra) {
        const { response, error } = await ask({
          type: "browse_catalog",
          addon: row.addon,
          catalog: { type: row.type, id: row.id },
          extra,
        });
        if (error) {
          return unaskable(error) ? null : Object.assign({}, row, { failure: error });
        }
        const answer = answeredCatalogs(response)[0];
        return answer ? rowWith(row, answer) : null;
      }

      async function loadHome() {
        const generation = (state.home.generation += 1);
        const catalogs = declaredCatalogs(state.snapshot);
        state.home.rows = catalogs.map(blankRow);
        state.home.loading = catalogs.length > 0;
        state.screenSignature = null;
        if (state.destination === "home") { renderScreen(); }
        if (catalogs.length === 0) { return; }

        const featured = state.snapshot.featuredCatalog;
        const featuredKey = featured
          ? featured.addon + "/" + featured.catalog.type + "/" + featured.catalog.id : null;
        const ordered = catalogs.slice().sort((left, right) =>
          catalogKey(left) === featuredKey ? -1 : catalogKey(right) === featuredKey ? 1 : 0);

        for (const catalog of ordered) {
          const key = catalogKey(catalog);
          const first = await loadRow(blankRow(catalog), []);
          if (generation !== state.home.generation) { return; }
          if (first) {
            state.home.rows = state.home.rows.map((held) => keyOf(held) === key ? first : held);
          } else {
            state.home.rows = state.home.rows.filter((held) => keyOf(held) !== key);
          }
          state.screenSignature = null;
          if (state.destination === "home") { renderScreen(); }
        }
        state.home.loading = false;
        state.screenSignature = null;
        if (state.destination === "home") { renderScreen(); }
      }

      async function pageRow(key) {
        const row = rowIndex.get(key);
        if (!row) { return; }
        const paged = await loadRow(row, [{ name: SKIP, value: String(row.offset) }]);
        if (state.destination !== "home") { return; }
        if (paged) {
          state.home.rows = state.home.rows.map((held) => keyOf(held) === key ? paged : held);
        }
        state.screenSignature = null;
        renderScreen();
      }

      function scheduleHero() {
        if (state.destination !== "home") { stopHero(); return; }
        const featured = featuredRow(state.snapshot, state.home.rows);
        const slides = featured ? heroSlides(featured.metas) : [];
        if (slides.length < 2 ||
            (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) {
          stopHero();
          return;
        }
        if (state.heroTimer) { return; }
        state.heroTimer = setInterval(() => {
          if (state.destination !== "home" || state.levels.length > 0 || state.cast ||
              state.sheet || state.heroHeld) { return; }
          const active = document.activeElement;
          if (active && active !== document.body && $("screen").contains(active)) { return; }
          const current = featuredRow(state.snapshot, state.home.rows);
          const currentSlides = current ? heroSlides(current.metas) : [];
          if (currentSlides.length < 2) { return; }
          state.heroIndex = (state.heroIndex + 1) % currentSlides.length;
          state.screenSignature = null;
          renderScreen();
        }, 6000);
      }

      function stopHero() {
        if (state.heroTimer) {
          clearInterval(state.heroTimer);
          state.heroTimer = null;
        }
      }

      // --- Discover ---------------------------------------------------------
      function resetDiscover() {
        state.discover.generation += 1;
        state.discover.feed = blankFeed();
        state.discover.loading = false;
        state.discover.kind = MOVIE;
        state.discover.genre = null;
      }

      async function loadDiscover(reset) {
        if (!state.snapshot || !state.snapshot.protection.tmdbHeld) { return; }
        const discover = state.discover;
        const generation = (discover.generation += 1);
        if (reset) { discover.feed = blankFeed(); }
        discover.loading = true;
        state.screenSignature = null;
        if (state.destination === "discover") { renderScreen(); }

        const page = reset ? 1 : discover.feed.page + 1;
        const { response, error } = await ask(discoverAsk({ kind: discover.kind, page, genre: discover.genre }));
        if (generation !== discover.generation) { return; }
        discover.loading = false;
        if (error) {
          discover.feed.failure = error;
        } else {
          const answer = answeredDiscover(response)[0];
          discover.feed = answer ? feedWith(discover.feed, answer) : { ...discover.feed, done: true };
        }
        state.screenSignature = null;
        if (state.destination === "discover") { renderScreen(); }
      }

      // --- Search -----------------------------------------------------------
      function resetSearch() {
        state.search.generation += 1;
        state.search.committed = null;
        state.search.movie = blankFeed();
        state.search.series = blankFeed();
        state.search.paging = [];
        state.search.catalog = { rows: null, loading: false, failure: null };
      }

      async function loadSearchRow(query, kind, page) {
        const generation = state.search.generation;
        state.search.paging = state.search.paging.concat([kind]);
        state.screenSignature = null;
        if (state.destination === "search") { renderScreen(); }

        const { response, error } = await ask({
          type: "search", query, kind, page,
        });
        if (generation !== state.search.generation) { return; }
        state.search.paging = state.search.paging.filter((held) => held !== kind);
        const answer = error ? null : answeredSearch(response);
        state.search[kind] = error
          ? { ...state.search[kind], failure: error }
          : answer ? feedWith(state.search[kind], answer)
          : { ...state.search[kind], done: true };
        state.screenSignature = null;
        if (state.destination === "search") { renderScreen(); }
      }

      async function loadSearchCatalogs(query) {
        const generation = state.search.generation;
        state.search.catalog = { rows: null, loading: true, failure: null };
        state.screenSignature = null;
        if (state.destination === "search") { renderScreen(); }

        const { response, error } = await ask({ type: "search_catalogs", query });
        if (generation !== state.search.generation) { return; }
        state.search.catalog = {
          rows: error ? null : answeredCatalogs(response),
          loading: false,
          failure: error,
        };
        state.screenSignature = null;
        if (state.destination === "search") { renderScreen(); }
      }

      function submitSearch() {
        const query = state.search.draft.trim();
        if (!query) { return; }
        resetSearch();
        state.search.committed = query;
        state.screenSignature = null;
        renderScreen();
        if (state.snapshot && state.snapshot.protection.tmdbHeld) {
          for (const { kind } of SEARCH_KINDS) {
            void loadSearchRow(query, kind, 1);
          }
        } else {
          void loadSearchCatalogs(query);
        }
      }

      // --- Titles, Streams and the level stack ------------------------------
      function pushLevel(level) {
        const active = document.activeElement;
        if (level.returnFocus === undefined && active) { level.returnFocus = focusKey(active); }
        state.levels.push(level);
        state.focusTarget = "level";
        paint();
        return level;
      }
      function popLevel() {
        const level = state.levels.pop();
        state.focusTarget = state.levels.length > 0
          ? "level"
          : level && level.returnFocus ? { key: level.returnFocus } : "screen";
        paint();
      }

      async function openTitleFrom(addon, preview) {
        const level = pushLevel({
          kind: "title", loading: true, preview, title: null, shownSeason: null, selected: null, failure: null,
        });
        const { response, error } = await ask({
          type: "open_title", addon, title: { type: preview.type, id: preview.id },
        });
        if (!state.levels.includes(level)) { return; }
        if (error) {
          state.levels = state.levels.filter((held) => held !== level);
          state.error = error;
          state.focusTarget = level.returnFocus ? { key: level.returnFocus } : "screen";
          paint();
          return;
        }
        const title = answeredTitle(response);
        if (!title) {
          state.levels = state.levels.filter((held) => held !== level);
          state.focusTarget = level.returnFocus ? { key: level.returnFocus } : "screen";
          paint();
          return;
        }
        level.loading = false;
        level.title = title;
        level.shownSeason = seasonsOf(title)[0] ? seasonsOf(title)[0].season : null;
        renderLevel();
      }

      async function openDiscovered(preview) {
        const key = discoveredKeyOf(preview.id);
        if (!key) {
          state.error = { kind: "not_discovered_title", detail: "it has no tmdb: id" };
          renderError();
          return;
        }
        const level = pushLevel({
          kind: "title", loading: true, preview, title: null, shownSeason: null, selected: null, failure: null,
        });
        const { response, error } = await ask({
          type: "open_discovered_title", key, kind: preview.type,
        });
        if (!state.levels.includes(level)) { return; }
        if (error) {
          state.levels = state.levels.filter((held) => held !== level);
          state.error = error;
          state.focusTarget = level.returnFocus ? { key: level.returnFocus } : "screen";
          paint();
          return;
        }
        const title = answeredTitle(response);
        if (!title) {
          state.levels = state.levels.filter((held) => held !== level);
          state.focusTarget = level.returnFocus ? { key: level.returnFocus } : "screen";
          paint();
          return;
        }
        level.loading = false;
        level.title = title;
        level.shownSeason = seasonsOf(title)[0] ? seasonsOf(title)[0].season : null;
        renderLevel();
      }

      function pushStreams(level, video) {
        level.selected = video;
        renderLevel();
        pushLevel({
          kind: "streams", loading: true, title: level.title, preview: level.preview,
          video, groups: null, failure: null, chosen: null,
        });
        void findStreams();
      }

      async function findStreams() {
        const level = state.levels[state.levels.length - 1];
        if (!level || level.kind !== "streams") { return; }
        const { response, error } = await ask({
          type: "find_streams", video: { type: level.title.type, id: level.video.id },
        });
        if (!state.levels.includes(level)) { return; }
        level.loading = false;
        if (error) {
          level.failure = error;
        } else {
          const groups = answeredStreams(response);
          if (groups.some((group) => group.streams.length > 0)) {
            state.unplayable.delete(level.title.id);
          } else if (groups.every((group) => group.failure === null)) {
            state.unplayable.add(level.title.id);
          }
          level.groups = groups;
        }
        renderLevel();
      }

      async function chooseStream(addon, stream, level) {
        if (playabilityNote(stream.playback) !== null) {
          level.chosen = stream;
          renderLevel();
          return;
        }
        level.chosen = null;
        const response = await take({
          type: "play_stream",
          video: { type: level.title.type, id: level.video.id },
          addon,
          stream,
          title: titleStubOf(level.title, level.preview),
        });
        if (response) {
          state.levels = [];
          state.cast = false;
          state.focusTarget = "screen";
          paint();
        }
      }

      // --- the playing series' Episodes, on demand --------------------------
      function seriesRefOf(nowPlaying) {
        const video = nowPlaying.video;
        const tmdb = video.id.match(/^tmdb:(\d+):\d+:\d+$/);
        if (tmdb) {
          return {
            kind: "discovered",
            key: { kind: "tmdb", id: Number(tmdb[1]) },
            type: video.type,
            cache: "tmdb|" + video.type + "|" + tmdb[1],
            name: null,
          };
        }
        const addonEpisode = video.id.match(/^(.+):\d+:\d+$/);
        const id = addonEpisode ? addonEpisode[1] : video.id;
        return {
          kind: "addon",
          addon: nowPlaying.addon,
          title: { type: video.type, id },
          cache: nowPlaying.addon + "|" + video.type + "|" + id,
          name: null,
        };
      }

      function openEpisodes() {
        const p = playback();
        if (!p || !p.nowPlaying || p.episode === null) { return; }
        const series = seriesRefOf(p.nowPlaying);
        const cached = state.seriesCache.get(series.cache) || null;
        const level = pushLevel({
          kind: "episodes", loading: !cached, title: cached,
          shownSeason: p.episode ? p.episode.season : null,
          failure: null, loadingStreams: false, preview: null, series,
        });
        if (cached) {
          level.shownSeason = seasonsOf(cached).some((season) => season.season === level.shownSeason)
            ? level.shownSeason
            : seasonsOf(cached)[0] ? seasonsOf(cached)[0].season : null;
          renderLevel();
        } else {
          void loadEpisodes(level, series);
        }
      }

      async function loadEpisodes(level, series) {
        const action = series.kind === "discovered"
          ? { type: "open_discovered_title", key: series.key, kind: series.type }
          : { type: "open_title", addon: series.addon, title: series.title };
        const { response, error } = await ask(action);
        if (!state.levels.includes(level)) { return; }
        level.loading = false;
        if (error) {
          level.failure = error;
          renderLevel();
          return;
        }
        const title = answeredTitle(response);
        if (!title) {
          level.failure = { kind: "unknown_title", addon: series.addon || "TMDB", detail: "no episodes were listed" };
          renderLevel();
          return;
        }
        state.seriesCache.set(series.cache, title);
        level.title = title;
        const seasons = seasonsOf(title);
        level.shownSeason = seasons.some((season) => season.season === level.shownSeason)
          ? level.shownSeason
          : seasons[0] ? seasons[0].season : null;
        renderLevel();
      }

      async function playEpisode(video, level) {
        if (!level.title) { return; }
        level.loadingStreams = true;
        level.failure = null;
        renderLevel();
        const { response, error } = await ask({
          type: "find_streams", video: { type: level.title.type, id: video.id },
        });
        if (!state.levels.includes(level)) { return; }
        if (error) {
          level.loadingStreams = false;
          level.failure = error;
          renderLevel();
          return;
        }
        const groups = answeredStreams(response);
        let picked = null;
        for (const group of groups) {
          const stream = group.streams.find((candidate) => playabilityNote(candidate.playback) === null);
          if (stream) { picked = { addon: group.addon, stream }; break; }
        }
        if (!picked) {
          level.loadingStreams = false;
          level.failure = {
            kind: "unplayable",
            detail: "no Addon offered a Stream this Host can play",
          };
          renderLevel();
          return;
        }
        const response2 = await take({
          type: "play_stream",
          video: { type: level.title.type, id: video.id },
          addon: picked.addon,
          stream: picked.stream,
          title: titleStubOf(level.title, level.preview),
        });
        if (response2) {
          state.levels = [];
          state.cast = true;
          state.morePanel = null;
          state.focusTarget = "cast";
          paint();
        } else {
          level.loadingStreams = false;
          level.failure = state.error;
          renderLevel();
        }
      }

      // ---------------------------------------------------------------------
      // Confirms, settings and the rest of the Action surface.
      // ---------------------------------------------------------------------
      function pushConfirm(options) {
        pushLevel({
          kind: "confirm",
          id: options.id,
          title: options.title,
          body: options.body,
          confirmLabel: options.confirmLabel,
          action: options.action,
          onConfirmed: options.onConfirmed || null,
          failure: null,
        });
      }

      async function confirmLevel(level) {
        const response = await take(level.action);
        if (!response) {
          if (state.levels.includes(level)) {
            level.failure = state.error;
            renderLevel();
          }
          return;
        }
        const index = state.levels.indexOf(level);
        if (index >= 0) { state.levels = state.levels.slice(0, index); }
        if (level.onConfirmed) { level.onConfirmed(); }
        state.focusTarget = state.levels.length > 0 ? "level" : "screen";
        paint();
      }

      function chooseLanguage(tag) {
        if (tag === "host") {
          void take({ type: "clear_subtitle_language" });
        } else {
          void take({ type: "set_subtitle_language", language: tag });
        }
      }

      function chooseFeatured(ref) {
        if (ref === "none") {
          void take({ type: "clear_featured_catalog" });
          return;
        }
        const declared = declaredCatalogs(state.snapshot).find((choice) => catalogKey(choice) === ref);
        if (!declared) { return; }
        void take({
          type: "set_featured_catalog",
          addon: declared.addon,
          catalog: { type: declared.catalog.type, id: declared.catalog.id },
        });
      }

      // ---------------------------------------------------------------------
      // Taking Actions from controls.
      // ---------------------------------------------------------------------
      async function act(name, data) {
        switch (name) {
          case "destination": {
            chooseDestination(data.destination);
            return;
          }
          case "credentials": {
            pushLevel({ kind: "settings", category: "credentials", failure: null });
            return;
          }
          case "settings-category": {
            pushLevel({ kind: "settings", category: data.category, failure: null });
            return;
          }
          case "pop-level": { popLevel(); return; }
          case "confirm": {
            const level = state.levels[state.levels.length - 1];
            if (level && level.kind === "confirm") { await confirmLevel(level); }
            return;
          }
          case "hero-slide": {
            state.heroIndex = Number(data.slide);
            state.screenSignature = null;
            renderScreen();
            return;
          }
          case "open-featured": {
            const rows = state.home.rows;
            const featured = featuredRow(state.snapshot, rows);
            if (!featured) { return; }
            const heroMeta = metaIndex.get(data.ref);
            if (!heroMeta) { return; }
            await openTitleFrom(featured.addon, heroMeta);
            return;
          }
          case "open-card": {
            const meta = metaIndex.get(data.ref);
            if (!meta) { return; }
            if (data.source === "tmdb") { await openDiscovered(meta); }
            else { await openTitleFrom(data.addon, meta); }
            return;
          }
          case "resume": {
            const entry = entryIndex.get(data.ref);
            if (!entry) { return; }
            await take({ type: "resume", video: { type: entry.title.type, id: entry.video.id } });
            return;
          }
          case "page-row": { await pageRow(data.ref); return; }

          case "discover-kind": {
            if (state.discover.kind === data.kind) { return; }
            state.discover.kind = data.kind;
            state.discover.genre = null;
            await loadDiscover(true);
            return;
          }
          case "discover-genre": {
            const genre = data.genre === "all" ? null : Number(data.genre);
            if (state.discover.genre === genre) { return; }
            state.discover.genre = genre;
            await loadDiscover(true);
            return;
          }
          case "discover-more": { await loadDiscover(false); return; }

          case "search-more": {
            if (!state.search.committed) { return; }
            const feed = state.search[data.kind];
            await loadSearchRow(state.search.committed, data.kind, feed.page + 1);
            return;
          }

          case "addon-toggle": {
            state.addons.expanded = state.addons.expanded === data.id ? null : data.id;
            state.screenSignature = null;
            renderScreen();
            return;
          }
          case "addon-move": {
            const addon = state.snapshot.addons.find((held) => held.id === data.id);
            const index = state.snapshot.addons.indexOf(addon);
            const position = moveTarget(index, Number(data.delta), state.snapshot.addons.length);
            if (position !== null) {
              await take({ type: "reorder_addon", id: data.id, position });
            }
            return;
          }
          case "addon-remove": {
            const addon = state.snapshot.addons.find((held) => held.id === data.id);
            if (!addon) { return; }
            pushConfirm({
              id: "confirm-remove-" + addon.id,
              title: "Remove " + addon.name + "?",
              body: "The Host stops asking this Addon for Catalogs, Meta previews and Streams. " +
                (addon.catalogs.length > 0
                  ? "Its rows leave Home, and anything it was the Featured catalog for stops being featured. "
                  : "") +
                "Watch progress already recorded stays in Continue watching.",
              confirmLabel: "Remove",
              action: { type: "remove_addon", id: addon.id },
            });
            return;
          }

          case "clear-tmdb": {
            pushConfirm({
              id: "confirm-clear-tmdb",
              title: "Clear the TMDB key?",
              body: "The Host stops asking TMDB until a key is saved again. Discover and keyed Search say so instead of answering.",
              confirmLabel: "Clear key",
              action: { type: "clear_tmdb_key" },
            });
            return;
          }
          case "sign-out-stremio": {
            pushConfirm({
              id: "confirm-sign-out-stremio",
              title: "Sign out of Stremio?",
              body: "The Host stops syncing Watch progress with this account. Progress already merged stays recorded.",
              confirmLabel: "Sign out",
              action: { type: "sign_out_stremio" },
            });
            return;
          }
          case "revoke": {
            const device = state.snapshot.devices.find((held) => held.id === data.id);
            if (!device) { return; }
            pushConfirm({
              id: "confirm-revoke-" + device.id,
              title: "Revoke " + device.name + "?",
              body: "The device's token stops working immediately. Every other paired device keeps working.",
              confirmLabel: "Revoke",
              action: { type: "revoke_device", id: device.id },
            });
            return;
          }

          case "language": { chooseLanguage(data.tag); return; }
          case "featured": { chooseFeatured(data.ref); return; }

          case "title-season": {
            const level = state.levels[state.levels.length - 1];
            if (level && level.kind === "title") {
              level.shownSeason = data.season === "none" ? null : Number(data.season);
              renderLevel();
            }
            return;
          }
          case "title-episode": {
            const level = state.levels[state.levels.length - 1];
            const video = videoIndex.get(data.id);
            if (level && level.kind === "title" && video) { pushStreams(level, video); }
            return;
          }
          case "title-play-film": {
            const level = state.levels[state.levels.length - 1];
            if (level && level.kind === "title") { pushStreams(level, theFilm(level.title)); }
            return;
          }
          case "choose-stream": {
            const level = state.levels[state.levels.length - 1];
            const group = groupIndex.get(data.addon);
            const stream = group && group.streams[Number(data.index)];
            if (level && level.kind === "streams" && stream) {
              await chooseStream(data.addon, stream, level);
            }
            return;
          }

          case "episode-season": {
            const level = state.levels[state.levels.length - 1];
            if (level && level.kind === "episodes") {
              level.shownSeason = data.season === "none" ? null : Number(data.season);
              renderLevel();
            }
            return;
          }
          case "episode-play": {
            const level = state.levels[state.levels.length - 1];
            const video = videoIndex.get(data.id);
            if (level && level.kind === "episodes" && video) { await playEpisode(video, level); }
            return;
          }

          case "expand-cast": {
            state.castReturn = focusKey(document.activeElement);
            state.cast = true;
            state.morePanel = null;
            state.volumeOpen = false;
            state.focusTarget = "cast";
            paint();
            return;
          }
          case "collapse-cast": {
            state.cast = false;
            state.morePanel = null;
            state.volumeOpen = false;
            state.focusTarget = state.castReturn ? { key: state.castReturn } : { key: "mini-center" };
            paint();
            return;
          }
          case "open-sheet": {
            state.sheetReturn = focusKey(document.activeElement);
            state.sheet = true;
            state.focusTarget = "sheet";
            paint();
            return;
          }
          case "close-sheet": {
            state.sheet = false;
            state.focusTarget = state.sheetReturn ? { key: state.sheetReturn } : "cast";
            paint();
            return;
          }
          case "volume-toggle": {
            state.volumeOpen = !state.volumeOpen;
            renderCast();
            return;
          }
          case "episodes-open": { openEpisodes(); return; }
          case "more-panel": {
            state.morePanel = state.morePanel === data.panel ? null : data.panel;
            renderCast();
            return;
          }

          case "pause-toggle": {
            const p = playback();
            if (!p || !transportable(p.state)) { return; }
            await take({ type: "set_paused", paused: p.state === "playing" });
            return;
          }
          case "seek-by": {
            await take({ type: "seek", target: { kind: "by", seconds: Number(data.seconds) } });
            return;
          }
          case "stop": { await take({ type: "stop_playback" }); return; }
          case "previous-episode": { await take({ type: "previous_episode" }); return; }
          case "next-episode": { await take({ type: "next_episode" }); return; }
          case "mute-toggle": {
            const p = playback();
            if (!p) { return; }
            await take({ type: "set_muted", muted: !p.muted });
            return;
          }
          case "track": {
            if (data.kind === "off") {
              await take({ type: "set_subtitle_track", track: null });
            } else if (data.kind === "audio") {
              await take({ type: "set_audio_track", track: Number(data.id) });
            } else {
              await take({ type: "set_subtitle_track", track: Number(data.id) });
            }
            return;
          }
          case "delay": {
            await take({ type: "set_subtitle_delay", seconds: Number(data.seconds) });
            return;
          }
          case "speed": {
            await take({ type: "set_speed", rate: Number(data.rate) });
            return;
          }
          case "chapter-prev": { await take({ type: "previous_chapter" }); return; }
          case "chapter-next": { await take({ type: "next_chapter" }); return; }
          case "chapter": { await take({ type: "set_chapter", index: Number(data.index) }); return; }
          case "aspect": {
            const aspect = aspectIndex.get(data.ref);
            if (aspect) { await take({ type: "set_aspect", aspect }); }
            return;
          }
          case "crop": {
            const crop = cropIndex.get(data.ref);
            if (crop) { await take({ type: "set_crop", crop }); }
            return;
          }
          case "stats-toggle": {
            state.showStatistics = !state.showStatistics;
            renderCast();
            return;
          }
          default: return;
        }
      }

      // ---------------------------------------------------------------------
      // Events
      // ---------------------------------------------------------------------
      document.addEventListener("click", (event) => {
        const node = event.target.closest("[data-a]");
        if (!node) { return; }
        event.preventDefault();
        void act(node.dataset.a, node.dataset);
      });

      document.addEventListener("change", (event) => {
        const target = event.target;
        if (target.matches("[data-seek]")) {
          void take({ type: "seek", target: { kind: "to", seconds: Number(target.value) } });
        } else if (target.matches("[data-volume]")) {
          const levelNode = document.querySelector("[data-volume-level]");
          if (levelNode) { levelNode.textContent = formatVolume(Number(target.value)); }
          void take({ type: "set_volume", level: Number(target.value) });
        }
      });

      document.addEventListener("input", (event) => {
        const target = event.target;
        if (target.id === "search-input") {
          state.search.draft = target.value;
          const submit = document.querySelector('[data-focus-key="search-submit"]');
          if (submit) { submit.disabled = target.value.trim().length === 0; }
        }
      });

      document.addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.target;
        if (form.id === "pair-form") {
          void pair();
        } else if (form.id === "search-form") {
          submitSearch();
        } else if (form.id === "addon-form") {
          const url = ($("manifest-url").value || "").trim();
          if (!url) { return; }
          const before = state.snapshot.addons.slice();
          void take({ type: "add_addon", url }).then((taken) => {
            if (taken) {
              const after = taken.snapshots.length > 0
                ? taken.snapshots[taken.snapshots.length - 1].addons : null;
              state.addons.status = addOutcome(before, after);
              const field = $("manifest-url");
              if (field) { field.value = ""; }
              state.screenSignature = null;
              renderScreen();
            }
          });
        } else if (form.id === "tmdb-form") {
          const key = ($("tmdb-key").value || "").trim();
          if (!key) { return; }
          void take({ type: "set_tmdb_key", key }).then((taken) => {
            if (taken) {
              const field = $("tmdb-key");
              if (field) { field.value = ""; }
            }
          });
        } else if (form.id === "credentials-stremio-form" || form.id === "library-stremio-form") {
          const prefix = form.id === "credentials-stremio-form" ? "credentials" : "library";
          const email = ($(prefix + "-stremio-email").value || "").trim();
          const password = $(prefix + "-stremio-password").value || "";
          void take({ type: "sign_in_stremio", email, password }).then((taken) => {
            if (taken) {
              const emailField = $(prefix + "-stremio-email");
              const passwordField = $(prefix + "-stremio-password");
              if (emailField) { emailField.value = ""; }
              if (passwordField) { passwordField.value = ""; }
            }
          });
        }
      });

      document.addEventListener("focusin", (event) => {
        const target = event.target;
        if (target && target.dataset && target.dataset.focusKey === "home-hero") {
          state.heroHeld = true;
        }
      });
      document.addEventListener("focusout", (event) => {
        const target = event.target;
        if (target && target.dataset && target.dataset.focusKey === "home-hero") {
          state.heroHeld = false;
        }
      });

      document.addEventListener("keydown", (event) => {
        const intent = keyIntent(event.key, isTypingTarget(event.target));
        if (!intent) { return; }
        if (intent === "back") {
          event.preventDefault();
          goBack();
          return;
        }
        if (intent === "up" || intent === "down" || intent === "left" || intent === "right") {
          if (moveFocus(activeScope(), intent)) { event.preventDefault(); }
          return;
        }
        // `activate` is the control's own native activation (Enter/Space).
      });

      function goBack() {
        if (state.sheet) {
          state.sheet = false;
          state.focusTarget = state.sheetReturn ? { key: state.sheetReturn } : "cast";
          paint();
          return;
        }
        if (state.levels.length > 0) {
          popLevel();
          return;
        }
        if (state.cast) {
          state.cast = false;
          state.morePanel = null;
          state.volumeOpen = false;
          state.focusTarget = state.castReturn ? { key: state.castReturn } : { key: "mini-center" };
          paint();
          return;
        }
        if (state.destination !== "home") {
          state.focusTarget = { key: "nav-home" };
          chooseDestination("home");
        }
      }

      // --- the pairing and the conversation ---------------------------------
      async function pair() {
        const code = ($("code").value || "").trim();
        const name = ($("name").value || "").trim() || "Device";
        $("pair-error").textContent = "";
        const { response, error } = await ask({ type: "pair_device", code, name });
        if (error) {
          $("pair-error").textContent = explain(error);
          return;
        }
        if (response && response.answer && response.answer.paired) {
          adopt(response.answer.paired.device, response.answer.paired.token);
          paint();
        }
      }

      function adopt(device, token) {
        state.device = device;
        state.token = token;
        try { window.localStorage.setItem(TOKEN_KEY, token); } catch (e) { /* private mode */ }
      }

      function onFrame(event) {
        if (event.open) {
          state.online = true;
          net.send({ version: VERSION, hello: { token: state.token } });
          renderConnection();
          return;
        }
        if (event.close) {
          state.online = false;
          renderConnection();
          setTimeout(connect, 1000);
          return;
        }
        const frame = event.frame;
        if (frame.version !== VERSION) {
          showPairing("This page speaks version " + VERSION + " and the Host " + frame.version + ".");
          return;
        }
        if (frame.welcome) {
          const device = frame.welcome.device;
          if (device) {
            state.device = device;
            try { window.localStorage.setItem(TOKEN_KEY, state.token); } catch (e) { /* private mode */ }
            paint();
          } else {
            state.device = null;
            showPairing();
          }
          return;
        }
        if (frame.snapshot) {
          const snapshot = frame.snapshot;
          if (!state.snapshot || state.snapshot.revision <= snapshot.revision) {
            state.snapshot = snapshot;
            refresh();
          }
          return;
        }
        if (frame.response) {
          const pending = net.pending.get(frame.id);
          if (pending) { net.pending.delete(frame.id); pending.resolve(frame.response); }
          return;
        }
        if (frame.error) {
          const pending = net.pending.get(frame.id);
          if (pending) {
            net.pending.delete(frame.id);
            pending.reject(frame.error);
            return;
          }
          if (frame.error.kind === "unpaired") {
            state.device = null;
            showPairing("This device is not paired any more.");
          } else if (frame.error.kind === "unsupported_version") {
            showPairing("This page speaks version " + VERSION + " and the Host " + frame.error.supported + ".");
          }
        }
      }

      function connect() { net.connect(onFrame); }

      // A device with no token yet is looking at the pairing form, whatever the
      // Host is about to say; one with a token waits for the welcome, which is
      // what decides whether the token still names a device.
      if (!state.token) { showPairing(); }
      connect();
    </script>
  </body>
</html>
