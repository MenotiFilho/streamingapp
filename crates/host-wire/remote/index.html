<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>streamingapp — Cast Remote</title>
    <style>
      /*
       * The window's palette, spliced in at serve time (#88). `src/tokens.css`
       * is the only palette in the tree; this page keeps no copy of it.
       */
      /*__SPLICE_TOKENS__*/

      /* ------------------------------------------------------------------
       * The Cast Remote: phone-first structure, three surfaces, one page.
       * Every colour comes from the tokens above.
       * ------------------------------------------------------------------ */

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(80rem 40rem at 50% -12rem, var(--accent-soft), transparent 60%),
          var(--bg-canvas);
        color: var(--ink-primary);
        font-family: var(--font-sans);
        font-size: var(--text-body);
        line-height: 1.45;
        -webkit-tap-highlight-color: transparent;
      }
      button, input { font: inherit; }
      button { color: inherit; }
      a { color: var(--accent); }
      .hidden { display: none !important; }
      .dim { color: var(--ink-secondary); }
      .muted { color: var(--ink-muted); }
      .tabular { font-variant-numeric: var(--numeric-figures); }
      .visually-hidden {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
        white-space: nowrap;
      }

      /* Focus is the cursor: the same dual ring the window uses. */
      [data-focusable] {
        position: relative;
        transition:
          transform var(--dur-med) var(--ease-out),
          box-shadow var(--dur-fast) var(--ease-out),
          background-color var(--dur-fast) var(--ease-out),
          border-color var(--dur-fast) var(--ease-out),
          color var(--dur-fast) var(--ease-out);
      }
      [data-focusable]:focus, [data-focusable]:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
        z-index: 5;
      }
      .lift[data-focusable]:focus, .lift[data-focusable]:focus-visible {
        transform: var(--focus-transform);
      }

      /* --- buttons, chips and fields ----------------------------------- */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
        padding: 0.65rem 0.95rem;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--bg-raised);
        color: var(--ink-primary);
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary { border-color: transparent; background: var(--accent); color: var(--ink-on-accent); }
      .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-secondary); }
      .btn-danger { border-color: var(--status-danger); background: var(--status-danger-bg); color: var(--status-danger); }
      .btn:disabled { opacity: 0.42; cursor: not-allowed; }
      .btn-icon { width: 2.75rem; height: 2.75rem; padding: 0; border-radius: var(--radius-pill); }
      .btn-round { width: 3.25rem; height: 3.25rem; padding: 0; border-radius: var(--radius-pill); }
      .chip {
        display: inline-flex; align-items: center; gap: 0.35rem;
        padding: 0.35rem 0.7rem;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-pill);
        background: var(--bg-raised);
        color: var(--ink-secondary);
        font-size: var(--text-caption);
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
      }
      .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink-primary); }
      .chip:disabled { opacity: 0.45; cursor: not-allowed; }
      .chip-row { display: flex; gap: 0.45rem; overflow-x: auto; padding: 0.25rem 0 0.5rem; scrollbar-width: none; }
      .chip-row::-webkit-scrollbar { display: none; }
      .form-field { display: grid; gap: 0.35rem; margin: 0 0 0.8rem; }
      .form-field label { color: var(--ink-secondary); font-size: var(--text-caption); font-weight: 600; }
      input:not([type="range"]) {
        width: 100%;
        padding: 0.75rem 0.85rem;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-control);
        background: var(--bg-stage);
        color: var(--ink-primary);
      }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
      .note { margin: 0.5rem 0; color: var(--ink-muted); font-size: var(--text-caption); }
      .error { color: var(--status-danger); white-space: pre-wrap; }
      .status { color: var(--status-ok); font-size: var(--text-caption); }

      /* --- pairing ------------------------------------------------------ */
      .pairing {
        display: grid; place-items: center; min-height: 100dvh; padding: 1.25rem;
      }
      .pairing-card {
        width: 100%; max-width: 26rem;
        padding: 1.4rem;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-panel);
        background: var(--bg-glass);
        box-shadow: var(--shadow-panel);
        backdrop-filter: blur(18px);
      }
      .pairing-card h1 {
        margin: 0 0 0.5rem;
        font-family: var(--font-display);
        font-size: var(--text-title);
        letter-spacing: var(--display-tracking);
      }

      /* --- the browse surface ------------------------------------------ */
      .app { position: fixed; inset: 0; }
      .surface-browse {
        position: absolute; inset: 0;
        width: 100%; max-width: 48rem; margin: 0 auto;
      }
      .topbar {
        position: absolute; top: 0; left: 0; right: 0; z-index: 10;
        display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
        height: 3.5rem; padding: 0 1rem;
        background: var(--bg-glass);
        border-bottom: 1px solid var(--border-subtle);
        backdrop-filter: blur(18px);
      }
      .brand {
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: var(--display-weight);
        letter-spacing: var(--display-tracking);
      }
      .connection {
        display: inline-flex; align-items: center; gap: 0.35rem;
        color: var(--ink-secondary); font-size: var(--text-micro); font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.08em;
      }
      .connection::before {
        content: ""; width: 0.45rem; height: 0.45rem; border-radius: 50%;
        background: var(--status-ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--status-ok) 20%, transparent);
      }
      .connection[data-live="false"]::before { background: var(--status-warn); box-shadow: none; }
      .screen {
        position: absolute; top: 3.5rem; bottom: 4.5rem; left: 0; right: 0;
        overflow-y: auto; overscroll-behavior: contain;
        padding: 0.75rem 1rem 6.5rem;
      }
      .screen-title {
        margin: 0.5rem 0 0.35rem;
        font-family: var(--font-display);
        font-size: var(--text-hero);
        font-weight: var(--display-weight);
        letter-spacing: var(--display-tracking);
        line-height: 1.02;
      }
      .lede { margin: 0 0 1rem; max-width: 60ch; color: var(--ink-secondary); font-size: var(--text-caption); line-height: 1.55; }
      .section-head { display: flex; align-items: baseline; gap: 0.5rem; margin: 1.4rem 0 0.5rem; }
      .section-head h2 { margin: 0; font-size: var(--text-section); font-weight: 650; }
      .section-tag { color: var(--ink-muted); font-size: var(--text-micro); }
      .empty {
        margin: 2rem 0; padding: 1.25rem;
        border: 1px dashed var(--border-strong); border-radius: var(--radius-panel);
        background: var(--bg-stage);
      }
      .empty h2 { margin: 0 0 0.4rem; font-size: var(--text-section); }
      .empty p { margin: 0 0 1rem; color: var(--ink-secondary); font-size: var(--text-caption); }

      /* --- hero --------------------------------------------------------- */
      .hero { position: relative; margin-top: 0.25rem; }
      .hero-button {
        position: relative; display: block; width: 100%; aspect-ratio: 16 / 9;
        padding: 0; overflow: hidden; text-align: left; cursor: pointer;
        border: 1px solid var(--border-subtle); border-radius: var(--radius-panel);
        background: linear-gradient(145deg, var(--bg-elevated), var(--bg-stage));
        color: var(--ink-primary);
      }
      .hero-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .hero-scrim {
        position: absolute; inset: 0;
        background: linear-gradient(0deg, rgba(9, 8, 12, 0.94) 0%, rgba(9, 8, 12, 0.45) 42%, transparent 75%),
          linear-gradient(90deg, rgba(9, 8, 12, 0.55), transparent 60%);
      }
      .hero-copy { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 0.25rem; padding: 0.9rem 1rem 1.1rem; }
      .hero-kicker { color: var(--accent); font-size: var(--text-micro); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
      .hero-name { font-family: var(--font-display); font-size: clamp(1.35rem, 5vw, 2rem); font-weight: var(--display-weight); line-height: 1.03; letter-spacing: var(--display-tracking); }
      .hero-desc { display: -webkit-box; overflow: hidden; color: var(--ink-secondary); font-size: var(--text-caption); -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .hero-dots { display: flex; justify-content: center; gap: 0.4rem; padding: 0.55rem 0 0; }
      .hero-dot {
        width: 0.5rem; height: 0.5rem; padding: 0; border: 0; border-radius: 50%;
        background: var(--border-strong); cursor: pointer;
      }
      .hero-dot[aria-current="true"] { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

      /* --- rows and cards ---------------------------------------------- */
      .strip { display: flex; gap: 0.7rem; overflow-x: auto; padding: 0.15rem 0 0.6rem; scroll-snap-type: x proximity; scrollbar-width: none; }
      .strip::-webkit-scrollbar { display: none; }
      .strip > * { flex: 0 0 auto; scroll-snap-align: start; }
      .poster {
        display: flex; flex-direction: column; width: 8.4rem; padding: 0;
        border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
        background: var(--bg-stage); text-align: left; overflow: hidden; cursor: pointer;
      }
      .poster-frame { position: relative; display: block; width: 100%; aspect-ratio: 2 / 3; background: linear-gradient(160deg, var(--bg-elevated), var(--bg-raised)); overflow: hidden; }
      .poster-art { display: block; width: 100%; height: 100%; object-fit: cover; }
      .poster-info { display: grid; gap: 0.1rem; padding: 0.45rem 0.55rem 0.6rem; }
      .poster-name { display: -webkit-box; overflow: hidden; font-size: 0.82rem; font-weight: 650; line-height: 1.25; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .poster-sub { color: var(--ink-muted); font-size: var(--text-micro); }
      .poster-note { display: -webkit-box; overflow: hidden; color: var(--ink-muted); font-size: var(--text-micro); -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .badge {
        position: absolute; top: 0.4rem; left: 0.4rem; z-index: 2;
        padding: 0.12rem 0.4rem; border-radius: var(--radius-pill);
        background: var(--bg-glass); font-size: var(--text-micro); font-weight: 700;
      }
      .badge-warn { color: var(--status-warn); border: 1px solid var(--status-warn); }
      .badge-danger { color: var(--status-danger); border: 1px solid var(--status-danger); }
      .continue {
        display: flex; flex-direction: column; width: 14.5rem; padding: 0; text-align: left;
        border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
        background: var(--bg-stage); overflow: hidden; cursor: pointer;
      }
      .continue-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--bg-raised); overflow: hidden; }
      .continue-art { width: 100%; height: 100%; object-fit: cover; display: block; }
      .continue-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: color-mix(in srgb, var(--bg-canvas) 70%, transparent); }
      .continue-bar span { display: block; height: 100%; background: var(--accent); }
      .continue-info { display: grid; gap: 0.15rem; padding: 0.45rem 0.6rem 0.6rem; }
      .continue-name { font-size: 0.84rem; font-weight: 650; line-height: 1.25; }
      .continue-note { color: var(--ink-secondary); font-size: var(--text-micro); }
      .continue-note[data-warn="true"] { color: var(--status-warn); }
      .continue[data-unplayable="true"] { opacity: 0.6; border-style: dashed; cursor: not-allowed; }
      .more-card { display: grid; place-items: center; min-width: 6rem; border: 1px dashed var(--border-strong); border-radius: var(--radius-card); background: transparent; color: var(--ink-secondary); cursor: pointer; }
      .row-note { margin: 0.2rem 0 0.6rem; color: var(--ink-muted); font-size: var(--text-caption); }

      /* --- grids (Discover, Search) ------------------------------------ */
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem; }
      .grid .poster { width: 100%; }
      .grid-foot { display: flex; justify-content: center; padding: 1rem 0 0.25rem; }
      .credit { display: grid; justify-items: center; gap: 0.35rem; margin: 2rem 0 0; padding: 1rem 0; border-top: 1px solid var(--border-subtle); }
      .tmdb-logo { display: block; width: 7rem; height: auto; }
      .tmdb-logo svg { display: block; width: 100%; height: auto; }
      .credit-notice { margin: 0; color: var(--ink-muted); font-size: var(--text-micro); text-align: center; }

      /* --- search ------------------------------------------------------- */
      .search-bar { display: flex; gap: 0.5rem; margin: 0.5rem 0 1rem; }
      .search-bar input { flex: 1 1 auto; min-width: 0; }
      .answer-row { margin-top: 1.2rem; }
      .answer-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.4rem; }
      .answer-head h2 { margin: 0; font-size: var(--text-section); }
      .answer-tag { color: var(--ink-muted); font-size: var(--text-micro); }

      /* --- library, addons, settings ----------------------------------- */
      .card-panel {
        padding: 1rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-panel);
        background: var(--bg-stage);
      }
      .addon-list, .settings-list { display: grid; gap: 0.55rem; margin: 0; padding: 0; list-style: none; }
      .addon-row { border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: var(--bg-stage); overflow: hidden; }
      .addon-summary {
        display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem;
        width: 100%; padding: 0.85rem 0.9rem; border: 0; background: transparent; text-align: left; cursor: pointer;
      }
      .addon-name { font-weight: 650; }
      .addon-version, .addon-id { color: var(--ink-muted); font-size: var(--text-micro); }
      .addon-details { padding: 0 0.9rem 0.9rem; border-top: 1px solid var(--border-subtle); }
      .facts { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.8rem; margin: 0.75rem 0; font-size: var(--text-caption); }
      .facts dt { color: var(--ink-muted); }
      .facts dd { margin: 0; overflow-wrap: anywhere; }
      .addon-controls { display: flex; flex-wrap: wrap; gap: 0.45rem; }
      .settings-category {
        display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 0.6rem; width: 100%;
        padding: 0.9rem 1rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
        background: var(--bg-stage); text-align: left; cursor: pointer;
      }
      .settings-category-title { font-weight: 650; }
      .settings-category-note { grid-column: 1; color: var(--ink-muted); font-size: var(--text-micro); }
      .settings-category-mark { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--ink-muted); font-size: 1.4rem; }
      .settings-section { margin-top: 1.4rem; }
      .settings-section h2 { margin: 0 0 0.5rem; font-size: var(--text-section); }
      .settings-copy { margin: 0 0 0.75rem; color: var(--ink-secondary); font-size: var(--text-caption); }
      .readout { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 0.8rem; margin: 0 0 0.75rem; font-size: var(--text-caption); }
      .readout dt { color: var(--ink-muted); }
      .readout dd { margin: 0; overflow-wrap: anywhere; }
      .device-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border-subtle); }
      .device-row:last-child { border-bottom: 0; }
      .device-name { font-weight: 600; }
      .device-date { color: var(--ink-muted); font-size: var(--text-micro); }

      /* --- the bottom navigation and the mini strip -------------------- */
      .bottom-nav {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 12;
        display: grid; grid-template-columns: repeat(6, 1fr);
        height: 4.5rem; padding: 0.25rem 0.2rem max(0.25rem, env(safe-area-inset-bottom));
        background: var(--bg-glass);
        border-top: 1px solid var(--border-subtle);
        backdrop-filter: blur(18px);
      }
      .nav-item {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.18rem;
        padding: 0.25rem 0.1rem; border: 1px solid transparent; border-radius: var(--radius-card);
        background: transparent; color: var(--ink-muted); font-size: 0.62rem; font-weight: 600; cursor: pointer;
      }
      .nav-item[aria-current="page"] { color: var(--ink-primary); background: var(--accent-soft); border-color: var(--accent-soft); }
      .nav-item svg { width: 1.25rem; height: 1.25rem; }
      .mini-strip {
        position: absolute; left: 0.6rem; right: 0.6rem; bottom: 4.65rem; z-index: 13;
        display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 0.4rem;
        padding: 0.45rem 0.55rem;
        border: 1px solid var(--border-subtle); border-radius: var(--radius-panel);
        background: var(--bg-glass); box-shadow: var(--shadow-panel);
        backdrop-filter: blur(18px);
      }
      .mini-live { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--ink-muted); font-size: var(--text-micro); text-transform: uppercase; letter-spacing: 0.07em; }
      .mini-live::before { content: ""; width: 0.4rem; height: 0.4rem; border-radius: 50%; background: var(--status-ok); }
      .mini-live[data-live="false"]::before { background: var(--status-warn); }
      .mini-center {
        display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 0.45rem;
        align-items: center; min-width: 0; padding: 0.35rem 0.4rem; border: 0; border-radius: var(--radius-control);
        background: transparent; text-align: left; cursor: pointer;
      }
      .mini-chevron { grid-row: 1 / span 2; color: var(--accent); font-size: 1.15rem; }
      .mini-name { overflow: hidden; font-size: 0.8rem; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
      .mini-episode { color: var(--ink-muted); font-size: var(--text-micro); }
      .alert {
        position: absolute; left: 0.75rem; right: 0.75rem; bottom: 9.6rem; z-index: 60;
        margin: 0; padding: 0.7rem 0.85rem;
        border: 1px solid var(--status-danger); border-radius: var(--radius-card);
        background: var(--status-danger-bg); color: var(--ink-primary); font-size: var(--text-caption);
      }

      /* --- pushed levels ------------------------------------------------ */
      .level-host {
        position: fixed; inset: 0; z-index: 40; overflow-y: auto;
        background:
          radial-gradient(70rem 34rem at 50% -14rem, var(--accent-soft), transparent 62%),
          var(--bg-canvas);
      }
      .level { min-height: 100%; padding-bottom: 2rem; }
      .level-head {
        position: sticky; top: 0; z-index: 4;
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.6rem 0.9rem;
        background: var(--bg-glass); border-bottom: 1px solid var(--border-subtle);
        backdrop-filter: blur(18px);
      }
      .level-title { margin: 0; font-family: var(--font-display); font-size: var(--text-section); letter-spacing: var(--display-tracking); }
      .level-body { padding: 1rem; }
      .title-hero { position: relative; min-height: 15rem; padding: 0.75rem 1rem 1.1rem; overflow: hidden; }
      .title-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .title-scrim { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg-canvas) 2%, rgba(9, 8, 12, 0.55) 45%, rgba(9, 8, 12, 0.2) 100%); }
      .title-copy { position: relative; z-index: 2; display: grid; gap: 0.5rem; margin-top: 5.5rem; }
      .title-logo { display: block; max-width: min(18rem, 80%); max-height: 5rem; object-fit: contain; object-position: left center; }
      .title-name { margin: 0; font-family: var(--font-display); font-size: var(--text-title); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); line-height: 1.04; }
      .title-desc { margin: 0.25rem 0 0; max-width: 65ch; color: var(--ink-secondary); font-size: var(--text-caption); line-height: 1.55; }
      .episode {
        display: flex; align-items: center; gap: 0.7rem; width: 100%; margin: 0 0 0.5rem; padding: 0.45rem;
        border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
        background: var(--bg-stage); text-align: left; cursor: pointer;
      }
      .episode-still { flex: 0 0 6.5rem; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; background: var(--bg-raised); }
      .episode-still img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .episode-label { color: var(--accent); font-size: var(--text-micro); font-weight: 700; }
      .episode-name { font-size: 0.84rem; font-weight: 600; }
      .stream-group { margin-top: 1rem; }
      .stream-group h2 { margin: 0 0 0.4rem; font-size: var(--text-caption); color: var(--ink-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
      .stream {
        display: grid; gap: 0.2rem; width: 100%; margin: 0 0 0.5rem; padding: 0.75rem 0.85rem;
        border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
        background: var(--bg-stage); text-align: left; cursor: pointer;
      }
      .stream-badges { display: flex; flex-wrap: wrap; gap: 0.25rem; }
      .stream-badge { color: var(--accent); font-size: var(--text-micro); font-weight: 700; }
      .stream-file { color: var(--ink-secondary); font-size: var(--text-micro); overflow-wrap: anywhere; }
      .stream-desc { color: var(--ink-muted); font-size: var(--text-micro); overflow-wrap: anywhere; }
      .stream-warn { color: var(--status-warn); font-size: var(--text-micro); }
      .stream-danger { color: var(--status-danger); font-size: var(--text-micro); }
      .confirm-layer { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 1.25rem; background: rgba(4, 3, 6, 0.72); }
      .confirm-card {
        width: min(24rem, 100%); padding: 1.25rem;
        border: 1px solid var(--border-strong); border-radius: var(--radius-panel);
        background: var(--bg-elevated); box-shadow: var(--shadow-panel);
      }
      .confirm-card h2 { margin: 0 0 0.5rem; font-family: var(--font-display); font-size: var(--text-section); }
      .confirm-card p { margin: 0 0 1rem; color: var(--ink-secondary); font-size: var(--text-caption); }

      /* --- surface 2: the expanded Cast Remote ------------------------- */
      .cast {
        position: fixed; inset: 0; z-index: 45; overflow-y: auto;
        background:
          radial-gradient(60rem 40rem at 50% -10rem, var(--accent-soft), transparent 60%),

      .cast-inner { display: flex; flex-direction: column; min-height: 100%; width: 100%; max-width: 34rem; margin: 0 auto; gap: 0.9rem; }
      .cast-head { display: grid; grid-template-columns: 2.75rem 1fr 2.75rem; align-items: center; gap: 0.5rem; }
      .cast-heading { text-align: center; }
      .cast-name { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cast-episode { display: block; color: var(--ink-muted); font-size: var(--text-micro); }
      .cast-poster {

        background: linear-gradient(160deg, var(--bg-elevated), var(--bg-raised));
        box-shadow: var(--shadow-panel);
      }
      .cast-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .cast-utilities { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
      .utility {
        display: grid; justify-items: center; gap: 0.25rem; padding: 0.6rem 0.35rem;
        border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
        background: var(--bg-raised); color: var(--ink-secondary); font-size: var(--text-micro); font-weight: 600; cursor: pointer;
      }

      .utility:disabled { opacity: 0.4; cursor: not-allowed; }
      .utility span { font-size: 1.1rem; }
      .volume-panel {
        display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.6rem;
        padding: 0.7rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: var(--bg-stage);
      }
      .volume-level { grid-column: 1; color: var(--ink-secondary); font-size: var(--text-caption); }
      .timeline { display: grid; gap: 0.25rem; }
      .timeline input { margin: 0; }
      .times { display: flex; justify-content: space-between; color: var(--ink-muted); font-size: var(--text-micro); }
      .transport { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.3rem; align-items: center; }
      .transport .btn { padding: 0.55rem 0.2rem; font-size: var(--text-micro); }
      .transport .primary-round { border-color: transparent; background: var(--accent); color: var(--ink-on-accent); }
      .extras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
      .extra-panel { padding: 0.75rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: var(--bg-stage); }
      .extra-panel h3 { margin: 0 0 0.5rem; font-size: var(--text-caption); color: var(--ink-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
      .extra-panel .chip-row { flex-wrap: wrap; overflow: visible; }
      .cast-footer { margin-top: auto; padding-top: 0.5rem; text-align: center; color: var(--ink-muted); font-size: var(--text-micro); }
      .cast-note { text-align: center; color: var(--ink-secondary); font-size: var(--text-caption); }
      .cast-note[data-danger="true"] { color: var(--status-danger); }

      /* --- surface 3: the Audio & Subtitles sheet ---------------------- */
      .sheet-layer {
        position: fixed; inset: 0; z-index: 55; display: flex; align-items: flex-end; justify-content: center;
        background: rgba(4, 3, 6, 0.64); backdrop-filter: blur(6px);
      }
      .sheet-panel {
        width: min(38rem, 100%); max-height: 86dvh; overflow-y: auto;
        padding: 0.9rem 1rem 1.25rem;
        border: 1px solid var(--border-strong); border-bottom: 0;
        border-radius: var(--radius-panel) var(--radius-panel) 0 0;
        background: var(--bg-glass);
        box-shadow: var(--shadow-panel);
      }
      .sheet-head { position: sticky; top: -0.9rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin: -0.9rem -1rem 0.5rem; padding: 0.75rem 1rem; background: var(--bg-glass); backdrop-filter: blur(18px); border-bottom: 1px solid var(--border-subtle); }
      .sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: var(--text-section); }
      .sheet-group { margin-top: 1rem; }
      .sheet-group h3 { margin: 0 0 0.45rem; color: var(--ink-secondary); font-size: var(--text-caption); text-transform: uppercase; letter-spacing: 0.08em; }
      .track {
        display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; width: 100%;
        margin: 0 0 0.4rem; padding: 0.65rem 0.75rem;
        border: 1px solid var(--border-subtle); border-radius: var(--radius-control);
        background: var(--bg-stage); text-align: left; cursor: pointer;
      }
      .track[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
      .track-marks { color: var(--ink-muted); font-size: var(--text-micro); }
      .delay-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }
      .delay-readout { min-width: 4.5rem; color: var(--ink-secondary); font-size: var(--text-caption); }

      @media (min-width: 720px) {
        .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .poster { width: 10rem; }
        .cast-inner { max-width: 38rem; }
      }
    </style>
  </head>
  <body>
    <!--
      The remote's capability list: every Action this page can send, and no
      other. It is the whole Action surface (ADR-0002): the remote is the Host's
      own window's equal, not a curated subset, and the two share one command
      surface. `host-wire` asserts this list against
      `host_core::Action::SPELLINGS` (#32), so a capability added for one client
      cannot go missing from the other. `dispatch` refuses to send a spelling
      that is not here, so the declaration is load-bearing rather than a
      comment: a control wired to an Action this list does not name throws
      rather than sending it.
    -->
    <script type="application/json" id="action-capabilities">["set_subtitle_language","clear_subtitle_language","set_featured_catalog","clear_featured_catalog","add_addon","reorder_addon","remove_addon","set_tmdb_key","clear_tmdb_key","sign_in_stremio","sign_out_stremio","pair_device","revoke_device","browse_catalog","search_catalogs","discover","search","open_title","open_discovered_title","find_streams","play_stream","resume","set_paused","seek","set_audio_track","set_subtitle_track","set_subtitle_delay","set_speed","set_volume","set_muted","next_chapter","previous_chapter","set_chapter","set_crop","set_aspect","next_episode","previous_episode","stop_playback"]</script>

    <!-- What a device that has not paired sees. -->
    <section id="pairing" class="pairing hidden">
      <form id="pair-form" class="pairing-card">
        <h1>Pair this device</h1>
        <p class="lede">
          Type the code the Host is showing. This device is remembered; the code
          is not needed again.
        </p>
        <div class="form-field">
          <label for="code">Pairing code</label>
          <input id="code" name="code" autocomplete="off" autocapitalize="characters"
                 spellcheck="false" inputmode="latin" maxlength="12" placeholder="ABCDEF" />
        </div>
        <div class="form-field">
          <label for="name">Name this device</label>
          <input id="name" name="name" autocomplete="off" maxlength="64" placeholder="Phone" />
        </div>
        <button type="submit" class="btn btn-primary" data-focusable>Pair</button>
        <p id="pair-error" class="error"></p>
      </form>
    </section>

    <div id="app" class="app hidden">
      <!-- Surface 1: six destinations, the docked strip, and the bottom nav. -->
      <section id="surface-browse" class="surface-browse" aria-label="Cast Remote">
        <header class="topbar">
          <span class="brand">streamingapp</span>
          <span id="connection" class="connection" data-live="true">live</span>
        </header>

        <main id="screen" class="screen"></main>
        <div id="mini-strip" class="mini-strip hidden" aria-label="Now playing"></div>
        <nav id="bottom-nav" class="bottom-nav" aria-label="Destinations"></nav>
        <p id="error" class="alert hidden" role="alert"></p>
      </section>

      <!-- Pushed levels: Titles, Streams, Settings sub-screens, confirms. -->
      <div id="level-host" class="level-host hidden"></div>

      <!-- Surface 2: the expanded Cast Remote. -->
      <section id="surface-remote" class="cast hidden" aria-label="Cast Remote — expanded"></section>

      <!-- Surface 3: the Audio & Subtitles sheet. -->
      <div id="sheet" class="sheet-layer hidden" role="dialog" aria-modal="true" aria-label="Audio and subtitles"></div>
    </div>

    <script>
      "use strict";

      // ---------------------------------------------------------------------
      // The wire: one page, one version, one capability list.
      // ---------------------------------------------------------------------
      const VERSION = 1;
      const TOKEN_KEY = "streamingapp.device.token";
      const CAPABILITIES = JSON.parse(document.getElementById("action-capabilities").textContent);

      // Spliced from `src/subtitle-languages.json` at serve time (#88): one list,
      // two clients. The picker does not carry a second copy.
      const SUBTITLE_LANGUAGES = /*__SPLICE_SUBTITLE_LANGUAGES__*/;
      const HOST_PICKS_PER_VIDEO = "Host picks per Video";
      // Spliced from the crate's own version, so About reads the binary's.
      const APP_VERSION = /*__SPLICE_VERSION__*/;

      // The keyboard column of `src/input.ts`, inlined because this page has no
      // build step. The overlap with the window's table is asserted by
      // `host-wire/src/remote.rs`; there is deliberately no pad column here —
      // the Gamepad API is not available on an insecure HTTP origin.
      const KEY_INTENTS = Object.freeze({
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right",
        Escape: "back",
        Backspace: "back",
        GoBack: "back",
      });

      // ---------------------------------------------------------------------
      // Safe HTML
      //
      // Every string that reaches the page — a Title's name, an Addon's own
      // words about a Stream, a poster — is escaped unless it is markup this
      // page built. `html` returns a `Raw`, and interpolating one inserts it
      // unescaped (that is how one template nests in another); everything else
      // is escaped, so an Addon cannot put markup, or an attribute break, into
      // another client's page.
      // ---------------------------------------------------------------------
      class Raw {
        constructor(markup) { this.markup = markup; }
      }
      function raw(markup) { return new Raw(markup); }
      function esc(value) {
        return String(value === null || value === undefined ? "" : value).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]),

      function interpolate(value) {
        if (value === null || value === undefined || value === false) { return ""; }
        if (value instanceof Raw) { return value.markup; }
        if (Array.isArray(value)) { return value.map(interpolate).join(""); }
        return esc(value);
      }
      function html(strings, ...values) {
        let out = "";
        for (let i = 0; i < strings.length; i += 1) {
          out += strings[i];
          if (i < values.length) { out += interpolate(values[i]); }
        }
        return raw(out);
      }
      const $ = (id) => document.getElementById(id);
      /** A boolean attribute, written only when it is true. */
      function off(condition) { return condition ? raw("disabled") : null; }
      function pressed(condition) { return condition ? "true" : "false"; }

      // ---------------------------------------------------------------------
      // The model: the pure decisions the surface is drawn from, the same ones
      // the Host's own window makes (src/*.ts). Kept here by hand because this
      // page has no build step (ADR-0017 §2); the Host is what decides, and
      // these only say how its facts read.
      // ---------------------------------------------------------------------
      const MOVIE = "movie";
      const SERIES = "series";
      const SKIP = "skip";
      const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
      const DELAY_STEP = 0.1;
      const ASPECTS = [
        { label: "Source", aspect: { kind: "source" } },
        { label: "16:9", aspect: { kind: "ratio", value: 16 / 9 } },
        { label: "4:3", aspect: { kind: "ratio", value: 4 / 3 } },
        { label: "21:9", aspect: { kind: "ratio", value: 21 / 9 } },
      ];
      const CROP_RATIOS = ASPECTS.filter((choice) => choice.aspect.kind === "ratio").map(
        (choice) => ({ label: choice.label, ratio: choice.aspect.value }),
      );
      const HERO_SLIDES = 4;

      const NAV = [
        { id: "home", label: "Home", icon: '<path d="M4 11.5 12 4l8 7.5V20h-5v-5H9v5H4z"/>' },
        { id: "discover", label: "Discover", icon: '<circle cx="12" cy="12" r="8"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/>' },
        { id: "search", label: "Search", icon: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>' },
        { id: "library", label: "Library", icon: '<path d="M5 4h5v16H5zM14 4h5v16h-5z"/>' },
        { id: "addons", label: "Addons", icon: '<path d="M9 3h6v4h4v6h-4v8H9v-8H5V7h4z"/>' },
        { id: "settings", label: "Settings", icon: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>' },
      ];

      const MOVIE_GENRES = [
        { id: 28, name: "Action" }, { id: 12, name: "Adventure" }, { id: 16, name: "Animation" },
        { id: 35, name: "Comedy" }, { id: 80, name: "Crime" }, { id: 99, name: "Documentary" },
        { id: 18, name: "Drama" }, { id: 10751, name: "Family" }, { id: 14, name: "Fantasy" },
        { id: 36, name: "History" }, { id: 27, name: "Horror" }, { id: 10402, name: "Music" },
        { id: 9648, name: "Mystery" }, { id: 10749, name: "Romance" }, { id: 878, name: "Science Fiction" },
        { id: 10770, name: "TV Movie" }, { id: 53, name: "Thriller" }, { id: 10752, name: "War" },
        { id: 37, name: "Western" },
      ];
      const SERIES_GENRES = [
        { id: 10759, name: "Action & Adventure" }, { id: 16, name: "Animation" }, { id: 35, name: "Comedy" },
        { id: 80, name: "Crime" }, { id: 99, name: "Documentary" }, { id: 18, name: "Drama" },
        { id: 10751, name: "Family" }, { id: 10762, name: "Kids" }, { id: 9648, name: "Mystery" },
        { id: 10763, name: "News" }, { id: 10764, name: "Reality" }, { id: 10765, name: "Sci-Fi & Fantasy" },
        { id: 10766, name: "Soap" }, { id: 10767, name: "Talk" }, { id: 10768, name: "War & Politics" },
        { id: 37, name: "Western" },
      ];
      function genresOf(kind) { return kind === SERIES ? SERIES_GENRES : MOVIE_GENRES; }
      const SEARCH_KINDS = [{ kind: MOVIE, label: "Movies" }, { kind: SERIES, label: "Series" }];

      function formatTime(seconds) {
        if (seconds === null || seconds === undefined || !isFinite(seconds) || seconds < 0) {
          return "--:--";
        }
        const whole = Math.floor(seconds);
        const minutes = Math.floor(whole / 60);
        const rest = whole % 60;
        const padded = String(rest).padStart(2, "0");
        if (minutes < 60) { return minutes + ":" + padded; }
        const hours = Math.floor(minutes / 60);
        return hours + ":" + String(minutes % 60).padStart(2, "0") + ":" + padded;
      }
      function remainingTime(position, duration) {
        if (position === null || duration === null || !isFinite(position) || !isFinite(duration)) {
          return "--:--";
        }
        return "\u2212" + formatTime(Math.max(0, duration - position));
      }
      function formatDelay(seconds) {
        const tenths = Math.round(seconds * 10) / 10;
        if (tenths === 0) { return "0.0 s"; }
        const magnitude = Math.abs(tenths).toFixed(1);
        return tenths > 0 ? "+" + magnitude + " s" : "\u2212" + magnitude + " s";
      }
      function stepDelay(seconds, by) { return Math.round((seconds + by) * 10) / 10; }
      function formatSpeed(rate) { return rate + "\u00d7"; }
      function formatVolume(level) { return Math.round(level) + "%"; }
      function chapterLabel(chapter) {
        const at = formatTime(chapter.time);
        return chapter.title ? at + " \u2014 " + chapter.title : at;
      }
      function chapterName(chapter) {
        return chapter.title || "Chapter " + (chapter.index + 1);
      }
      function speedSelected(rate, choice) {
        return rate !== null && rate !== undefined && Math.abs(rate - choice) < 1e-6;
      }
      function centredCrop(size, ratio) {
        const sourceRatio = size.width / size.height;
        let width;
        let height;
        if (sourceRatio > ratio) {
          height = size.height;
          width = Math.max(1, Math.min(size.width, Math.round(size.height * ratio)));
        } else {
          width = size.width;
          height = Math.max(1, Math.min(size.height, Math.round(size.width / ratio)));
        }
        return {
          width,
          height,
          x: Math.floor((size.width - width) / 2),
          y: Math.floor((size.height - height) / 2),
        };
      }
      function cropChoices(size) {
        const whole = { label: "Full frame", crop: { kind: "off" } };
        if (!size) { return [whole]; }
        return [whole].concat(
          CROP_RATIOS.map((choice) => ({
            label: choice.label,
            crop: Object.assign({ kind: "rectangle" }, centredCrop(size, choice.ratio)),
          })),
        );
      }
      function cropSelected(current, choice) {
        if (choice.kind === "off") { return current === null || current === undefined; }
        return current !== null && current !== undefined &&
          current.width === choice.width && current.height === choice.height &&
          current.x === choice.x && current.y === choice.y;
      }
      function aspectSelected(current, choice) {
        if (choice.kind === "source") {
          return current === null || current === undefined || current.kind === "source";
        }
        return current !== null && current !== undefined && current.kind === "ratio" &&
          Math.abs(current.value - choice.value) < 1e-3;
      }
      function formatBitrate(bits) {
        if (bits === null || bits === undefined) { return "\u2014"; }
        if (bits >= 1e6) { return (bits / 1e6).toFixed(1) + " Mbps"; }
        if (bits >= 1e3) { return Math.round(bits / 1e3) + " kbps"; }
        return bits + " bps";
      }
      function statisticsLines(statistics) {
        const stats = statistics || {};
        return [
          { label: "Bitrate", value: formatBitrate(stats.bitrate) },
          {
            label: "Dropped frames",
            value: stats.droppedFrames === null || stats.droppedFrames === undefined
              ? "\u2014" : String(stats.droppedFrames),
          },
          { label: "Hardware decode", value: stats.hardwareDecode || "\u2014" },
        ];
      }
      function orderedTracks(tracks, kind) {
        const ofKind = tracks.filter((track) => track.kind === kind);
        return ofKind.filter((track) => track.embedded).concat(ofKind.filter((t) => !t.embedded));
      }
      function subtitlesOn(tracks) {
        return tracks.some((track) => track.kind === "subtitle" && track.selected);
      }
      function trackLabel(track) {
        const words = [track.title, track.language, track.codec].filter(Boolean);
        return words.length > 0 ? words.join(" \u00b7 ") : "Track " + track.id;
      }
      function trackMarks(track) {
        const marks = [];
        if (track.embedded) { marks.push("embedded"); }
        if (track.forced) { marks.push("forced"); }
        if (track.default) { marks.push("default"); }
        return marks;
      }
      function watching(state) { return state !== "idle"; }
      function controllable(state) {
        return state === "opening" || state === "playing" || state === "paused";
      }
      function transportable(state) { return state === "playing" || state === "paused"; }
      function previousEpisodeDisabled(episode) {
        return episode === null || (episode.season === 1 && episode.episode === 1);
      }
      function nextEpisodeDisabled(episode) { return episode === null; }
      function pictureNote(picture) {
        if (picture === "own_window") {
          return "The picture is in mpv's own window on the Host \u2014 it cannot be drawn here.";
        }
        if (picture === "nowhere") { return "This Host has no picture: nothing is drawn."; }
        return null;
      }
      function badgeLines(named) {
        return String((named && named.name) || "").split("\n").map((line) => line.trim())
          .filter(Boolean);
      }
      function playingName(nowPlaying) {
        if (!nowPlaying) { return "a Stream"; }
        const badges = badgeLines(nowPlaying).join(" \u00b7 ");
        return badges || nowPlaying.filename || "a Stream";
      }
      const QUALITY = /\b(4k|8k|2160p|1440p|1080p|720p|576p|480p|uhd|hdr(?:10)?|dv|dolby\s*vision)\b/i;
      function qualityBadge(nowPlaying) {
        if (!nowPlaying) { return null; }
        return badgeLines(nowPlaying).find((line) => QUALITY.test(line)) || null;
      }
      function streamTitle(nowPlaying) {
        if (!nowPlaying) { return "a Stream"; }
        const quality = qualityBadge(nowPlaying);
        const words = badgeLines(nowPlaying).filter((line) => line !== quality);
        return words.join(" \u00b7 ") || nowPlaying.filename || "a Stream";
      }
      function playabilityNote(playback) {
        return playback.kind === "info_hash"
          ? "Not playable yet \u2014 a torrent this Host cannot fetch." : null;
      }
      function warningNote(warning) {
        switch (warning) {
          case "not_web_ready":
            return "Not web-ready \u2014 the Addon says this URL is not fit for a browser.";
          case "p2p": return "Peer-to-peer \u2014 this Stream comes from peers.";
          case "proxy_headers": return "Wants request headers, which the Host does not send yet.";
          default: return warning;
        }
      }
      function streamName(stream) {
        const first = badgeLines(stream)[0];
        return first || stream.filename || "this Stream";
      }
      function unplayableNote(stream) {
        const why = playabilityNote(stream.playback);
        return why === null ? streamName(stream) : streamName(stream) + " \u2014 " + why;
      }
      function isSeries(title) { return title.type === SERIES; }
      function seasonsOf(title) {
        const seasons = new Map();
        for (const video of title.videos) {
          const season = video.season === null || video.season === undefined ? null : video.season;
          if (seasons.has(season)) { seasons.get(season).push(video); } else { seasons.set(season, [video]); }
        }
        return Array.from(seasons, ([season, videos]) => ({ season, videos }));
      }
      function seasonName(season) {
        if (season === null) { return "Videos"; }
        return season === 0 ? "Specials" : "Season " + season;
      }
      function labelOf(video) {
        if (video.season === null && video.episode === null) { return null; }
        const season = video.season === null ? "" : "S" + video.season;
        const episode = video.episode === null ? "" : "E" + video.episode;
        return season + episode;
      }
      function nameOf(title, preview) {
        if (title.name === title.id && preview && preview.name) { return preview.name; }
        return title.name;
      }
      function posterOf(title, preview) { return title.poster || (preview && preview.poster) || null; }
      function releaseOf(title, preview) { return title.releaseInfo || (preview && preview.releaseInfo) || null; }

            return ["library", s.protection.stremioHeld].join("::");
          case "addons":
            return ["addons", addons, state.addons.expanded, state.addons.status ? state.addons.status.kind : ""].join("::");
          case "settings":
            return "settings";
          default:
            return state.destination;
        }
      }

      function levelSignature() {
        const level = state.levels[state.levels.length - 1];
        if (!level) { return "none"; }
        const s = state.snapshot;
        switch (level.kind) {
          case "title":
            return ["title", level.loading, level.title ? level.title.id : "", level.shownSeason,
              level.selected ? level.selected.id : "", level.failure ? level.failure.kind : ""].join("|");
          case "streams":
            return ["streams", level.loading, level.groups ? level.groups.length : "",
              level.groups ? level.groups.map((group) => group.addon + ":" + group.streams.length).join(",") : "",
              level.failure ? level.failure.kind : "", level.chosen ? streamName(level.chosen) : ""].join("|");
          case "settings":
            return ["settings", level.category, JSON.stringify({
              addons: s ? s.addons.map((addon) => addon.id + ":" + addon.version) : [],
              protection: s ? s.protection : null,
              address: s ? s.address : null,
              pairing: s ? s.pairingCode : null,
              devices: s ? s.devices.map((device) => device.id) : [],
              preferences: s ? s.preferences : null,
              featured: s ? s.featuredCatalog : null,
            }), level.failure ? level.failure.kind : ""].join("|");
          case "confirm":
            return ["confirm", level.id, level.failure ? level.failure.kind : ""].join("|");
          case "episodes":
            return ["episodes", level.loading, level.title ? level.title.id : "",
              level.shownSeason, level.failure ? level.failure.kind : ""].join("|");
          default:
            return level.kind;
        }
      }

      function miniSignature() {
        const p = playback();
        if (!p || !watching(p.state)) { return "none"; }
        return JSON.stringify({
          state: p.state,
          playing: p.nowPlaying ? p.nowPlaying.video.type + "/" + p.nowPlaying.video.id : null,
          episode: p.episode,
          online: state.online,
          device: state.device ? state.device.name : null,
        });
      }

      function castSignature() {
        const p = playback();
        if (!p || !watching(p.state)) { return "none"; }
        return JSON.stringify({
          open: state.cast,
          volumeOpen: state.volumeOpen,
          morePanel: state.morePanel,
          showStatistics: state.showStatistics,
          state: p.state,
          playing: p.nowPlaying ? p.nowPlaying.video.type + "/" + p.nowPlaying.video.id : null,
          episode: p.episode,
          duration: p.duration,
          tracks: p.tracks,
          muted: p.muted,
          volume: p.volume,
          speed: p.speed,
          chapters: p.chapters,
          chapter: p.chapter,
          crop: p.crop,
          aspect: p.aspect,
          resolution: p.resolution,
          statistics: p.statistics,
          failure: p.failure,
          online: state.online,
          device: state.device ? state.device.name : null,
          address: state.snapshot ? state.snapshot.address : null,
          progress: state.snapshot
            ? state.snapshot.watchProgress.map((entry) => entry.video.id + ":" + entry.title.name + ":" +
              entry.title.poster + ":" + entry.title.background).join("|")
            : "",
        });
      }

      function sheetSignature() {
        const p = playback();
        if (!state.sheet || !p || !watching(p.state)) { return "none"; }
        return JSON.stringify({ tracks: p.tracks, delay: p.subtitleDelay });
      }

      // --- the base screen -------------------------------------------------
      function renderScreen() {
        const view = captureView();
        metaIndex.clear();
        rowIndex.clear();
        entryIndex.clear();
        const screen = $("screen");
        screen.innerHTML = renderDestination().markup;
        state.screenSignature = screenSignature();
        scheduleHero();
        if (!state.focusTarget) { restoreView(view); }
      }

      function renderDestination() {
        if (!state.snapshot) { return html`<p class="note">Waiting for the Host\u2026</p>`; }
        switch (state.destination) {
          case "home": return renderHome();
          case "discover": return renderDiscover();
          case "search": return renderSearch();
          case "library": return renderLibrary();
          case "addons": return renderAddons();
          case "settings": return renderSettings();
          default: return renderHome();
        }
      }

      // --- Home -------------------------------------------------------------
      function renderHome() {
        const s = state.snapshot;
        const rows = state.home.rows;
        const catalogs = declaredCatalogs(s);
        const featured = featuredRow(s, rows);
        const slides = featured ? heroSlides(featured.metas) : [];
        const active = slides.length > 0 ? Math.min(state.heroIndex, slides.length - 1) : 0;
        const slide = slides[active];
        const heroMeta = slide && featured
          ? featured.metas.find((meta) => meta.id === slide.id) || null : null;
        if (heroMeta) { metaIndex.set("hero|" + slide.id, heroMeta); }
        const empty = catalogs.length === 0;

        return html`
          <h1 class="screen-title">Home</h1>
          ${slide
            ? html`
                <section class="hero" aria-label="Featured">
                  <button type="button" class="hero-button lift" data-focusable data-focus-key="home-hero"
                          data-a="open-featured" data-ref="hero|${slide.id}" aria-label="Featured Title: ${slide.name}. Open Title.">
                    ${slide.art ? html`<img class="hero-art" src="${slide.art}" alt="" data-art="${slide.artKind}" />` : null}
                    <span class="hero-scrim" aria-hidden="true"></span>
                    <span class="hero-copy">
                      <span class="hero-kicker">${featured ? featured.name : "Featured"}</span>
                      <span class="hero-name">${slide.name}</span>
                      ${slide.description ? html`<span class="hero-desc">${slide.description}</span>` : null}
                    </span>
                  </button>
                  ${slides.length > 1
                    ? html`<div class="hero-dots">${slides.map((dot, index) => html`
                        <button type="button" class="hero-dot" data-focusable data-a="hero-slide"
                                data-slide="${index}" data-focus-key="hero-dot-${index}"
                                aria-current="${index === active}">
                          <span class="visually-hidden">Slide ${index + 1}</span>
                        </button>`)}</div>`
                    : null}
                </section>`
            : null}

          ${s.watchProgress.length > 0
            ? html`
                <section aria-labelledby="continue-heading">
                  <div class="section-head">
                    <h2 id="continue-heading">Continue watching</h2>
                    <span class="section-tag">Host Watch progress</span>
                  </div>
                  <div class="strip">
                    ${s.watchProgress.map((entry) => {
                      const key = entry.title.type + "/" + entry.video.id;
                      entryIndex.set(key, entry);
                      const art = continueArt(entry);
                      const fraction = progressOf(entry);
                      const playable = resumable(entry);
                      return html`
                        <button type="button" class="continue lift" data-focusable
                                data-focus-key="continue-${entry.video.id}"
                                data-a="resume" data-ref="${key}"
                                ${off(!playable)} data-unplayable="${!playable}">
                          <span class="continue-frame">
                            ${art ? html`<img class="continue-art" src="${art}" alt="" loading="lazy" />` : null}
                            ${fraction !== null
                              ? html`<span class="continue-bar"><span style="width:${Math.round(fraction * 100)}%"></span></span>`
                              : null}
                          </span>
                          <span class="continue-info">
                            <span class="continue-name">${cardName(entry)}</span>
                            <span class="continue-note" data-warn="${!playable}">${cardNote(entry)}</span>
                          </span>
                        </button>`;
                    })}
                  </div>
                </section>`
            : null}

          ${empty
            ? html`
                <div class="empty">
                  <h2>${s.addons.length === 0 ? "No Addons are configured" : "No Catalogs are configured"}</h2>
                  <p>${s.addons.length === 0
                    ? "Home draws its rows from the Catalogs Addons offer. Add an Addon to start browsing."
                    : "The configured Addons offer no Catalogs, so Home has no rows to draw. Choose an Addon that offers one."}</p>
                  <button type="button" class="btn btn-primary" data-focusable data-a="destination" data-destination="addons">
                    Open Addons
                  </button>
                </div>`
            : null}

          ${state.home.loading ? html`<p class="note" role="status">Loading the Addons' Catalogs\u2026</p>` : null}

          ${rows.map((row) => {
            const key = keyOf(row);
            rowIndex.set(key, row);
            return html`
              <section aria-labelledby="row-${key}">
                <div class="section-head">
                  <h2 id="row-${key}">${row.name}</h2>
                  <span class="section-tag">${addonName(s, row.addon) || row.addon}</span>
                </div>
                ${row.failure ? html`<p class="error" role="alert">${explain(row.failure)}</p>` : null}
                ${row.metas.length === 0 && !row.failure
                  ? html`<p class="row-note">This catalog is empty.</p>` : null}
                <div class="strip">
                  ${row.metas.map((meta) => renderPoster(row.addon, meta))}
                  ${pageable(s, row) && !row.done && (row.metas.length > 0 || row.failure !== null)
                    ? html`<button type="button" class="more-card" data-focusable data-a="page-row"
                            data-ref="${key}" data-focus-key="page-${key}">More</button>`
                    : null}
                </div>
              </section>`;
          })}
        `;
      }

      function renderPoster(addon, meta) {
        const ref = addon + "|" + meta.type + "|" + meta.id;
        metaIndex.set(ref, meta);
        return html`
          <button type="button" class="poster lift" data-focusable data-focus-key="poster-${ref}"
                  data-a="open-card" data-source="addon" data-addon="${addon}" data-ref="${ref}">
            <span class="poster-frame">
              ${meta.poster ? html`<img class="poster-art" src="${meta.poster}" alt="" loading="lazy" />` : null}
            </span>
            <span class="poster-info">
              <span class="poster-name">${meta.name}</span>
              ${meta.releaseInfo ? html`<span class="poster-sub">${meta.releaseInfo}</span>` : null}
              ${meta.description ? html`<span class="poster-note">${meta.description}</span>` : null}
            </span>
          </button>`;
      }

      function renderTmdbPoster(meta, kind) {
        metaIndex.set(meta.id, meta);
        const unplayable = !discoverPlayable(state.snapshot ? state.snapshot.addons : [], kind) ||
          state.unplayable.has(meta.id);
        return html`
          <button type="button" class="poster lift" data-focusable data-focus-key="tmdb-${meta.id}"
                  data-a="open-card" data-source="tmdb" data-ref="${meta.id}">
            <span class="poster-frame">
              ${meta.poster ? html`<img class="poster-art" src="${meta.poster}" alt="" loading="lazy" />` : null}
              ${unplayable ? html`<span class="badge badge-danger">Unplayable</span>` : null}
            </span>
            <span class="poster-info">
              <span class="poster-name">${meta.name}</span>
              ${meta.releaseInfo ? html`<span class="poster-sub">${meta.releaseInfo}</span>` : null}
              ${meta.description ? html`<span class="poster-note">${meta.description}</span>` : null}
            </span>
          </button>`;
      }

      // --- Discover ---------------------------------------------------------
      function renderDiscover() {
        const s = state.snapshot;
        const keyed = s.protection.tmdbHeld;
        const discover = state.discover;
        const couldPlay = discoverPlayable(s.addons, discover.kind);
        const moreAvailable = !discover.feed.done &&
          (discover.feed.items.length > 0 || discover.feed.failure !== null);

        return html`
          <h1 class="screen-title">Discover</h1>
          ${!keyed
            ? html`
                <div class="empty">
                  <h2>Discover is powered by TMDB</h2>
                  <p>TMDB supplies the weekly Trending feed and the genres it can be filtered by.
                    Add a TMDB API key in <strong>Settings \u2192 Credentials</strong> to browse it.</p>
                  <button type="button" class="btn btn-primary" data-focusable data-a="credentials"
                          data-focus-key="discover-credentials">Open Settings \u2192 Credentials</button>
                </div>`
            : html`
                <p class="lede">TMDB's weekly Trending feed. Choose a kind, narrow it by a genre, or
                  page on through what is popular now.</p>

                <div class="chip-row" aria-label="Kind">
                  <button type="button" class="chip" data-focusable data-a="discover-kind" data-kind="movie"
                          data-focus-key="discover-movie" aria-pressed="${pressed(discover.kind === MOVIE)}">Movie</button>
                  <button type="button" class="chip" data-focusable data-a="discover-kind" data-kind="series"
                          data-focus-key="discover-series" aria-pressed="${pressed(discover.kind === SERIES)}">Series</button>
                </div>

                <div class="chip-row" aria-label="Genres">
                  <button type="button" class="chip" data-focusable data-a="discover-genre" data-genre="all"
                          data-focus-key="discover-genre-all" aria-pressed="${pressed(discover.genre === null)}">All genres</button>
                  ${genresOf(discover.kind).map((genre) => html`
                    <button type="button" class="chip" data-focusable data-a="discover-genre"
                            data-genre="${genre.id}" data-focus-key="discover-genre-${genre.id}"
                            aria-pressed="${pressed(discover.genre === genre.id)}">${genre.name}</button>`)}
                </div>

                ${discover.loading && discover.feed.page === 0
                  ? html`<p class="note" role="status">Looking for Titles\u2026</p>` : null}
                ${discover.feed.failure
                  ? html`<p class="error" role="alert">${explain(discover.feed.failure)}</p>` : null}

                <section class="grid" aria-label="Discover titles">
                  ${discover.feed.items.map((meta) => renderTmdbPoster(meta, discover.kind))}
                </section>
                ${!couldPlay && discover.feed.items.length > 0
                  ? html`<p class="row-note">No configured Addon answers for TMDB Titles of this kind,
                      so these are marked unplayable.</p>` : null}
                ${moreAvailable
                  ? html`<div class="grid-foot"><button type="button" class="btn" data-focusable
                          data-a="discover-more" data-focus-key="discover-more"
                          ${off(discover.loading)}>More</button></div>` : null}
            `}

          <footer class="credit">
            <span class="tmdb-logo">/*__SPLICE_TMDB_LOGO__*/</span>
            <p class="credit-notice">This product uses the TMDB API but is not endorsed or certified by TMDB</p>
          </footer>
        `;
      }

      // --- Search -----------------------------------------------------------
      function renderSearch() {
        const s = state.snapshot;
        const keyed = s.protection.tmdbHeld;
        const search = state.search;

        return html`
          <h1 class="screen-title">Search</h1>
          <p class="lede">${keyed
            ? "TMDB searches its Movies and Series together: both rows are asked, and each page is read fresh."
            : "Every Addon's Catalog that offers a search answers, in the order the Addons are configured."}</p>

          <form id="search-form" class="search-bar" role="search">
            <label class="visually-hidden" for="search-input">Search for a Title</label>
            <input id="search-input" type="search" autocomplete="off" placeholder="${keyed
              ? "Search TMDB for a film or a series" : "Search the Addons' searchable Catalogs"}"
              value="${search.draft}" data-focusable data-focus-key="search-input" />
            <button type="submit" class="btn btn-primary" data-focusable data-focus-key="search-submit"
                    ${off(search.draft.trim().length === 0)}>Search</button>
          </form>

          ${keyed && search.committed !== null
            ? SEARCH_KINDS.map(({ kind, label }) => {
                const feed = search[kind];
                const loading = search.paging.includes(kind);
                const moreAvailable = !loading && !feed.done && (feed.page > 0 || feed.failure !== null);
                return html`
                  <section class="answer-row" aria-label="${label}">
                    <div class="answer-head">
                      <h2>${label}</h2>
                      <span class="answer-tag">TMDB</span>
                    </div>
                    ${feed.failure ? html`<p class="error" role="alert">${explain(feed.failure)}</p>` : null}
                    <div class="grid">
                      ${feed.items.map((meta) => renderTmdbPoster(meta, kind))}
                    </div>
                    ${loading
                      ? html`<p class="note" role="status">${feed.items.length === 0
                          ? "Looking for " + label.toLowerCase() + "\u2026"
                          : "Looking for more " + label.toLowerCase() + "\u2026"}</p>`
                      : !feed.failure && feed.done && feed.items.length === 0
                        ? html`<p class="note">No ${label.toLowerCase()} matched \u201c${search.committed}\u201d.</p>`
                        : null}
                    ${moreAvailable
                      ? html`<div class="grid-foot"><button type="button" class="btn" data-focusable
                              data-a="search-more" data-kind="${kind}" data-focus-key="search-more-${kind}"
                              ${off(loading)}>More</button></div>` : null}
                  </section>`;
              })
            : null}

          ${!keyed && search.committed !== null
            ? html`
                <div class="answer-row">
                  ${search.catalog.loading
                    ? html`<p class="note" role="status">Searching every searchable Catalog\u2026</p>` : null}
                  ${search.catalog.failure
                    ? html`<p class="error" role="alert">${explain(search.catalog.failure)}</p>` : null}
                  ${(search.catalog.rows || []).map((row) => html`
                    <section class="answer-row" aria-label="${row.name}">
                      <div class="answer-head">
                        <h2>${row.name}</h2>
                        <span class="answer-tag">${addonName(s, row.addon) || row.addon}</span>
                      </div>
                      ${row.failure ? html`<p class="error" role="alert">${explain(row.failure)}</p>` : null}
                      <div class="grid">
                        ${row.metas.map((meta) => renderPoster(row.addon, meta))}
                      </div>
                      ${!row.failure && row.sent === 0
                        ? html`<p class="note">This Catalog answered with no match.</p>` : null}
                    </section>`)}
                  ${!search.catalog.loading && !search.catalog.failure &&
                    search.catalog.rows && search.catalog.rows.length === 0
                    ? html`<p class="note">No Addon offers a Catalog that can be searched.</p>` : null}
                </div>`
            : null}
        `;
      }

      // --- Library ----------------------------------------------------------
      function renderLibrary() {
        const s = state.snapshot;
        return html`
          <h1 class="screen-title">Library</h1>
          ${s.protection.stremioHeld
            ? html`<p class="lede">Signed in to Stremio. The Titles saved in your account will appear
                here once the Library is built.</p>`
            : html`
                <p class="lede">Your Library will hold the Titles saved in your Stremio account. It is
                  not built yet \u2014 sign in to Stremio to connect the account it will draw from.</p>
                ${renderStremioForm("library")} `}
        `;
      }

      function renderStremioForm(prefix, allowSignOut) {
        const s = state.snapshot;
        if (s.protection.stremioHeld) {
          if (!allowSignOut) { return null; }
          return html`<button type="button" class="btn" data-focusable data-a="sign-out-stremio"
                  data-focus-key="sign-out-stremio">Sign out</button>`;
        }
        return html`
          <form id="${prefix}-stremio-form" class="card-panel" novalidate>
            <div class="form-field">
              <label for="${prefix}-stremio-email">Stremio email</label>
              <input id="${prefix}-stremio-email" type="email" autocomplete="off"
                     placeholder="you@example.com" data-focusable data-focus-key="${prefix}-stremio-email" />
            </div>
            <div class="form-field">
              <label for="${prefix}-stremio-password">Stremio password</label>
              <input id="${prefix}-stremio-password" type="password" autocomplete="off"
                     placeholder="the password Stremio knows" data-focusable data-focus-key="${prefix}-stremio-password" />
            </div>
            <button type="submit" class="btn btn-primary" data-focusable data-focus-key="${prefix}-stremio-submit">Sign in</button>
          </form>`;
      }

      // --- Addons -----------------------------------------------------------
      function renderAddons() {
        const s = state.snapshot;
        const addons = s.addons;
        return html`
          <h1 class="screen-title">Addons</h1>
          <p class="lede">An Addon's manifest URL adds it. The Host fetches and reads the manifest,
            keeps the Addon, and Home's Catalog rows follow your order.</p>

          <form id="addon-form" class="card-panel">
            <div class="form-field">
              <label for="manifest-url">Addon manifest URL</label>
              <input id="manifest-url" placeholder="https://example.com/manifest.json"
                     autocomplete="off" data-focusable data-focus-key="manifest-url" />
            </div>
            <button type="submit" class="btn btn-primary" data-focusable data-focus-key="add-addon-submit">Add</button>
          </form>

          ${state.addons.status
            ? html`<p class="status" role="status">${state.addons.status.kind === "added"
                ? state.addons.status.name + " was added."
                : (state.addons.status.name
                  ? "That manifest is already configured as " + state.addons.status.name +
                    "; the Host refreshed that Addon instead of adding a second one."
                  : "That manifest is already configured; the Host refreshed that Addon instead of adding a second one.")}</p>`
            : null}

          ${addons.length === 0
            ? html`<p class="note">No Addons are configured yet. Paste an Addon's manifest URL above to
                add the first one.</p>`
            : html`
                <ul class="addon-list">
                  ${addons.map((addon, index) => {
                    const open = state.addons.expanded === addon.id;
                    return html`
                      <li class="addon-row" data-expanded="${open}">
                        <button type="button" class="addon-summary" data-focusable
                                data-a="addon-toggle" data-id="${addon.id}"
                                data-focus-key="addon-${addon.id}" aria-expanded="${open}">
                          <span class="addon-name">${addon.name}</span>
                          <span class="addon-version">${addon.version}</span>
                        </button>
                        ${open
                          ? html`
                              <div class="addon-details">
                                <dl class="facts">
                                  <dt>Id</dt><dd>${addon.id}</dd>
                                  <dt>Resources</dt><dd>${resourcesOf(addon)}</dd>
                                  <dt>Types</dt><dd>${joinOrNone(addon.types)}</dd>
                                  <dt>Catalogs</dt><dd>${catalogsOf(addon)}</dd>
                                </dl>
                                <div class="addon-controls">
                                  <button type="button" class="btn" data-focusable data-a="addon-move"
                                          data-id="${addon.id}" data-delta="-1"
                                          data-focus-key="addon-${addon.id}-up"
                                          ${off(moveTarget(index, -1, addons.length) === null)}>Move up</button>
                                  <button type="button" class="btn" data-focusable data-a="addon-move"
                                          data-id="${addon.id}" data-delta="1"
                                          data-focus-key="addon-${addon.id}-down"
                                          ${off(moveTarget(index, 1, addons.length) === null)}>Move down</button>
                                  <button type="button" class="btn btn-danger" data-focusable data-a="addon-remove"
                                          data-id="${addon.id}" data-focus-key="addon-${addon.id}-remove">Remove</button>
                                </div>
                              </div>`
                          : null}
                      </li>`;
                  })}
                </ul>`}
        `;
      }

      // --- Settings ---------------------------------------------------------
      function renderSettings() {
        const categories = [
          { id: "credentials", title: "Credentials", note: "The secret store, the TMDB key, and the Stremio account." },
          { id: "preferences", title: "Preferences", note: "Subtitle language and the one Catalog Home's hero is drawn from." },
          { id: "remote-devices", title: "Remote devices", note: "The address a browser pairs with, the code, and paired devices." },
          { id: "about", title: "About/Credits", note: "The app version, the licences, and TMDB attribution." },
        ];
        return html`
          <h1 class="screen-title">Settings</h1>
          <p class="lede">The Host's credentials, preferences, paired devices, and the credits its
            software and data sources ask it to carry.</p>
          <ul class="settings-list">
            ${categories.map((category) => html`
              <li>
                <button type="button" class="settings-category" data-focusable
                        data-a="settings-category" data-category="${category.id}"
                        data-focus-key="settings-${category.id}">
                  <span class="settings-category-title">${category.title}</span>
                  <span class="settings-category-note">${category.note}</span>
                  <span class="settings-category-mark" aria-hidden="true">\u203a</span>
                </button>
              </li>`)}
          </ul>
        `;
      }

      // --- the level stack --------------------------------------------------
      function renderLevel() {
        const view = captureView();
        const host = $("level-host");
        const level = state.levels[state.levels.length - 1];
        if (!level) {
          host.classList.add("hidden");
          host.innerHTML = "";
          state.levelSignature = "none";
          if (!state.focusTarget) { restoreView(view); }
          return;
        }
        videoIndex.clear();
        groupIndex.clear();
        aspectIndex.clear();
        cropIndex.clear();
        host.classList.remove("hidden");
        host.innerHTML = renderLevelMarkup(level).markup;
        state.levelSignature = levelSignature();
        if (!state.focusTarget) { restoreView(view); }
      }

      function levelFrame(title, body) {
        return html`
          <div class="level">
            <header class="level-head">
              <button type="button" class="btn btn-ghost" data-focusable data-a="pop-level"
                      data-focus-key="level-back">\u2039 Back</button>
              <h1 class="level-title">${title}</h1>
            </header>
            <div class="level-body">${body}</div>
          </div>`;
      }

      function renderLevelMarkup(level) {
        switch (level.kind) {
          case "title": return renderTitleLevel(level);
          case "streams": return renderStreamsLevel(level);
          case "settings": return renderSettingsLevel(level);
          case "confirm": return renderConfirmLevel(level);
          case "episodes": return renderEpisodesLevel(level);
          default: return levelFrame("Error", html`<p class="error">Unknown level.</p>`);
        }
      }

      function renderTitleLevel(level) {
        const preview = level.preview;
        if (level.loading) {
          const art = preview && (preview.background || preview.poster);
          return html`
            <div class="level">
              <header class="level-head">
                <button type="button" class="btn btn-ghost" data-focusable data-a="pop-level"
                        data-focus-key="level-back">\u2039 Back</button>
                <h1 class="level-title">Opening ${preview ? preview.name : "Title"}</h1>
              </header>
              <div class="title-hero">
                ${art ? html`<img class="title-art" src="${art}" alt="" />` : null}
                <span class="title-scrim" aria-hidden="true"></span>
                <div class="title-copy">
                  <h2 class="title-name">${preview ? preview.name : "Title"}</h2>
                  <p class="title-desc">Looking for this Title\u2026</p>
                </div>
